  };
  const MAX_BOX = 50000;
  const B_FILZ = { gruen: C(16, 96, 58), blau: C(20, 70, 120), rot: C(120, 22, 30) };

  const B = {
    z: 'SETZEN', zeit: 0, zt: 0,
    konf: Object.assign({ tipps: true, zaehler: false, tempo: 'normal', filz: 'gruen' }, SPIELBANK),
    schlitten: [], pos: 0, schnitt: 0, mischenNoetig: false,
    boxen: [{ einsatz: 0, haende: [], versicherung: 0 }, { einsatz: 0, haende: [], versicherung: 0 }, { einsatz: 0, haende: [], versicherung: 0 }],
    bank: [],
    akt: { box: -1, hand: -1 },
    letzte: [0, 0, 0],
    chipIdx: 1,
    plan: [],
    planEnde: 0,
    kreditAnzeige: 0,
    letzterGewinn: 0,
    stat: { haende: 0, gewonnen: 0, verloren: 0, push: 0, bj: 0, doppelt: 0, geteilt: 0, aufgegeben: 0, einsatz: 0, auszahlung: 0, groesster: 0, versichert: 0 },
    ov: 'KEINS', dialog: null, optionen: null,
    lauf: 0, gesehen: 0,
    mx: -1, my: -1, dirty: false,
    ablage: 0,
    mischT: 9,
    geladen: false,
    tabelleCache: null,
    matheKonfKey: '',
    mathe: null,
    heKonfKey: '',
    he: 0
  };
  const meld = new Meldungen();
  const partikel = new Partikel();
  const knoepfe = new KnopfGruppe();
  const ovKnoepfe = new KnopfGruppe();
  let LB = null;
  let btn = {};
  const SPIELREIHENFOLGE = [2, 1, 0]; // rechts beginnt ("first base")

  // ---------------------------------------------------------------- Karten & Werte
  function handWert(karten) {
    let t = 0, asse = 0;
    for (let i = 0; i < karten.length; i++) {
      const w = karteWert(karten[i].c);
      if (w === 11) {
        asse++;
        t += 1;
      } else {
        t += w;
      }
    }
    let soft = false;
    if (asse > 0 && t + 10 <= 21) {
      t += 10;
      soft = true;
    }
    return { total: t, soft: soft };
  }
  function istBJ(h) {
    return h.karten.length === 2 && !h.ausSplit && handWert(h.karten).total === 21;
  }
  function bankBJ() {
    return B.bank.length === 2 && handWert(B.bank).total === 21;
  }
  function wert10(c) {
    const w = karteWert(c);
    return w === 11 ? 1 : w;
  }
  function hiLo(c) {
    const w = karteWert(c);
    if (w >= 2 && w <= 6) {
      return 1;
    }
    if (w === 10 || w === 11) {
      return -1;
    }
    return 0;
  }

  // ---------------------------------------------------------------- Schlitten
  function mischen() {
    const n = B.konf.decks * 52;
    const s = new Array(n);
    for (let i = 0; i < n; i++) {
      s[i] = i % 52;
    }
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(zufall() * (i + 1));
      const x = s[i];
      s[i] = s[j];
      s[j] = x;
    }
    B.schlitten = s;
    B.pos = 0;
    // Mischkarte bei ca. 70-80 % (bei einem Deck frueher)
    const pen = B.konf.decks === 1 ? 0.62 : 0.72 + zufall() * 0.08;
    B.schnitt = Math.floor(n * pen);
    B.mischenNoetig = false;
    B.lauf = 0;
    B.gesehen = 0;
    B.ablage = 0;
  }
  function ziehe() {
    if (B.pos >= B.schlitten.length) {
      mischen();
    }
    const c = B.schlitten[B.pos++];
    if (B.pos >= B.schnitt) {
      B.mischenNoetig = true;
    }
    return c;
  }
  function sichtbar(c) {
    B.lauf += hiLo(c);
    B.gesehen++;
  }

  // ---------------------------------------------------------------- Ablaufplan
  function tempo() {
    return B.konf.tempo === 'schnell' ? 0.55 : 1;
  }
  function schritt(pause, fn) {
    B.planEnde = Math.max(B.planEnde, B.zeit) + pause * tempo();
    B.plan.push({ t: B.planEnde, fn: fn });
  }
  function planLaeuft() {
    return B.plan.length > 0;
  }

  // ---------------------------------------------------------------- Mathe (Strategie-Tipp)
  function mathe() {
    const k = JSON.stringify([B.konf.soft17, B.konf.lochkarte, B.konf.doppeln, B.konf.das, B.konf.aufgeben, B.konf.bjZahlt, B.konf.bankBJ]);
    if (k !== B.matheKonfKey) {
      B.matheKonfKey = k;
      B.mathe = BJMathe.neu(B.konf);
      B.tabelleCache = null;
    }
    return B.mathe;
  }
  function hausvorteil() {
    const k = JSON.stringify(B.konf);
    if (k !== B.heKonfKey) {
      B.heKonfKey = k;
      B.he = BJMathe.hausvorteil(B.konf);
    }
    return B.he;
  }

  // ---------------------------------------------------------------- Setzen
  function chipWert() {
    return JETONS[B.chipIdx].wert;
  }
  function setzeBox(i, betrag) {
    if (B.z !== 'SETZEN') {
      return;
    }
    const box = B.boxen[i];
    const b = Math.min(betrag, MAX_BOX - box.einsatz, Konto.kredit);
    if (b <= 0) {
      klang.spiele('FEHLER');
      meld.neu(Konto.kredit <= 0 ? 'GUTHABEN LEER' : 'MAXIMUM', Konto.kredit <= 0 ? 'Oben rechts € antippen' : 'Höchstens ' + euroKurz(MAX_BOX) + ' je Box',
        ORANGE, 1.4);
      return;
    }
    Konto.kredit -= b;
    box.einsatz += b;
    klang.spiele('CHIP', { zufall: 0.05 });
    B.dirty = true;
  }
  function boxLeeren(i) {
    const box = B.boxen[i];
    if (B.z !== 'SETZEN' || box.einsatz <= 0) {
      return;
    }
    Konto.kredit += box.einsatz;
    box.einsatz = 0;
    klang.spiele('CHIPS', { rate: 0.85 });
    B.dirty = true;
  }
  function loeschen() {
    for (let i = 0; i < 3; i++) {
      boxLeeren(i);
    }
  }
  function wiederholen() {
    if (B.z !== 'SETZEN') {
      return;
    }
    let ok = false;
    for (let i = 0; i < 3; i++) {
      if (B.letzte[i] > 0 && B.boxen[i].einsatz === 0) {
        const b = Math.min(B.letzte[i], Konto.kredit);
        if (b > 0) {
          Konto.kredit -= b;
          B.boxen[i].einsatz = b;
          ok = true;
        }
      }
    }
    if (ok) {
      klang.spiele('CHIPS');
      B.dirty = true;
    }
  }
  function verdoppelnEinsatz() {
    if (B.z !== 'SETZEN') {
      return;
    }
    let ok = false;
    for (let i = 0; i < 3; i++) {
      const box = B.boxen[i];
      if (box.einsatz > 0) {
        const b = Math.min(box.einsatz, MAX_BOX - box.einsatz, Konto.kredit);
        if (b > 0) {
          Konto.kredit -= b;
          box.einsatz += b;
          ok = true;
        }
      }
    }
    if (ok) {
      klang.spiele('CHIPS');
      B.dirty = true;
    }
  }

  // ---------------------------------------------------------------- Geben
  function neueHand(einsatz) {
    return { karten: [], einsatz: einsatz, grund: einsatz, verdoppelt: false, ausSplit: false, splitAss: false, aufgegeben: false, fertig: false, ergebnis: '', auszahlung: 0 };
  }
  function karteAn(h, offen) {
    const c = ziehe();
    h.karten.push({ c: c, t: B.zeit, offen: offen !== false, flip: -9 });
    if (offen !== false) {
      sichtbar(c);
    }
    klang.spiele('KARTE_GEBEN', { zufall: 0.06 });
    return c;
  }
  function karteAnBank(offen) {
    const c = ziehe();
    B.bank.push({ c: c, t: B.zeit, offen: offen, flip: -9 });
    if (offen) {
      sichtbar(c);
    }
    klang.spiele('KARTE_GEBEN', { zufall: 0.06 });
  }
  function aktiveBoxen() {
    return SPIELREIHENFOLGE.filter(function (i) {
      return B.boxen[i].einsatz > 0;
    });
  }
  function geben() {
    if (B.z !== 'SETZEN' || B.ov !== 'KEINS') {
      return;
    }
    const aktiv = aktiveBoxen();
    if (aktiv.length === 0) {
      meld.neu('ERST SETZEN', 'Jeton wählen und auf eine Box tippen', ORANGE, 1.6);
      klang.spiele('FEHLER');
      return;
    }
    if (B.mischenNoetig || B.schlitten.length === 0) {
      mischen();
    }
    for (let i = 0; i < 3; i++) {
      B.letzte[i] = B.boxen[i].einsatz;
      B.boxen[i].haende = B.boxen[i].einsatz > 0 ? [neueHand(B.boxen[i].einsatz)] : [];
      B.boxen[i].versicherung = 0;
      if (B.boxen[i].einsatz > 0) {
        B.stat.einsatz += B.boxen[i].einsatz;
      }
    }
    B.bank = [];
    B.akt = { box: -1, hand: -1 };
    B.z = 'GEBEN';
    B.zt = 0;
    B.planEnde = B.zeit;
    speichern(true); // Stand vor dem Geben (gleicher Schlitten -> gleiche Karten)
    aktiv.forEach(function (i) {
      schritt(0.3, function () {
        karteAn(B.boxen[i].haende[0]);
      });
    });
    schritt(0.3, function () {
      karteAnBank(true);
    });
    aktiv.forEach(function (i) {
      schritt(0.3, function () {
        karteAn(B.boxen[i].haende[0]);
      });
    });
    if (B.konf.lochkarte) {
      schritt(0.3, function () {
        karteAnBank(false);
      });
    }
    schritt(0.35, nachGeben);
  }
  function nachGeben() {
    const up = karteWert(B.bank[0].c);
    if (up === 11) {
      B.z = 'VERSICHERUNG';
      B.zt = 0;
      const nurBJ = aktiveBoxen().every(function (i) {
        return istBJ(B.boxen[i].haende[0]);
      });
      meld.neu(nurBJ ? 'EVEN MONEY?' : 'VERSICHERUNG?', 'Bank zeigt ein Ass', C(40, 110, 200), 1.6);
      speichern(false);
      return;
    }
    nachVersicherung();
  }
  function versichern(ja) {
    if (B.z !== 'VERSICHERUNG') {
      return;
    }
    if (ja) {
      let s = 0;
      aktiveBoxen().forEach(function (i) {
        const box = B.boxen[i];
        const v = Math.min(Math.floor(box.einsatz / 2), Konto.kredit);
        if (v > 0) {
          Konto.kredit -= v;
          box.versicherung = v;
          s += v;
        }
      });
      if (s > 0) {
        B.stat.versichert++;
        klang.spiele('CHIPS');
      }
    }
    B.z = 'GEBEN';
    B.planEnde = B.zeit;
    schritt(0.1, nachVersicherung);
  }
  function nachVersicherung() {
    const up = karteWert(B.bank[0].c);
    if (B.konf.lochkarte && (up === 11 || up === 10)) {
      // Bank schaut unter die verdeckte Karte
      if (bankBJ()) {
        schritt(0.4, function () {
          lochkarteAufdecken();
        });
        schritt(0.6, auswerten);
        return;
      }
      if (up === 11) {
        meld.neu('KEIN BLACK JACK', 'Die Bank hat nachgesehen', C(40, 110, 200), 1.2);
      }
    }
    spielerStart();
  }
  function lochkarteAufdecken() {
    for (let i = 0; i < B.bank.length; i++) {
      const k = B.bank[i];
      if (!k.offen) {
        k.offen = true;
        k.flip = B.zeit;
        sichtbar(k.c);
        klang.spiele('KARTE_DREHEN');
      }
    }
  }

  // ---------------------------------------------------------------- Spieler
  function aktuelleHand() {
    if (B.akt.box < 0) {
      return null;
    }
    return B.boxen[B.akt.box].haende[B.akt.hand] || null;
  }
  function spielerStart() {
    B.z = 'SPIELER';
    B.akt = { box: -1, hand: -1 };
    // Black-Jack-Haende sind sofort fertig
    aktiveBoxen().forEach(function (i) {
      const h = B.boxen[i].haende[0];
      if (istBJ(h)) {
        h.fertig = true;
        h.ergebnis = 'BJ';
        klang.spiele('BLACKJACK');
        meld.neu('BLACK JACK!', 'Box ' + (i + 1), GOLD, 1.5);
      }
    });
    naechsteHand();
  }
  function naechsteHand() {
    const reihenfolge = aktiveBoxen();
    let startIdx = B.akt.box < 0 ? 0 : reihenfolge.indexOf(B.akt.box);
    for (let bi = startIdx; bi < reihenfolge.length; bi++) {
      const box = B.boxen[reihenfolge[bi]];
      const ab = (bi === startIdx && B.akt.box >= 0) ? B.akt.hand + 1 : 0;
      for (let hi = ab; hi < box.haende.length; hi++) {
        const h = box.haende[hi];
        if (!h.fertig) {
          B.akt = { box: reihenfolge[bi], hand: hi };
          handAktivieren(h);
          return;
        }
      }
    }
    B.akt = { box: -1, hand: -1 };
    bankSpielt();
  }
  function handAktivieren(h) {
    B.z = 'SPIELER';
    if (h.karten.length < 2) {
      B.z = 'GEBEN';
      B.planEnde = B.zeit;
      schritt(0.3, function () {
        karteAn(h);
        B.z = 'SPIELER';
        nachKarte(h, false);
      });
      return;
    }
    nachKarte(h, false);
  }
  /** Nach jeder Karte pruefen, ob die Hand automatisch fertig ist. */
  function nachKarte(h, verdoppelt) {
    const w = handWert(h.karten);
    if (w.total > 21) {
      h.fertig = true;
      h.ergebnis = 'BUST';
      klang.spiele('VERLUST', { gain: 0.45 });
      meld.neu('ÜBERKAUFT', w.total + ' Punkte', ROT, 1.0);
      weiterNach(0.5);
      return;
    }
    if (verdoppelt) {
      h.fertig = true;
      weiterNach(0.45);
      return;
    }
    if (h.splitAss && h.karten.length >= 2) {
      const nochmal = B.konf.ras && karteWert(h.karten[1].c) === 11 && B.boxen[B.akt.box].haende.length < B.konf.maxHaende;
      if (!nochmal) {
        h.fertig = true;
        weiterNach(0.45);
        return;
      }
    }
    if (w.total === 21) {
      h.fertig = true;
      weiterNach(0.4);
      return;
    }
    speichern(false);
  }
  function weiterNach(pause) {
    B.z = 'GEBEN';
    B.planEnde = B.zeit;
    schritt(pause, naechsteHand);
  }
  function darf(aktion) {
    const h = aktuelleHand();
    if (B.z !== 'SPIELER' || !h || h.fertig || planLaeuft()) {
      return false;
    }
    const w = handWert(h.karten);
    const box = B.boxen[B.akt.box];
    switch (aktion) {
      case 'karte':
        return !(h.splitAss) && w.total < 21;
      case 'stehen':
        return true;
      case 'doppeln':
        return h.karten.length === 2 && !h.splitAss && Konto.kredit >= h.grund && mathe().darfDoppeln(w.total, w.soft, h.ausSplit);
      case 'teilen': {
        if (h.karten.length !== 2 || box.haende.length >= B.konf.maxHaende || Konto.kredit < h.grund) {
          return false;
        }
        const a = wert10(h.karten[0].c), b = wert10(h.karten[1].c);
        if (a !== b) {
          return false;
        }
        if (h.splitAss && !B.konf.ras) {
          return false;
        }
        return true;
      }
      case 'aufgeben':
        return B.konf.aufgeben === 'ja' && h.karten.length === 2 && !h.ausSplit && box.haende.length === 1;
      default:
        return false;
    }
  }
  function aktion(a) {
    if (!darf(a)) {
      return;
    }
    const h = aktuelleHand();
    const box = B.boxen[B.akt.box];
    if (a === 'karte') {
      karteAn(h);
      nachKarte(h, false);
    } else if (a === 'stehen') {
      h.fertig = true;
      naechsteHand();
    } else if (a === 'doppeln') {
      Konto.kredit -= h.grund;
      h.einsatz += h.grund;
      h.verdoppelt = true;
      B.stat.doppelt++;
      klang.spiele('CHIPS');
      B.z = 'GEBEN';
      B.planEnde = B.zeit;
      schritt(0.25, function () {
        karteAn(h);
        B.z = 'SPIELER';
        nachKarte(h, true);
      });
    } else if (a === 'teilen') {
      Konto.kredit -= h.grund;
      const zweite = h.karten.pop();
      const ass = karteWert(zweite.c) === 11;
      const neu = neueHand(h.grund);
      neu.karten.push({ c: zweite.c, t: B.zeit - 1, offen: true, flip: -9 });
      neu.ausSplit = true;
      neu.splitAss = ass;
      h.ausSplit = true;
      h.splitAss = ass;
      box.haende.splice(B.akt.hand + 1, 0, neu);
      B.stat.geteilt++;
      klang.spiele('CHIPS');
      B.z = 'GEBEN';
      B.planEnde = B.zeit;
      schritt(0.3, function () {
        karteAn(h);
        B.z = 'SPIELER';
        nachKarte(h, false);
      });
    } else if (a === 'aufgeben') {
      h.aufgegeben = true;
      h.fertig = true;
      h.ergebnis = 'AUFGEGEBEN';
      B.stat.aufgegeben++;
      naechsteHand();
    }
    B.dirty = true;
  }

  // ---------------------------------------------------------------- Bank
  function bankSpielt() {
    B.z = 'BANK';
    B.zt = 0;
    B.planEnde = B.zeit;
    let offen = false, pruefen = false;
    aktiveBoxen().forEach(function (i) {
      const box = B.boxen[i];
      if (box.versicherung > 0) {
        pruefen = true;
      }
      box.haende.forEach(function (h) {
        if (h.ergebnis === 'BJ') {
          // Black Jack des Spielers: nur pruefen, wenn die Bank selbst noch Black Jack haben kann (Ass oder Zehn)
          if (B.bank.length > 0 && karteWert(B.bank[0].c) >= 10) {
            pruefen = true;
          }
        } else if (!h.aufgegeben && handWert(h.karten).total <= 21) {
          offen = true;
        }
      });
    });
    speichern(false);
    if (B.konf.lochkarte) {
      schritt(0.35, lochkarteAufdecken);
    } else if (offen || pruefen) {
      schritt(0.35, function () {
        karteAnBank(true);
      });
    }
    if (offen) {
      schritt(0.5, bankZiehen);
    } else {
      schritt(0.5, auswerten);
    }
  }
  function bankZiehen() {
    const w = handWert(B.bank);
    if (bankBJ()) {
      schritt(0.3, auswerten);
      return;
    }
    const zieht = w.total < 17 || (w.total === 17 && w.soft && B.konf.soft17 === 'zieht');
    if (zieht) {
      karteAnBank(true);
      schritt(0.55, bankZiehen);
    } else {
      schritt(0.35, auswerten);
    }
  }

  // ---------------------------------------------------------------- Auswertung
  function auswerten() {
    B.z = 'AUSZAHLUNG';
    B.zt = 0;
    const bw = handWert(B.bank);
    const bbj = bankBJ();
    const bust = bw.total > 21;
    let summe = 0, eingesetzt = 0;
    aktiveBoxen().forEach(function (i) {
      const box = B.boxen[i];
      if (box.versicherung > 0) {
        eingesetzt += box.versicherung;
        if (bbj) {
          summe += box.versicherung * 3;
          box.versErgebnis = 'VERSICHERUNG +' + euro(box.versicherung * 2);
        } else {
          box.versErgebnis = 'Versicherung verloren';
        }
      }
      let extraZurueck = 0;
      box.haende.forEach(function (h) {
        eingesetzt += h.einsatz;
        B.stat.haende++;
        const pw = handWert(h.karten).total;
        let a = 0;
        if (h.aufgegeben) {
          a = Math.floor(h.einsatz / 2);
          h.ergebnis = 'AUFGEGEBEN';
        } else if (pw > 21) {
          h.ergebnis = 'BUST';
          B.stat.verloren++;
        } else if (istBJ(h)) {
          if (bbj) {
            a = h.einsatz;
            h.ergebnis = 'PUSH';
            B.stat.push++;
          } else {
            a = h.einsatz + Math.floor(h.einsatz * B.konf.bjZahlt);
            h.ergebnis = 'BJ';
            B.stat.bj++;
            B.stat.gewonnen++;
          }
        } else if (bbj) {
          h.ergebnis = 'VERLOREN';
          B.stat.verloren++;
          if (!B.konf.lochkarte && B.konf.bankBJ === 'grund') {
            extraZurueck += h.einsatz - h.grund;
          }
        } else if (bust || pw > bw.total) {
          a = h.einsatz * 2;
          h.ergebnis = 'GEWONNEN';
          B.stat.gewonnen++;
        } else if (pw === bw.total) {
          a = h.einsatz;
          h.ergebnis = 'PUSH';
          B.stat.push++;
        } else {
          h.ergebnis = 'VERLOREN';
          B.stat.verloren++;
        }
        h.auszahlung = a;
        summe += a;
      });
      if (bbj && !B.konf.lochkarte && B.konf.bankBJ === 'grund') {
        // nur der Grundeinsatz geht verloren: Verdopplungen und geteilte Einsaetze zurueck
        const splitRest = box.haende.length > 1 ? (box.haende.length - 1) * box.einsatz : 0;
        const zur = extraZurueck + splitRest;
        if (zur > 0) {
          summe += zur;
          box.zurueck = zur;
        }
      }
    });
    Konto.kredit += summe;
    B.letzterGewinn = summe;
    B.stat.auszahlung += summe;
    B.stat.groesster = Math.max(B.stat.groesster, summe - eingesetzt);
    const netto = summe - eingesetzt;
    if (bbj) {
      meld.neu('BANK: BLACK JACK', netto >= 0 ? 'Ausgeglichen' : '−' + euro(-netto), ROT, 1.8);
      klang.spiele('VERLUST', { gain: 0.6 });
    } else if (netto > 0) {
      const faktor = summe / Math.max(1, eingesetzt);
      klang.spiele(faktor >= 2.4 ? 'GEWINN_MITTEL' : 'GEWINN_KLEIN');
      meld.neu(bust ? 'BANK ÜBERKAUFT' : 'GEWONNEN', '+' + euro(netto), GRUEN, 1.8);
    } else if (netto === 0 && summe > 0) {
      meld.neu('UNENTSCHIEDEN', 'Einsatz zurück', C(40, 110, 200), 1.4);
    } else if (eingesetzt > 0) {
      klang.spiele('VERLUST', { gain: 0.5 });
      meld.neu(bust ? 'BANK ÜBERKAUFT' : 'BANK GEWINNT', bw.total > 21 ? '' : 'Bank hat ' + bw.total, ROT, 1.4);
    }
    // Gewinn-Jetons fliegen aufs Guthaben
    aktiveBoxen().forEach(function (i) {
      B.boxen[i].haende.forEach(function (h, hi) {
        if (h.auszahlung > 0) {
          const p = handAnker(i, hi, B.boxen[i].haende.length);
          B.flieger.push({ x0: p[0], y0: p[1], betrag: h.auszahlung, t: -0.8 });
          partikel.funken(p[0], p[1], 10, GELB, 150);
        }
      });
    });
    B.nachRunde = true;
    speichern(false);
  }
  B.flieger = [];

  function aufraeumen() {
    B.ablage += B.bank.length;
    for (let i = 0; i < 3; i++) {
      B.boxen[i].haende.forEach(function (h) {
        B.ablage += h.karten.length;
      });
      B.boxen[i].haende = [];
      B.boxen[i].einsatz = 0;
      B.boxen[i].versicherung = 0;
      B.boxen[i].versErgebnis = '';
      B.boxen[i].zurueck = 0;
    }
    B.bank = [];
    B.akt = { box: -1, hand: -1 };
    if (B.mischenNoetig) {
      B.z = 'MISCHEN';
      B.mischT = 0;
      klang.spiele('MISCHEN');
      meld.neu('NEUER SCHLITTEN', 'Die Karten werden gemischt', C(40, 110, 200), 1.4);
      mischen();
    } else {
      B.z = 'SETZEN';
    }
    B.zt = 0;
    speichern(false);
  }

  // ---------------------------------------------------------------- Speichern
  function daten(vorGeben) {
    const d = {
      konf: B.konf, stat: B.stat, chip: B.chipIdx, letzte: B.letzte,
      schlitten: B.schlitten, pos: B.pos, schnitt: B.schnitt, lauf: B.lauf, gesehen: B.gesehen, ablage: B.ablage
    };
    if (vorGeben) {
      // Einsaetze liegen in den Boxen, Runde noch nicht begonnen
      d.phase = 'SETZEN';
      d.boxen = B.boxen.map(function (b) {
        return { einsatz: b.einsatz, haende: [], versicherung: 0 };
      });
    } else if (B.z === 'SETZEN' || B.z === 'MISCHEN' || B.z === 'AUSZAHLUNG') {
      d.phase = 'SETZEN';
      d.boxen = B.boxen.map(function (b) {
        return { einsatz: B.z === 'AUSZAHLUNG' ? 0 : b.einsatz, haende: [], versicherung: 0 };
      });
    } else {
      d.phase = B.z === 'BANK' ? 'BANK' : (B.z === 'VERSICHERUNG' ? 'VERSICHERUNG' : 'SPIELER');
      d.boxen = B.boxen.map(function (b) {
        return {
          einsatz: b.einsatz, versicherung: b.versicherung, haende: b.haende.map(function (h) {
            return Object.assign({}, h, { karten: h.karten.map(function (k) {
              return { c: k.c, offen: k.offen };
            }) });
          })
        };
      });

  function update(dt) {

    partikel.update(dt);

    while (B.plan.length && B.plan[0].t <= B.zeit) {

    if (B.z === 'AUSZAHLUNG' && B.zt > (B.konf.tempo === 'schnell' ? 1.8 : 3.0) && !planLaeuft()) {
      aufraeumen();
    }

      B.z = 'SETZEN';
    }
    B.kreditAnzeige += (Konto.kredit - B.kreditAnzeige) * Math.min(1, dt * 8);
    if (Math.abs(Konto.kredit - B.kreditAnzeige) < 0.5) {
      B.kreditAnzeige = Konto.kredit;
    }
    for (let i = B.flieger.length - 1; i >= 0; i--) {
      B.flieger[i].t += dt;
      if (B.flieger[i].t > 0.7) {
        B.flieger.splice(i, 1);
        klang.spiele('CHIP', { rate: 1.2, gain: 0.6 });
      }
    }

    const spieler = B.z === 'SPIELER' && !planLaeuft();
    const vers = B.z === 'VERSICHERUNG';

    B.boxen.forEach(function (b) {
      einsatz += b.einsatz;
    });

      btn[k].sichtbar = setzen || B.z === 'MISCHEN';
    });

    });
    btn.doppelE.aktiv = setzen && einsatz > 0;
    btn.geben.aktiv = setzen && einsatz > 0;
    btn.geben.puls = btn.geben.aktiv;

  /** Strategie-Tipp fuer die aktive Hand: beste Aktion und Erwartungswerte. */
  function empfehlung() {
    const h = aktuelleHand();
    if (!h || B.bank.length === 0) {
      return null;
    }
    const w = handWert(h.karten);
    const up = wert10(B.bank[0].c);
    const erlaubt = { karte: darf('karte'), doppeln: darf('doppeln'), teilen: darf('teilen'), aufgeben: darf('aufgeben') };
    const paar = erlaubt.teilen ? wert10(h.karten[0].c) : 0;
    const m = mathe();
    const e = m.aktionen({ total: w.total, soft: w.soft, paar: paar }, up, erlaubt);
    const b = m.beste(e);
    return { aktion: b.aktion, ev: b.ev, alle: e };
  }
  function versicherungsEV() {
    // exakt aus den noch unbekannten Karten im Schlitten (inkl. verdeckter Bankkarte)
    let zehner = 0;
    const rest = B.schlitten.length - B.pos;
    for (let i = B.pos; i < B.schlitten.length; i++) {
      if (karteWert(B.schlitten[i]) === 10) {
        zehner++;
      }
    }
    let unbekannt = rest;
    B.bank.forEach(function (k) {
      if (!k.offen) {
        unbekannt++;
        if (karteWert(k.c) === 10) {
          zehner++;
        }
      }
    });
    const p = unbekannt > 0 ? zehner / unbekannt : 4 / 13;
    return 2 * p - (1 - p);
  }

  function bogenText(g, t, cx, cy, r, f, farbe) {
    g.save();
    g.font = f.f;
    g.fillStyle = css(farbe);
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    const w = g.measureText(t).width;
    let a = Math.PI / 2 + w / r / 2;
    for (let i = 0; i < t.length; i++) {
      const ch = t[i];
      const cw = g.measureText(ch).width;
      a -= cw / r / 2;
      g.save();
      g.translate(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      g.rotate(a - Math.PI / 2);
      g.fillText(ch, 0, 0);
      g.restore();
      a -= cw / r / 2;
    }
    g.restore();
  }

    return LINIENEINSATZ[S.lbIdx];
  }
  function einsatz() {
    return lb() * S.linien;
  }
  function fsEinsatz() {
    return S.fs ? S.fs.lb * S.fs.linien : einsatz();
  }
  function tempoF() {
    return S.konf.tempo === 'schnell' ? 0.6 : 1;
  }

  // ---------------------------------------------------------------- Ablaufplan
  const P = { liste: [], ende: 0 };
  function schritt(pause, fn) {
    P.ende = Math.max(P.ende, S.zeit) + pause * tempoF();
    P.liste.push({ t: P.ende, fn: fn });
  }
  function planLeeren() {
    P.liste = [];
    P.ende = S.zeit;
  }
  function planLaeuft() {
    return P.liste.length > 0;
  }

  // ---------------------------------------------------------------- Spielmathematik
  function fensterAus(stops) {
    const f = [];
    for (let i = 0; i < 5; i++) {
      const st = STREIFEN[i], L = st.length;
      f.push([st[stops[i] % L], st[(stops[i] + 1) % L], st[(stops[i] + 2) % L]]);
    }
    return f;
  }
  /** Linienwert: bestes Symbol mit Joker-Ersatz (mindestens ein echtes Symbol in der Reihe). */
  function linienWert(t) {
    let best = 0, bs = -1, bn = 0;
    for (let s = 0; s < 9; s++) {
      let n = 0, echt = false;
      for (let i = 0; i < 5; i++) {
        if (t[i] === s) {
          n++;
          echt = true;
        } else if (t[i] === BUCH) {
          n++;
        } else {
          break;
        }
      }
      if (echt && PAY[s][n] > best) {
        best = PAY[s][n];
        bs = s;
        bn = n;
      }
    }
    return { wert: best, sym: bs, n: bn };
  }
  function bewerte(f, linien, lbW, sonder) {
    const e = { linien: [], scatter: null, exp: [], summe: 0, buecher: 0 };
    for (let l = 0; l < linien; l++) {
      const t = [];
      for (let i = 0; i < 5; i++) {
        t.push(f[i][LINIEN[l][i]]);
      }
      const w = linienWert(t);
      if (w.wert > 0) {
        e.linien.push({ l: l, sym: w.sym, n: w.n, betrag: w.wert * lbW });
        e.summe += w.wert * lbW;
      }
    }
    const pos = [];
    for (let i = 0; i < 5; i++) {
      for (let r = 0; r < 3; r++) {
        if (f[i][r] === BUCH) {
          pos.push([i, r]);
        }
      }
    }
    e.buecher = pos.length;
    const sb = SCAT[Math.min(5, pos.length)] * lbW * linien;
    e.scatter = { n: pos.length, betrag: sb, pos: pos };
    e.summe += sb;
    for (let k = 0; k < sonder.length; k++) {
      const s = sonder[k];
      const w = [];
      for (let i = 0; i < 5; i++) {
        if (f[i].indexOf(s) >= 0) {
          w.push(i);
        }
      }
      if (w.length >= MIN_EXP[s]) {
        const b = PAY[s][w.length] * lbW * linien;
        e.exp.push({ sym: s, walzen: w, n: w.length, betrag: b });
        e.summe += b;
      }
    }
    return e;
  }
  let testStops = null, testSonder = null;
  function zufallsStops() {
    if (testStops && testStops.length) {
      return testStops.shift().slice();
    }
    return STREIFEN.map(function (st) {
      return Math.floor(zufall() * st.length);
    });
  }
  function neuesSondersymbol(vorhanden) {
    if (testSonder && testSonder.length) {
      const t = testSonder.shift();
      if (vorhanden.indexOf(t) < 0) {
        return t;
      }
    }
    const frei = [];
    for (let s = 0; s < 9; s++) {
      if (vorhanden.indexOf(s) < 0) {
        frei.push(s);
      }
    }
    if (!frei.length) {
      return -1;
    }
    return frei[Math.floor(zufall() * frei.length)];
  }

  // ---------------------------------------------------------------- Speichern
  function offenerBetrag() {
    if (S.z === 'GEWINN' || S.z === 'KARTE' || S.z === 'LEITER') {
      return S.karte && S.karte.phase === 'zeigen' ? S.karte.ergebnisWert : (S.leiter && S.leiter.ergebnisWert !== undefined
        ? S.leiter.ergebnisWert : S.gewinn);
    }
    if (!S.fs && (S.z === 'DREHT' || S.z === 'ZEIGEN')) {
      return S.rundeOffen;
    }
    return 0;
  }
  function speichern() {
    try {
      const d = {
        lb: S.lbIdx, linien: S.linien, konf: S.konf, stat: S.stat, karten: S.karten.slice(0, 5),
        fs: S.fs ? { rest: S.fs.rest, gesamt: S.fs.gesamt, nr: S.fs.nr, symbole: S.fs.symbole, gewinn: S.fs.gewinn, lb: S.fs.lb,
          linien: S.fs.linien } : null
      };
      window.localStorage.setItem(SPEICHER, JSON.stringify(d));
    } catch (e) {
      // optional
    }
    const k = Konto.kredit;
    Konto.kredit = k + offenerBetrag();
    Konto.speichern();
    Konto.kredit = k;
    S.dirty = false;
  }
  function laden() {
    let d = null;
    try {
      d = JSON.parse(window.localStorage.getItem(SPEICHER) || 'null');
    } catch (e) {
      d = null;
    }
    if (!d) {
      return;
    }
    if (typeof d.lb === 'number') {
      S.lbIdx = clampI(d.lb, 0, LINIENEINSATZ.length - 1);
    }
    if (typeof d.linien === 'number' && LINIEN_WAHL.indexOf(d.linien) >= 0) {
      S.linien = d.linien;
    }
    if (d.konf) {
      if (d.konf.tempo === 'schnell' || d.konf.tempo === 'normal') {
        S.konf.tempo = d.konf.tempo;
      }
      S.konf.spannung = d.konf.spannung !== false;
      S.konf.fsAuto = d.konf.fsAuto !== false;
    }
    if (d.stat) {
      Object.keys(S.stat).forEach(function (k) {
        if (typeof d.stat[k] === 'number' && isFinite(d.stat[k])) {
          S.stat[k] = d.stat[k];
        }
      });
    }
    if (Array.isArray(d.karten)) {
      S.karten = d.karten.filter(function (c) {
        return typeof c === 'number' && c >= 0 && c < 52;
      }).slice(0, 5);
    }
    if (d.fs && typeof d.fs.rest === 'number' && Array.isArray(d.fs.symbole)) {
      S.fs = {
        rest: clampI(d.fs.rest, 0, 9999), gesamt: Math.max(10, d.fs.gesamt | 0), nr: d.fs.nr | 0,
        symbole: d.fs.symbole.filter(function (s) {
          return s >= 0 && s < 9;
        }).slice(0, 9), gewinn: Math.max(0, Math.round(d.fs.gewinn || 0)),
        lb: LINIENEINSATZ.indexOf(d.fs.lb) >= 0 ? d.fs.lb : lb(), linien: LINIEN_WAHL.indexOf(d.fs.linien) >= 0 ? d.fs.linien : S.linien
      };
      if (!S.fs.symbole.length) {
        S.fs.symbole.push(neuesSondersymbol([]));
      }
    }
  }

  // ---------------------------------------------------------------- Walzen
  // Walzenmechanik wie am Automaten: kurzer Ruck nach oben, schneller gleichmäßiger Lauf,
  // dann Abbremsen mit gleichbleibender Verzögerung, kleines Überschwingen und Einrasten.
  const V_LAUF = 23;          // Symbole pro Sekunde im Lauf
  const RUCK = 0.26;          // Ruck nach oben beim Start (Symbolhöhen)
  const RUCK_T = 0.09;        // Dauer des Rucks
  const ANLAUF_T = 0.13;      // Beschleunigung auf volle Geschwindigkeit
  const UEBERSCHWUNG = 0.2;   // Walze läuft beim Halten etwas über das Ziel hinaus
  const BREMSWEG = 0.17;      // Bremsweg in Sekunden Laufzeit (ca. 4 Symbole)
  const FEDER_T = 0.34;       // Einrasten (gedämpfte Feder)
  function walzenStarten(stops, schnell) {
    const basis = (schnell ? 0.42 : 0.55) * tempoF();
    const abst = (schnell ? 0.13 : 0.18) * tempoF();
    for (let i = 0; i < 5; i++) {
      const w = walzen[i];
      w.ziel = stops[i];
      w.phase = 'start';
      w.t = -i * 0.03;
      w.p0 = w.pos;
      w.vel = 0;
      w.ruckFertig = false;
      w.vmax = V_LAUF * (S.konf.tempo === 'schnell' ? 1.2 : 1);
      w.stopZeit = S.zeit + basis + i * abst;
    }
    S.spannung = false;
    if (laufTon) {
      laufTon.stop();
    }
    laufTon = klang.schleife('WALZE_LAUF');
    laufTon.setze(0.4, 1);
  }
  function walzeStoppen(w) {
    const L = STREIFEN[w.i].length;
    const o = UEBERSCHWUNG;
    const dMin = w.vmax * BREMSWEG;
    let p0 = w.pos;
    // gebremst wird bis über das Ziel hinaus (pf - o), danach federt die Walze auf pf zurück
    const pf = w.ziel + L * Math.floor((p0 + o - dMin - w.ziel) / L);
    let d = p0 + o - pf;
    // Solange die Walze unscharf läuft, darf sie um ganze Symbole springen: so ist der Bremsweg immer gleich lang
    const sprung = Math.floor(d - dMin);
    if (sprung > 0) {
      w.pos -= sprung;
      p0 = w.pos;
      d -= sprung;
    }
    w.p0 = p0;
    w.pf = pf;
    w.d = d;
    w.o = o;
    w.dauer = 2 * d / w.vmax; // gleichmäßige Verzögerung: Startgeschwindigkeit = Laufgeschwindigkeit
    w.t = 0;
    w.phase = 'brems';
  }
  function walzenSchnellStopp() {
    let k = 0;
    for (let i = 0; i < 5; i++) {
      const w = walzen[i];
      if (w.phase === 'lauf' || w.phase === 'start') {
        w.stopZeit = Math.min(w.stopZeit, S.zeit + 0.06 * k);
        k++;
      }
    }
  }
  function alleStehen() {
    return walzen.every(function (w) {
      return w.phase === 'steht';
    });
  }
  function gelandet(w) {
    return w.phase === 'steht' || w.phase === 'feder';
  }
  function buecherSichtbar(bis) {
    let n = 0;
    for (let i = 0; i <= bis; i++) {
      if (!gelandet(walzen[i])) {
        continue;
      }
      for (let r = 0; r < 3; r++) {
        if (S.fenster[i][r] === BUCH) {
          n++;
        }
      }
    }
    return n;
  }
  function walzenUpdate(dt) {
    let lauf = 0;
    for (let i = 0; i < 5; i++) {
      const w = walzen[i];
      const L = STREIFEN[i].length;
      if (w.phase === 'start') {
        w.t += dt;
        if (w.t < 0) {
          continue;
        }
        if (w.t < RUCK_T) {
          w.pos = w.p0 + RUCK * Math.sin(Math.PI / 2 * w.t / RUCK_T);
          w.vel = 0;
        } else {
          if (!w.ruckFertig) {
            w.ruckFertig = true;
            w.pos = w.p0 + RUCK;
          }
          w.vel = Math.min(w.vmax, w.vel + w.vmax / ANLAUF_T * dt);
          w.pos -= w.vel * dt;
          if (w.vel >= w.vmax) {
            w.phase = 'lauf';
          }
        }
      } else if (w.phase === 'lauf') {
        w.vel = w.vmax;
        w.pos -= w.vel * dt;
        if (w.pos < -1000) {
          w.pos += L * 60;
        }
        if (S.zeit >= w.stopZeit) {
          walzeStoppen(w);
        }
      } else if (w.phase === 'brems') {
        w.t += dt;
        const u = Math.min(1, w.t / w.dauer);
        w.pos = w.p0 - w.d * (1 - (1 - u) * (1 - u));
        w.vel = (2 * w.d / w.dauer) * (1 - u);
        if (u >= 1) {
          w.phase = 'feder';
          w.t = 0;
          w.vel = 0;
          walzeEingerastet(w);
        }
      } else if (w.phase === 'feder') {
        w.t += dt;
        const off = -w.o * Math.cos(2 * Math.PI * 4.6 * w.t) * Math.exp(-13 * w.t);
        w.pos = w.pf + off;
        if (w.t >= FEDER_T) {
          w.pos = ((w.ziel % L) + L) % L;
          w.phase = 'steht';
          if (alleStehen()) {
            alleGestoppt();
          }
        }
      }
      if (w.phase === 'lauf' || w.phase === 'start') {
        lauf++;
      }
    }
    if (laufTon) {
      laufTon.setze(lauf > 0 ? 0.18 + 0.05 * lauf : 0, 0.92 + 0.03 * lauf);
    }
  }
  /** Die Walze rastet ein (Ende des Bremsens): Klang, Bücher, Spannung. */
  function walzeEingerastet(w) {
    klang.spiele('WALZE_STOPP', { zufall: 0.04, gain: 0.85 });
    w.einrastZeit = S.zeit;
    let buchHier = false;
    for (let r = 0; r < 3; r++) {
      if (S.fenster[w.i][r] === BUCH) {
        buchHier = true;
      }
    }
    const n = buecherSichtbar(w.i);
    if (buchHier) {
      klang.spiele('BUCH', { rate: [1, 1, 1.12, 1.26, 1.41, 1.5][Math.min(5, n)], gain: 0.85 });
      for (let r = 0; r < 3; r++) {
        if (S.fenster[w.i][r] === BUCH) {
          const p = zellMitte(w.i, r);
          partikel.funken(p[0], p[1], 8, GELB, 90);
        }
      }
    }
    // Spannung: zwei Bücher liegen, die restlichen Walzen laufen länger
    if (S.konf.spannung && n >= 2 && w.i < 4 && !S.spannung) {
      S.spannung = true;
      let t = S.zeit + 0.55 * tempoF();
      for (let k = w.i + 1; k < 5; k++) {
        walzen[k].stopZeit = Math.max(walzen[k].stopZeit, t);
        t += 0.8 * tempoF();
      }
      if (spannTon) {
        spannTon.stop();
      }
      spannTon = klang.schleife('SPANNUNG');
      spannTon.setze(0.55, 1);
    }
    // die Spannung endet, sobald die letzte Walze hält
    if (w.i === 4 && spannTon) {
      spannTon.stop();
      spannTon = null;
    }
  }
  function alleGestoppt() {
    if (laufTon) {
      laufTon.stop();
      laufTon = null;
    }
    if (spannTon) {
      spannTon.stop();
      spannTon = null;
    }
    S.spannung = false;
    nachDrehung();
  }

  // ---------------------------------------------------------------- Spielablauf
  function kannStarten() {
    return S.z === 'BEREIT' && S.ov === 'KEINS' && !planLaeuft();
  }
  function starte() {
    if (S.z === 'GEWINN') {
      annehmen(true);
      return;
    }
    if (S.z === 'DREHT') {
      walzenSchnellStopp();
      return;
    }
    if (S.z === 'ZEIGEN' || S.z === 'EXP') {
      // Anzeige abkürzen
      if (!S.fs) {
        planLeeren();
        S.zaehlen = null;
        S.gewinnAnzeige = S.gewinn = S.ergebnis ? S.ergebnis.summe : 0;
        S.rundeOffen = 0;
        if (S.gewinn > 0) {
          gewinnAngebot();
        } else {
          rundeEnde();
        }
      }
      return;
    }
    if (S.z === 'FS_WARTEN') {
      freispielDrehen();
      return;
    }
    if (!kannStarten()) {
      return;
    }
    const E = einsatz();
    if (Konto.kredit < E) {
      S.auto = false;
      klang.spiele('FEHLER');
      meld.neu(Konto.kredit <= 0 ? 'GUTHABEN LEER' : 'ZU WENIG GUTHABEN', 'Oben rechts € antippen oder Einsatz senken', ORANGE, 1.8);
      return;
    }
    Konto.kredit -= E;
    S.stat.spiele++;
    S.stat.einsatz += E;
    S.stops = zufallsStops();
    S.fenster = fensterAus(S.stops);
    const e = bewerte(S.fenster, S.linien, lb(), []);
    S.ergebnis = e;
    S.gewinn = 0;
    S.gewinnAnzeige = 0;
    S.expListe = [];
    S.exp = null;
    S.zeigeLinie = -1;
    if (e.summe > 0) {
      S.stat.treffer++;
    }
    if (e.scatter.n >= 3) {
      // Freispiele: der Gewinn dieses Spiels zählt schon zum Freispielgewinn
      S.fs = { rest: 10, gesamt: 10, nr: 0, symbole: [neuesSondersymbol([])], gewinn: e.summe, lb: lb(), linien: S.linien, neu: true };
      S.rundeOffen = 0;
      S.stat.fs++;
    } else {
      S.rundeOffen = e.summe;
    }
    S.z = 'DREHT';
    S.zt = 0;
    S.dirty = true;
    speichern();
    walzenStarten(S.stops, false);
  }
  function freispielDrehen() {
    const fs = S.fs;
    if (!fs || fs.rest <= 0) {
      return;
    }
    planLeeren();
    S.stops = zufallsStops();
    S.fenster = fensterAus(S.stops);
    const e = bewerte(S.fenster, fs.linien, fs.lb, fs.symbole);
    S.ergebnis = e;
    S.expListe = [];
    S.exp = null;
    S.zeigeLinie = -1;
    S.zaehlen = null;
    S.gewinnAnzeige = fs.gewinn;
    fs.rest--;
    fs.nr++;
    fs.gewinn += e.summe;
    fs.neuesSymbol = -1;
    if (e.scatter.n >= 3) {
      fs.rest += 10;
      fs.gesamt += 10;
      if (fs.symbole.length < 9) {
        fs.neuesSymbol = neuesSondersymbol(fs.symbole);
        fs.symbole.push(fs.neuesSymbol);
      }
    }
    S.z = 'DREHT';
    S.zt = 0;
    S.dirty = true;
    speichern();
    walzenStarten(S.stops, true);
  }
  function nachDrehung() {
    const e = S.ergebnis;
    S.z = 'ZEIGEN';
    S.zt = 0;
    planLeeren();
    const fs = S.fs;
    const basisSumme = e.summe - e.exp.reduce(function (a, x) {
      return a + x.betrag;
    }, 0);
    // 1) Liniengewinne und Scatter
    if (basisSumme > 0) {
      const anzahl = e.linien.length + (e.scatter.betrag > 0 ? 1 : 0);
      const E = fs ? fs.lb * fs.linien : einsatz();
      gewinnKlang(basisSumme, E);
      S.zeigeLinie = -2; // alle zugleich
      S.linienT = S.zeit;
      zaehleAuf(basisSumme, Math.min(1.6, 0.45 + 0.25 * anzahl));
      schritt(0.7, function () {
        S.zeigeLinie = 0;
        S.linienT = S.zeit;
      });
      schritt(Math.min(2.4, 0.75 * anzahl), function () {});
    }
    // 2) Freispiele ausgelöst (im Grundspiel)
    if (!fs || fs.nr === 0) {
      if (fs && fs.neu) {
        schritt(0.4, function () {
          S.zeigeLinie = -1;
          buecherFeiern();
        });
        schritt(1.4, function () {
          introStarten(fs.symbole[0], true);
        });
        return;
      }
      schritt(basisSumme > 0 ? 0.1 : 0.05, function () {
        S.zeigeLinie = basisSumme > 0 ? 0 : -1;
        S.gewinn = basisSumme;
        S.rundeOffen = 0;
        if (basisSumme > 0) {
          gewinnAngebot();
        } else {
          rundeEnde();
        }
      });
      return;
    }
    // 3) Freispiel: Expansionen nacheinander
    e.exp.forEach(function (x) {
      schritt(0.35, function () {
        S.zeigeLinie = -1;
        S.exp = { sym: x.sym, walzen: x.walzen, t0: S.zeit, betrag: x.betrag, n: x.n };
        S.z = 'EXP';
        klang.spiele('EXPANDIEREN');
      });
      schritt(0.9, function () {
        zaehleAuf(x.betrag, 0.9);
        gewinnKlang(x.betrag, fs.lb * fs.linien);
        S.stat.sonder++;
      });
      schritt(1.7, function () {
        S.expListe.push(S.exp);
        S.exp = null;
      });
    });
    // 4) Wiederholung
    if (e.scatter.n >= 3) {
      schritt(0.4, function () {
        S.zeigeLinie = -1;
        buecherFeiern();
        meld.neu('+10 FREISPIELE', fs.neuesSymbol >= 0 ? 'Ein weiteres Sondersymbol!' : 'Alle Symbole sind schon Sondersymbole', GOLD, 2.0);
      });
      if (fs.neuesSymbol >= 0) {
        schritt(1.6, function () {
          introStarten(fs.neuesSymbol, false);
        });
        return;
      }
      schritt(1.6, function () {});
    }
    schritt(0.5, naechstesFreispiel);
  }
  function naechstesFreispiel() {
    const fs = S.fs;
    if (!fs) {
      return;
    }
    if (fs.rest <= 0) {
      freispieleEnde();
      return;
    }
    S.z = 'FS_WARTEN';
    S.zt = 0;
    if (S.konf.fsAuto || S.auto) {
      schritt(0.55, function () {
        if (S.z === 'FS_WARTEN' && S.ov === 'KEINS') {
          freispielDrehen();
        }
      });
    }
  }
  function freispieleEnde() {
    const fs = S.fs;
    S.z = 'FS_ENDE';
    S.zt = 0;
    S.zeigeLinie = -1;
    S.expListe = [];
    const g = fs.gewinn;
    const E = fs.lb * fs.linien;
    S.stat.fsBester = Math.max(S.stat.fsBester, g);
    meld.neu('FREISPIELE ENDE', euro(g) + ' Gewinn', GOLD, 2.4);
    gewinnKlang(Math.max(g, E * 30), E);
    if (g >= E * 20) {
      partikel.muenzen(LB.walzen.x + LB.walzen.cw * 2.5, LB.walzen.y + LB.walzen.rh * 1.5, 36, 1.2);
    }
    schritt(2.6, function () {
      S.fs = null;
      S.gewinn = g;
      S.gewinnAnzeige = g;
      S.dirty = true;
      if (g > 0) {
        gewinnAngebot();
      } else {
        rundeEnde();
      }
    });
  }
  function introStarten(sym, erstesMal) {
    S.z = 'INTRO';
    S.zt = 0;
    const folge = [];
    let t = 0, d = 0.06;
    while (t < 2.0) {
      let s;
      do {
        s = Math.floor(Math.random() * 9);
      } while (folge.length && folge[folge.length - 1].s === s);
      folge.push({ t: t, s: s });
      t += d;
      d *= 1.11;
    }
    folge.push({ t: t, s: sym });
    S.intro = { sym: sym, t0: S.zeit, folge: folge, ende: t, erstes: erstesMal, tick: -1 };
    if (erstesMal) {
      klang.spiele('FREISPIELE');
      meld.neu('10 FREISPIELE', 'mit Sondersymbol', GOLD, 2.0);
    } else {
      klang.spiele('BUCH', { rate: 1.12 });
    }
  }
  function introFertig() {
    const fs = S.fs;
    S.intro = null;
    if (fs) {
      fs.neu = false;
    }
    S.dirty = true;
    naechstesFreispiel();
  }
  function buecherFeiern() {
    const e = S.ergebnis;
    e.scatter.pos.forEach(function (p, k) {
      const m = zellMitte(p[0], p[1]);
      partikel.funken(m[0], m[1], 14, GELB, 140);
      partikel.sterne(m[0] - 50, m[1] - 50, 100, 100, 4, GELB_HELL);
    });
    klang.spiele('BUCH', { rate: 1.26 });
    S.buchFeier = S.zeit;
  }
  function gewinnKlang(betrag, E) {
    const f = betrag / Math.max(1, E);
    if (f >= 50) {
      klang.spiele('GEWINN_GROSS');
    } else if (f >= 8) {
      klang.spiele('GEWINN_MITTEL');
    } else if (f >= 2) {
      klang.spiele('GEWINN_KLEIN');
    } else {
      klang.spiele('LINIE', { gain: 0.8 });
    }
  }
  function zaehleAuf(betrag, dauer) {
    S.zaehlen = { von: S.gewinnAnzeige, bis: S.gewinnAnzeige + betrag, t0: S.zeit, dauer: dauer * tempoF(), tick: 0 };
  }
  function gewinnAngebot() {
    S.z = 'GEWINN';
    S.zt = 0;
    S.karte = null;
    S.leiter = null;
    S.kartenRunde = 0;
    S.dirty = true;
    const E = einsatz();
    if (S.gewinn >= E * 50) {
      partikel.muenzen(LB.walzen.x + LB.walzen.cw * 2.5, LB.walzen.y + LB.walzen.rh * 1.5, 30, 1.1);
    }
    if (S.auto) {
      schritt(1.4, function () {
        if (S.z === 'GEWINN' && S.auto) {
          annehmen(true);
        }
      });
    }
  }
  function rundeEnde() {
    S.z = 'BEREIT';
    S.zt = 0;
    S.karte = null;
    S.leiter = null;
    S.dirty = true;
    if (S.auto) {
      schritt(0.45, function () {
        if (S.auto && S.z === 'BEREIT') {
          starte();
        }
      });
    }
  }
  function annehmen(weiter) {
    if (!(S.z === 'GEWINN' || S.z === 'KARTE' || S.z === 'LEITER')) {
      return;
    }
    let g = S.gewinn;
    if (S.z === 'LEITER' && S.leiter) {
      g = S.leiter.wert;
    }
    planLeeren();
    if (g > 0) {
      Konto.kredit += g;
      S.stat.gewinn += g;
      S.stat.groesster = Math.max(S.stat.groesster, g);
      klang.spiele('CASHOUT', { gain: 0.8 });
      S.gutschrift = { betrag: g, t0: S.zeit };
    }
    S.gewinn = 0;
    S.gewinnAnzeige = 0;
    S.zeigeLinie = -1;
    S.z = 'BEREIT';
    S.karte = null;
    S.leiter = null;
    S.dirty = true;
    speichern();
    if (weiter && Konto.kredit >= einsatz()) {
      schritt(0.25, function () {
        if (S.z === 'BEREIT') {
          starte();
        }
      });
    } else if (S.auto) {
      rundeEnde();
    }
  }

  // ---------------------------------------------------------------- Risiko: Karte
  function karteErlaubt() {
    return S.z === 'GEWINN' && S.gewinn > 0 && S.gewinn * 2 <= RISIKO_GRENZE * einsatz() && (S.kartenRunde || 0) < KARTE_RUNDEN;
  }
  function karteStarten() {
    if (!karteErlaubt() && !(S.z === 'KARTE' && S.karte && S.karte.phase === 'wahl')) {
      if (S.z === 'GEWINN') {
        klang.spiele('FEHLER');
        meld.neu('KEIN RISIKO', S.gewinn * 2 > RISIKO_GRENZE * einsatz() ? 'Grenze erreicht' : 'Höchstens 5 Runden', ORANGE, 1.4);
      }
      return;
    }
    S.auto = false;
    planLeeren();
    S.zeigeLinie = -1;
    S.z = 'KARTE';
    S.zt = 0;
    S.karte = { phase: 'wahl', t0: S.zeit, c: -1, wahl: '', tick: 0 };
    S.dirty = true;
  }
  function karteWaehlen(rot) {
    if (S.z !== 'KARTE' || !S.karte || S.karte.phase !== 'wahl') {
      return;
    }
    const c = Math.floor(zufall() * 52);
    const istRot = karteFarbe(c) === 1 || karteFarbe(c) === 2;
    const k = S.karte;
    k.c = c;
    k.phase = 'zeigen';
    k.t0 = S.zeit;
    k.wahl = rot ? 'ROT' : 'SCHWARZ';
    k.richtig = istRot === rot;
    k.ergebnisWert = k.richtig ? S.gewinn * 2 : 0;
    S.karten.unshift(c);
    S.karten = S.karten.slice(0, 5);
    klang.spiele('KARTE_DREHEN');
    S.kartenRunde = (S.kartenRunde || 0) + 1;
    S.dirty = true;
    schritt(0.35, function () {
      if (k.richtig) {
        S.gewinn *= 2;
        S.gewinnAnzeige = S.gewinn;
        S.stat.karteGew++;
        klang.spiele('RISIKO_GEWONNEN');
        meld.neu('RICHTIG!', euro(S.gewinn), GRUEN, 1.1);
      } else {
        S.gewinn = 0;
        S.gewinnAnzeige = 0;
        S.stat.karteVerl++;
        klang.spiele('RISIKO_VERLOREN');
        meld.neu('VERLOREN', 'Die Karte war ' + (istRot ? 'rot' : 'schwarz'), ROT, 1.3);
      }
    });
    schritt(1.0, function () {
      S.karte.ergebnisWert = undefined;
      if (k.richtig) {
        if (S.gewinn * 2 <= RISIKO_GRENZE * einsatz() && S.kartenRunde < KARTE_RUNDEN) {
          S.karte = { phase: 'wahl', t0: S.zeit, c: -1, wahl: '', tick: 0 };
        } else {
          S.z = 'GEWINN';
          S.karte = null;
          meld.neu('GRENZE ERREICHT', 'Gewinn annehmen oder Leiter', C(40, 110, 200), 1.4);
        }
      } else {
        S.karte = null;
        S.z = 'BEREIT';
        S.dirty = true;
        speichern();
      }
    });
  }

  // ---------------------------------------------------------------- Risiko: Leiter
  function leiterWerte(E) {
    return LEITER_FAKTOR.map(function (f) {
      return f * E;
    });
  }
  function leiterErlaubt() {
    return S.z === 'GEWINN' && S.gewinn > 0 && S.gewinn < LEITER_FAKTOR[LEITER_FAKTOR.length - 1] * einsatz();
  }
  function leiterStufeVon(wert, werte) {
    let j = -1;
    for (let k = 0; k < werte.length; k++) {
      if (werte[k] <= wert) {
        j = k;
      }
    }
    return j;
  }
  function leiterStarten() {
    if (!leiterErlaubt()) {
      if (S.z === 'GEWINN') {
        klang.spiele('FEHLER');
        meld.neu('KEINE LEITER', 'Gewinn liegt schon über der Leiter', ORANGE, 1.4);
      }
      return;
    }
    S.auto = false;
    planLeeren();
    S.zeigeLinie = -1;
    const werte = leiterWerte(einsatz());
    const j = leiterStufeVon(S.gewinn, werte);
    S.z = 'LEITER';
    S.zt = 0;
    S.leiter = { werte: werte, wert: S.gewinn, stufe: j, ziel: j + 1, t0: S.zeit, phase: 'lauf', blink: 0, letzt: -1 };
    klang.spiele('RISIKO_HOCH');
    S.dirty = true;
  }
  function leiterStopp() {
    const Lr = S.leiter;
    if (S.z !== 'LEITER' || !Lr || Lr.phase !== 'lauf') {
      return;
    }
    const zielWert = Lr.werte[Lr.ziel];
    const p = Lr.wert / zielWert; // fair: Erwartungswert bleibt gleich (50 : 50 bei glatten Stufen)
    const gewonnen = zufall() < p;
    Lr.phase = 'ergebnis';
    Lr.gewonnen = gewonnen;
    Lr.t0 = S.zeit;
    Lr.ergebnisWert = gewonnen ? zielWert : 0;
    S.dirty = true;
    if (gewonnen) {
      Lr.wert = zielWert;
      Lr.stufe = Lr.ziel;
      S.gewinn = zielWert;
      S.gewinnAnzeige = zielWert;
      S.stat.leiterGew++;
      klang.spiele(Klang.stufe(Lr.stufe + 1));
      const R = leiterRungen();
      const r = R[Lr.stufe];
      partikel.funken(r.x + r.w / 2, r.y + r.h / 2, 12, GELB, 120);
      if (Lr.stufe >= Lr.werte.length - 1) {
        schritt(0.6, function () {
          klang.spiele('JACKPOT');
          meld.neu('LEITER GESCHAFFT', euro(Lr.wert), GOLD, 2.0);
          partikel.muenzen(r.x + r.w / 2, r.y + r.h / 2, 40, 1.2);
        });
        schritt(1.6, function () {
          annehmen(false);
        });
        return;
      }
      schritt(0.55, function () {
        Lr.ziel = Lr.stufe + 1;
        Lr.phase = 'lauf';
        Lr.ergebnisWert = undefined;
        Lr.t0 = S.zeit;
      });
    } else {
      Lr.wert = 0;
      S.gewinn = 0;
      S.gewinnAnzeige = 0;
      S.stat.leiterVerl++;
      klang.spiele('RISIKO_VERLOREN');
      meld.neu('LEITER VERLOREN', '', ROT, 1.2);
      schritt(1.2, function () {
        S.leiter = null;
        S.z = 'BEREIT';
        speichern();
      });
    }
  }

  // ---------------------------------------------------------------- Einsatz
  function einsatzAendern(d) {
    if (S.z !== 'BEREIT' || S.fs) {

  function zellMitte(i, r) {

  function leiterRungen() {
    const Lp = LB.leiter;

    const n = LEITER_FAKTOR.length;
    const verf = Lp.h - kopf - fuss;
    const sh = verf / n;
    const h = Math.min(46, sh - 6);
    const R = [];
    for (let k = 0; k < n; k++) {
      R.push({ x: Lp.x + 16, y: Lp.y + kopf + (n - 1 - k) * sh + (sh - h) / 2, w: Lp.w - 32, h: h });
    }
    R.null = { x: Lp.x + 16, y: Lp.y + Lp.h - fuss + 8, w: Lp.w - 32, h: Math.min(40, fuss - 16) };
    return R;
  }

    }, 'N / ↓');
    ['risiko', 'leiter', 'nehmen', 'rot', 'schwarz', 'nehmenK', 'stopp', 'nehmenL'].forEach(function (k) {
      btn[k].sichtbar = false;
    });
    btn.rot.still = btn.schwarz.still = btn.stopp.still = true;
  }

  function verlassenErlaubt() {
    return (S.z === 'BEREIT' || S.z === 'GEWINN') && !S.fs && !planLaeuft();
  }

  // ---------------------------------------------------------------- Update
  function update(dt) {
    S.zeit += dt;
    S.zt += dt;
    meld.update(dt);
    partikel.update(dt);
    while (P.liste.length && P.liste[0].t <= S.zeit) {
      const s = P.liste.shift();
      s.fn();
    }
    walzenUpdate(dt);
    // Gewinn zählen
    if (S.zaehlen) {
      const Z = S.zaehlen;
      const u = clamp01((S.zeit - Z.t0) / Math.max(0.01, Z.dauer));
      S.gewinnAnzeige = Math.round(Z.von + (Z.bis - Z.von) * u);
      if (S.zeit - Z.tick > 0.07 && u < 1) {
        Z.tick = S.zeit;
        klang.spiele('ZAEHL', { rate: 1 + 0.5 * u, gain: 0.6 });
      }
      if (u >= 1) {
        S.zaehlen = null;
      }
    }
    // Guthaben-Anzeige
    const d = Konto.kredit - S.kreditAnzeige;
    S.kreditAnzeige = Math.abs(d) < 1 ? Konto.kredit : S.kreditAnzeige + d * Math.min(1, dt * 7);
    // Intro (Sondersymbol-Wahl)
    if (S.intro) {
      const I = S.intro;
      const t = S.zeit - I.t0;
      let k = -1;
      for (let i = 0; i < I.folge.length; i++) {
        if (I.folge[i].t <= t) {
          k = i;
        }
      }
      if (k !== I.tick && t < I.ende + 0.01) {
        I.tick = k;
        klang.spiele('SEITE', { zufall: 0.1, gain: 0.7 });
      }
      if (t >= I.ende && !I.gelandet) {
        I.gelandet = true;
        klang.spiele('GEWINN_MITTEL');
      }
      if (t > I.ende + 1.6) {
        introFertig();
      }
    }
    // Leiter-Blinklicht
    if (S.leiter && S.leiter.phase === 'lauf') {
      const b = Math.floor((S.zeit - S.leiter.t0) / 0.3) % 2;
      if (b !== S.leiter.letzt) {
        S.leiter.letzt = b;
        klang.spiele(b === 0 ? 'RISIKO_HOCH' : 'RISIKO_TIEF', { gain: 0.6 });
      }
    }
    if (S.karte && S.karte.phase === 'wahl') {
      const b = Math.floor((S.zeit - S.karte.t0) / 0.28) % 2;
      if (b !== S.karte.letzt) {
        S.karte.letzt = b;
        klang.spiele(b === 0 ? 'RISIKO_HOCH' : 'RISIKO_TIEF', { gain: 0.45 });
      }
    }
    // Linien weiterschalten
    if (S.zeigeLinie >= 0 && S.ergebnis) {
      const n = S.ergebnis.linien.length + (S.ergebnis.scatter.betrag > 0 ? 1 : 0);
      if (n > 0 && S.zeit - S.linienT > 0.9) {
        S.linienT = S.zeit;
        S.zeigeLinie = (S.zeigeLinie + 1) % n;
      }
    }
    // Knöpfe
    const z = S.z;
    const bereit = z === 'BEREIT' && !S.fs;

  // ---------------------------------------------------------------- Zeichnen: Walzen
  function zeichneWalzen(g) {

      g.fillRect(x, W.y, W.cw, hoeheG);

      if (sp) {

    const expW = S.exp ? S.exp.walzen : null;
    for (let i = 0; i < 5; i++) {
      const w = walzen[i];
      const st = STREIFEN[i], L = st.length;
      const x = W.x + i * W.cw;
      if (expW && expW.indexOf(i) >= 0) {

      }
      // Bewegungsunschärfe gleitend nach Geschwindigkeit (kein harter Wechsel beim Bremsen)
      const blur = Stil.sparmodus ? 0 : clamp01((Math.abs(w.vel || 0) - 5) / 10);
      const landPop = w.einrastZeit !== undefined && S.zeit - w.einrastZeit < 0.4 ? (S.zeit - w.einrastZeit) / 0.4 : -1;
      const basis = Math.floor(w.pos);
      const frac = w.pos - basis;
      for (let r = -1; r <= 3; r++) {
        const idx = ((basis + r) % L + L) % L;
        const s = st[idx];
        const y = W.y + (r - frac) * W.rh;
        const cx = x + W.cw / 2, cy = y + W.rh / 2;
        if (cy < W.y - W.rh || cy > W.y + hoeheG + W.rh) {
          continue;
        }
        let sk = 1;
        let hl = false;
        if (landPop >= 0 && s === BUCH && r >= 0 && r <= 2) {

        }
        if (w.phase === 'steht' && r >= 0 && r <= 2) {

          if (s === BUCH && S.buchFeier && S.zeit - S.buchFeier < 1.6) {

          }

        if (hl && !Stil.sparmodus) {

        const gg = gr * sk;
        if (blur < 0.999) {

            g.globalAlpha = 1 - blur;
          }
          g.drawImage(symbolBild(s, px, false), cx - gg / 2, cy - gg / 2, gg, gg);
        }
        if (blur > 0.001) {

          g.drawImage(symbolBild(s, px, true), cx - gg / 2, cy - gg / 2, gg, gg);

    g.fillStyle = gp(g, 0, W.y + hoeheG - 26, C(0, 0, 0, 0), 0, W.y + hoeheG, C(0, 0, 0, 120));
    g.fillRect(W.x, W.y + hoeheG - 26, breiteG, 26);
    g.restore();
    // Trennstege
    for (let i = 1; i < 5; i++) {

  /** Gehört die Position zu der gerade angezeigten Gewinnlinie (oder zum Scatter)? */
  function gewinnPosition(i, r) {
    const e = S.ergebnis;
    if (!e || S.zeigeLinie === -1 || !(S.z === 'ZEIGEN' || S.z === 'GEWINN' || S.z === 'EXP' || S.z === 'FS_WARTEN' || S.z === 'BEREIT')) {
      return false;
    }
    const pruefe = function (lw) {
      return i < lw.n && LINIEN[lw.l][i] === r;
    };
    if (S.zeigeLinie === -2) {
      for (let k = 0; k < e.linien.length; k++) {
        if (pruefe(e.linien[k])) {
          return true;
        }
      }
      return e.scatter.betrag > 0 && S.fenster[i][r] === BUCH;
    }
    const k = S.zeigeLinie;
    if (k < e.linien.length) {
      return pruefe(e.linien[k]);
    }
    return e.scatter.betrag > 0 && S.fenster[i][r] === BUCH;
  }
  function zeichneLinie(g, l, alphaW, breiteL) {
    const W = LB.walzen;

    pkt.push([W.x + 5 * W.cw + 6, W.y + (LINIEN[l][4] + 0.5) * W.rh]);

  function zeichneGewinnlinien(g) {
    const e = S.ergebnis;

    if (S.linienZeigen && S.zeit - S.linienZeigen < 1.4 && S.z === 'BEREIT') {
      for (let l = 0; l < S.linien; l++) {

    }
    if (S.exp) {
      const u = clamp01((S.zeit - S.exp.t0 - 0.6) / 0.3);

    }
    if (!e || S.zeigeLinie === -1 || S.z === 'KARTE' || S.z === 'LEITER' || S.z === 'DREHT') {

    const rahmenFuer = function (lw) {

  // ---------------------------------------------------------------- Zeichnen: Intro (Buch wählt Sondersymbol)
  function zeichneIntro(g) {
    const I = S.intro;
    const W = LB.walzen;
    const bw = W.cw * 5, bh = W.rh * 3;
    const t = S.zeit - I.t0;
    g.save();
    g.fillStyle = 'rgba(6,6,20,' + (0.82 * clamp01(t / 0.3)).toFixed(3) + ')';
    g.fillRect(W.x, W.y, bw, bh);
    const auf = easeOutBack(clamp01(t / 0.45));
    const cx = W.x + bw / 2, cy = W.y + bh / 2 + 6;
    const sw = Math.min(bw * 0.3, bh * 0.62), sh = sw * 1.25;
    if (!Stil.sparmodus) {
      strahlen(g, cx, cy, Math.max(bw, bh) * 0.7, 18, S.zeit * 0.3, C(255, 220, 120, 70), 0.5);
    }
    g.translate(cx, cy);
    g.scale(auf, auf);
    // Einband
    fuell(g, rrP(-sw - 14, -sh / 2 - 10, sw * 2 + 28, sh + 20, 24), C(120, 12, 20));
    rand(g, rrP(-sw - 14, -sh / 2 - 10, sw * 2 + 28, sh + 20, 24), KONTUR, 3);
    // Seiten
    const links = rrP(-sw, -sh / 2, sw, sh, 12), rechts = rrP(0, -sh / 2, sw, sh, 12);
    g.fillStyle = gp(g, 0, -sh / 2, C(255, 248, 226), 0, sh / 2, C(232, 210, 164));
    g.fill(links);
    g.fill(rechts);
    rand(g, links, C(140, 100, 50), 2);
    rand(g, rechts, C(140, 100, 50), 2);
    g.fillStyle = gp(g, -14, 0, C(0, 0, 0, 0), 0, 0, C(0, 0, 0, 60));
    g.fillRect(-14, -sh / 2, 14, sh);
    // linke Seite: Text und Ornamente
    text(g, I.erstes ? 'FREISPIELE' : '+10 FREISPIELE', titel(Math.max(12, sw * 0.13)), C(150, 60, 0), -sw / 2, -sh / 2 + sh * 0.2, 0);
    text(g, 'Sondersymbol', sans(Math.max(10, sw * 0.08)), C(120, 80, 40), -sw / 2, -sh / 2 + sh * 0.32, 0);
    g.strokeStyle = 'rgba(150,100,40,0.6)';
    g.lineWidth = 2;
    for (let k = 0; k < 4; k++) {
      const y = -sh / 2 + sh * (0.45 + k * 0.12);
      g.beginPath();
      g.moveTo(-sw * 0.85, y);
      g.quadraticCurveTo(-sw / 2, y - 8, -sw * 0.15, y);
      g.stroke();
    }
    // rechte Seite: blätternde Symbole
    let k = 0;
    for (let i = 0; i < I.folge.length; i++) {
      if (I.folge[i].t <= t) {
        k = i;
      }
    }
    const s = I.folge[k].s;
    const seit = t - I.folge[k].t;
    const blatt = clamp01(seit / 0.06);
    g.save();
    g.translate(sw / 2, 0);
    g.scale(Math.max(0.05, blatt), 1);
    const gr = sw * 0.82;
    const fertig = t >= I.ende;
    if (fertig && !Stil.sparmodus) {
      glow(g, 0, 0, gr * 0.75, C(255, 210, 60, 160));
    }
    const sk = fertig ? 1 + 0.08 * Math.sin(Math.min(1, (t - I.ende) / 0.5) * Math.PI) : 1;
    g.drawImage(symbolBild(s, gr * sk * aufloesung, false), -gr * sk / 2, -gr * sk / 2, gr * sk, gr * sk);
    g.restore();
    g.restore();
    if (t >= I.ende) {
      comicText(g, NAMEN[I.sym].toUpperCase(), titel(26), GELB, cx, W.y + bh - 18, 0, 3);
    }
  }

  // ---------------------------------------------------------------- Eingabe
  function aufWalzen(x, y) {
    const W = LB.walzen;
    return x >= W.x && x <= W.x + W.cw * 5 && y >= W.y && y <= W.y + W.rh * 3;
  }
  function aufLeiter(x, y) {
    const Lp = LB.leiter;
    return x >= Lp.x && x <= Lp.x + Lp.w && y >= Lp.y && y <= Lp.y + Lp.h;
  }

  const szene = {
    name: 'sonnenbuch',
    betreten: function () {
      if (!S.geladen) {
        S.geladen = true;
        laden();
        S.fenster = fensterAus(walzen.map(function (w) {
          return ((Math.floor(w.pos) % STREIFEN[w.i].length) + STREIFEN[w.i].length) % STREIFEN[w.i].length;
        }));
      }
      S.kreditAnzeige = Konto.kredit;
      S.ov = 'KEINS';
      if (S.fs) {
        // unterbrochene Freispiele fortsetzen
        S.z = 'FS_WARTEN';
        S.gewinnAnzeige = S.fs.gewinn;
        meld.neu('FREISPIELE', 'Es geht weiter!', GOLD, 1.6);
        planLeeren();
        schritt(1.2, function () {
          if (S.z === 'FS_WARTEN') {
            if (S.fs.neu) {
              introStarten(S.fs.symbole[0], true);

          }
        });
      } else {
        S.z = 'BEREIT';
        meld.neu('SONNENBUCH', 'Viel Glück!', GOLD, 1.6);
      }
    },
    verlassen: function () {
      if (S.z === 'GEWINN') {
        annehmen(false);
      }
      S.auto = false;
      if (laufTon) {
        laufTon.stop();
        laufTon = null;
      }
      if (spannTon) {
        spannTon.stop();

      }
      planLeeren();
      speichern();
    },
    layout: function (gw, gh) {
      const hoch = gh > gw * 1.1;
      const zielH = hoch ? clampI(Math.round(720 * gh / gw), 1240, 1600) : 800;
      if (!LB || LB.hoch !== hoch || (hoch && LB.H !== zielH)) {
        LB = hoch ? layoutHoch(zielH) : layoutQuer();
        baueKnoepfe();
        partikel.hoehe = LB.H;
        if (S.ov !== 'KEINS') {
          const art = S.ov;
          S.ov = 'KEINS';
          oeffne(art);
        }
      }
      return { W: LB.W, H: LB.H };
    },
    update: update,
    zeichne: zeichne,
    ruhig: function () {
      return S.z === 'BEREIT' && S.ov === 'KEINS' && !planLaeuft() && meld.leer() && partikel.anzahl() === 0
        && Math.abs(Konto.kredit - S.kreditAnzeige) < 1 && alleStehen() && Stil.sparmodus;
    },
    dirty: function () {
      return S.dirty;
    },
    speichern: speichern,
    touchGeaendert: function () {
      baueKnoepfe();
    },
    meldung: function (t, u, f) {
      meld.neu(t, u, f, 2);
    },
    runter: function (x, y) {
      S.mx = x;
      S.my = y;
      if (S.ov !== 'KEINS') {
        if (ovKnoepfe.runter(x, y)) {
          return;
        }
        const O = ovRahmen;
        if (O && (x < O.x || x > O.x + O.w || y < O.y || y > O.y + O.h)) {
          schliessen();
        }
        return;
      }
      if (knoepfe.runter(x, y)) {
        return;
      }
      if (S.z === 'LEITER' && aufLeiter(x, y)) {
        leiterStopp();
        return;
      }
      if (S.z === 'KARTE' && aufWalzen(x, y)) {
        const W = LB.walzen;
        karteWaehlen(x < W.x + W.cw * 2.5);
        return;
      }
      if (aufWalzen(x, y)) {
        starte();
      }
    },
    bewegt: function (x, y, gedrueckt, maus) {
      if (maus || gedrueckt) {
        S.mx = x;
        S.my = y;
      }
    },
    hoch: function (x, y, maus) {
      if (S.ov !== 'KEINS') {
        ovKnoepfe.hoch(x, y, klang);
      } else {
        knoepfe.hoch(x, y, klang);
      }
      if (!maus) {
        S.mx = S.my = -1;
      }
    },
    abbruch: function () {
      knoepfe.abbruch();
      ovKnoepfe.abbruch();
      S.mx = S.my = -1;
    },
    maus_weg: function () {
      S.mx = S.my = -1;
    },
    taste: function (e) {
      const code = e.code, key = e.key;
      if (e.repeat && code !== 'Space') {
        return;
      }
      if (S.ov !== 'KEINS') {
        if (code === 'Escape') {
          schliessen();
        }
        return;
      }
      if (code === 'Space' || code === 'Enter' || code === 'NumpadEnter') {
        if (e.repeat) {
          return;
        }
        if (S.z === 'LEITER') {
          leiterStopp();
        } else if (S.z !== 'KARTE') {
          starte();
        }
        return;
      }
      switch (code) {
        case 'ArrowLeft':
          karteWaehlen(true);
          return;
        case 'ArrowRight':
          karteWaehlen(false);
          return;
        case 'ArrowUp':
          if (S.z === 'LEITER') {
            leiterStopp();
          } else {
            leiterStarten();
          }
          return;
        case 'KeyR':
          karteStarten();
          return;
        case 'KeyL':
          leiterStarten();
          return;
        case 'KeyN':
        case 'ArrowDown':
          annehmen(false);
          return;
        case 'KeyA':
          btn.auto.ausloesen();
          return;
        case 'KeyX':
          linienAendern();
          return;
        case 'KeyM':
          tonUmschalten();
          return;
        case 'KeyI':
          oeffne('HILFE');
          return;
        case 'KeyS':
          oeffne('STATISTIK');
          return;
        case 'KeyE':
          if (S.z === 'BEREIT' && !S.fs) {
            oeffne('REGELN');
          }
          return;
        case 'KeyG':
          oeffne('GUTHABEN');
          return;
        case 'Escape':
          if (verlassenErlaubt()) {
            wechsleSzene('lobby');
          }
          return;
        default:
          break;
      }
      if (key === '-' || code === 'NumpadSubtract' || code === 'Minus') {
        einsatzAendern(-1);
      } else if (key === '+' || code === 'NumpadAdd' || code === 'BracketRight' || code === 'Equal') {
        einsatzAendern(1);
      }
    }
  };

  // ---------------------------------------------------------------- Vorschau für die Spielauswahl
  szene.vorschau = function (g, p, zeit) {
    g.fillStyle = radial(g, p.x + p.w / 2, p.y + p.h * 0.45, Math.max(p.w, p.h) * 0.8,
      [[0, C(50, 56, 120)], [0.6, C(20, 22, 56)], [1, C(6, 6, 18)]]);
    g.fillRect(p.x, p.y, p.w, p.h);
    // drei Mini-Walzen
    const cw = Math.min(p.w / 3.4, p.h / 2.6);
    const rh = cw * 0.86;
    const x0 = p.x + p.w / 2 - cw * 1.5, y0 = p.y + p.h / 2 - rh * 1.5 + rh * 0.15;
    const sym = [[AS, FALKE, DAME], [KATZE, BUCH, ANKH], [KOENIG, PYRAMIDE, ZEHN]];
    for (let i = 0; i < 3; i++) {
      fuell(g, rrP(x0 + i * cw + 3, y0, cw - 6, rh * 3, 14), C(14, 16, 44, 220));
      for (let r = 0; r < 3; r++) {
        const s = sym[i][r];
        let gr = cw * 0.8;
        const cx = x0 + (i + 0.5) * cw, cy = y0 + (r + 0.5) * rh;
        if (s === BUCH) {
          gr *= 1.15 + (Stil.sparmodus ? 0 : 0.06 * Math.sin(zeit * 3));
          if (!Stil.sparmodus) {
            strahlen(g, cx, cy, cw * 1.3, 12, zeit * 0.5, C(255, 220, 120, 120), 0.5);
          }
        }
        g.drawImage(symbolBild(s, gr * aufloesung, false), cx - gr / 2, cy - gr / 2, gr, gr);
      }
    }
    strich(g, 3);
    g.strokeStyle = css(C(230, 180, 90));
    g.strokeRect(x0, y0, cw * 3, rh * 3);
  };

  // ---------------------------------------------------------------- Test- und Simulationszugang
  function simuliere(n, sonderFest) {
    let einsatzS = 0, gewinnS = 0, fsAnz = 0, fsSpiele = 0, max = 0;
    const lbW = 1, lin = 10;
    for (let k = 0; k < n; k++) {
      einsatzS += lbW * lin;
      const st = STREIFEN.map(function (s) {
        return Math.floor(Math.random() * s.length);
      });
      const e = bewerte(fensterAus(st), lin, lbW, []);
      let g = e.summe;
      if (e.scatter.n >= 3) {
        fsAnz++;
        const sym = [sonderFest !== undefined ? sonderFest : Math.floor(Math.random() * 9)];
        let rest = 10;
        while (rest > 0) {
          rest--;
          fsSpiele++;
          const s2 = STREIFEN.map(function (s) {
            return Math.floor(Math.random() * s.length);
          });
          const e2 = bewerte(fensterAus(s2), lin, lbW, sym);
          g += e2.summe;
          if (e2.scatter.n >= 3) {
            rest += 10;
            if (sym.length < 9) {
              let neu;
              do {
                neu = Math.floor(Math.random() * 9);
              } while (sym.indexOf(neu) >= 0);
              sym.push(neu);
            }
          }
        }
      }
      gewinnS += g;
      max = Math.max(max, g);
    }
    return { quote: gewinnS / einsatzS, fsAlle: n / Math.max(1, fsAnz), fsSpiele: fsSpiele / Math.max(1, fsAnz), max: max / (lbW * lin) };
  }
  szene.test = {
    S: S, P: P, walzen: walzen, bewerte: bewerte, fensterAus: fensterAus, linienWert: linienWert, STREIFEN: STREIFEN, LINIEN: LINIEN,
    PAY: PAY, simuliere: simuliere, starte: starte, annehmen: annehmen, karteStarten: karteStarten, karteWaehlen: karteWaehlen,

    }, knopf: function (n) {
      return btn[n];
    }, symbolBild: symbolBild, setzeStops: function (l) {

    }, setzeSonder: function (l) {
      testSonder = l;
    }
  };
  return szene;
})();
