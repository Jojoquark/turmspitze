  // ---------------------------------------------------------------- Vorschauen
  function vorschauTurm(g, p, zeit) {
    g.fillStyle = radial(g, p.x + p.w / 2, p.y + p.h * 1.05, Math.max(p.w, p.h) * 1.05,
      [[0, C(255, 150, 20)], [0.35, C(190, 50, 0)], [0.75, C(70, 10, 0)], [1, C(26, 4, 0)]]);
    g.fillRect(p.x, p.y, p.w, p.h);
    // kleine Flammen am Boden
    const n = 9;
    for (let i = 0; i < n; i++) {
      const x = p.x + (i + 0.5) * p.w / n;
      const t = zeit * 2.1 + i * 1.7;
      const hh = p.h * (0.22 + 0.07 * Math.sin(t) + 0.04 * Math.sin(t * 2.3 + 1));
      const bw = p.w / n * 1.5;
      const by = p.y + p.h + 4;
      const sway = 6 * Math.sin(t * 1.3);
      g.beginPath();
      g.moveTo(x - bw / 2, by);
      g.bezierCurveTo(x - bw / 2, by - hh * 0.5, x + sway - bw * 0.2, by - hh * 0.7, x + sway, by - hh);
      g.bezierCurveTo(x + sway + bw * 0.2, by - hh * 0.7, x + bw / 2, by - hh * 0.5, x + bw / 2, by);
      g.closePath();
      g.fillStyle = lin(g, 0, by, 0, by - hh, [[0, C(255, 220, 110, 170)], [0.5, C(255, 120, 0, 120)], [1, C(200, 30, 0, 0)]]);
      g.fill();
    }
    // Sonne (Joker) oben
    const sonneGr = Math.min(p.h * 0.42, p.w * 0.36);
    const sy = p.y + sonneGr * 0.62;
    glow(g, p.x + p.w / 2, sy, sonneGr * 0.95, C(255, 200, 60, 110));
    zeichneSymbol(g, SONNE, p.x + p.w / 2, sy, sonneGr, Math.round(sonneGr * aufloesung), 1, 1, 0, 1, zeit * 0.5);
    // drei Tuerme
    const stufenN = 5;
    const top = sy + sonneGr * 0.56;
    const unten = p.y + p.h - 12;
    const tw = Math.min(p.w * 0.25, 82);
    const rh = (unten - top) / stufenN;
    for (let t = 0; t < 3; t++) {
      const cx = p.x + p.w * (0.2 + 0.3 * t);
      const x = cx - tw / 2;
      const zyklus = (zeit * 0.55 + t * 1.45) % 7.5;
      const stand = Math.min(stufenN, Math.floor(zyklus));
      const korpus = rrP(x - 4, top - 4, tw + 8, unten - top + 8, 14);
      fuell(g, korpus, C(20, 6, 0, 210));
      goldRahmenBox(g, korpus, x - 4, top - 4, unten - top + 8, 2.2);
      for (let s = 1; s <= stufenN; s++) {
        const ry = unten - s * rh + 2;
        const voll = s <= stand;
        const zeile = rrP(x + 2, ry, tw - 4, rh - 4, 10);
        if (voll) {
          if (s === stand) {
            const neu = clamp01(1 - (zyklus - stand) * 2.5);
            glowRand(g, zeile, TURM_HELL[t], 0.4 + 0.6 * neu, 7);
          }
          g.fillStyle = gp(g, 0, ry, heller(TURM_F[t], 0.15), 0, ry + rh - 4, TURM_DUNKEL[t]);
        } else {
          g.fillStyle = gp(g, 0, ry, C(50, 20, 8), 0, ry + rh - 4, C(28, 10, 4));
        }
        g.fill(zeile);
        rand(g, zeile, voll ? KONTUR : C(120, 70, 20, 120), 1.2);
        const ig = Math.min(rh - 8, tw * 0.42);
        zeichneSymbol(g, TURM_SYMBOL[t], cx, ry + (rh - 4) / 2, ig, Math.round(ig * aufloesung), 1, 1, 0, voll ? 1 : 0.3);
      }
    }
  }

  function vorschauRoulette(g, p, zeit) {
    zeichneFilz(g, rectP(p.x, p.y, p.w, p.h), p.x, p.y, p.w, p.h, C(16, 96, 58));
    const spalte = !LL.hoch && p.w >= 240;
    const r = spalte ? Math.min((p.w - 70) * 0.5, p.h * 0.5) - 6 : Math.min(p.w * 0.5, p.h * 0.5) - 8;
    const cx = spalte ? p.x + (p.w - 62) / 2 : p.x + p.w / 2;
    const cy = p.y + p.h / 2;
    fuell(g, kreisP(cx + 5, cy + 8, r), C(0, 0, 0, 90));
    SzeneRoulette.vorschau(g, cx, cy, r, zeit);
    if (spalte) {
      // zuletzt gefallene Zahlen (Anzeige am Tisch)
      const zahlen = [17, 0, 32, 5, 26, 11];
      const zx = p.x + p.w - 44, zh = (p.h - 28) / zahlen.length;
      anzeigeFeld(g, zx - 26, p.y + 10, 52, p.h - 20);
      for (let i = 0; i < zahlen.length; i++) {
        const z = zahlen[i];
        const rot = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36].indexOf(z) >= 0;
        const f = z === 0 ? C(60, 220, 110) : (rot ? C(255, 80, 70) : C(235, 230, 220));
        const y = p.y + 14 + i * zh + zh / 2 + 7;
        if (i === 0) {
          leuchtText(g, String(z), titel(24), f, alpha(f, 160), zx, y, 0, 5);
        } else {
          text(g, String(z), titel(18), alpha(f, 220 - i * 22), zx, y, 0);
        }
      }
    } else {
      zeichneStapel(g, 2500, p.x + 34, p.y + p.h - 30, 18, aufloesung, true);
      zeichneStapel(g, 600, p.x + p.w - 34, p.y + p.h - 30, 18, aufloesung, true);
    }
  }

  function vorschauBlackjack(g, p, zeit) {
    zeichneFilz(g, rectP(p.x, p.y, p.w, p.h), p.x, p.y, p.w, p.h, C(18, 88, 60));
    const cx = p.x + p.w / 2;
    // Schriftbogen wie auf dem Tisch
    g.save();
    strich(g, 1.6);
    g.strokeStyle = 'rgba(255,220,140,0.55)';
    g.beginPath();
    g.ellipse(cx, p.y - p.h * 0.55, p.w * 0.62, p.h * 1.02, 0, Math.PI * 0.18, Math.PI * 0.82);
    g.stroke();
    g.restore();
    const kw = LL.hoch ? Math.min(p.w * 0.25, p.h * 0.24, 84) : Math.min(p.w * 0.2, p.h * 0.27, 78);
    // Bank: verdeckte und offene Karte
    const by = p.y + (LL.hoch ? p.h * 0.08 : p.h * 0.1);
    zeichneSpielkarte(g, -1, cx - kw * 0.95, by, kw * 0.82, -0.04, 1, aufloesung);
    zeichneSpielkarte(g, 44, cx + kw * 0.05, by, kw * 0.82, 0.05, 1, aufloesung);
    if (!LL.hoch || p.h >= 300) {
      text(g, 'BLACK JACK ZAHLT 3 : 2', titel(Math.max(10, kw * 0.17)), C(255, 225, 150, 200), cx,
        LL.hoch ? by + kw * 1.2 + 30 : p.y + p.h * 0.55, 0);
    }
    // Spieler: Ass + Koenig
    const hub = Stil.sparmodus ? 0 : Math.sin(zeit * 2.2) * 2;
    const py = (LL.hoch ? p.y + p.h * 0.56 : p.y + p.h - kw * 1.4 - 10) + hub;
    zeichneSpielkarte(g, 0, cx - kw * 0.78, py + 4, kw, -0.12, 1, aufloesung);
    zeichneSpielkarte(g, 25, cx - kw * 0.12, py, kw, 0.1, 1, aufloesung);
    // Jetons
    zeichneStapel(g, 2500, p.x + Math.max(40, p.w * 0.16), p.y + p.h - 26, Math.max(15, kw * 0.26), aufloesung, true);
    zeichneStapel(g, 1500, p.x + p.w - Math.max(40, p.w * 0.16), p.y + p.h - 26, Math.max(15, kw * 0.26), aufloesung, true);
    // Black-Jack-Blitz
    const puls = Stil.sparmodus ? 0.6 : 0.5 + 0.5 * Math.sin(zeit * 3);
    const f = titel(Math.max(13, kw * 0.24));
    const tw = breite(g, 'BLACK JACK!', f) + 16;
    const bx = Math.min(cx + kw * 1.25, p.x + p.w - tw / 2 - 6), byy = LL.hoch ? py - kw * 0.2 : py + kw * 0.3;
    g.save();
    g.translate(bx, byy);
    g.rotate(-0.18);
    const schild = rrP(-tw / 2, -kw * 0.2, tw, kw * 0.36, kw * 0.3);
    glowRand(g, schild, GELB, puls, 8);
    g.fillStyle = gp(g, 0, -kw * 0.2, C(255, 230, 90), 0, kw * 0.16, C(240, 150, 0));
    g.fill(schild);
    rand(g, schild, KONTUR, 2);
    text(g, 'BLACK JACK!', f, KONTUR, 0, kw * 0.06, 0);
    g.restore();
  }

  // ---------------------------------------------------------------- Zeichnen
  function zeichneSpielkarteLobby(g, i, zeit) {
    const k = LL.karten[i];
    const s = SPIELE[i];
    const h = Z.hover[i], d = Z.druck[i];
    const t = kartenTeile(k);
    g.save();
    const sk = 1 + 0.012 * h - 0.015 * d;
    if (Math.abs(sk - 1) > 0.001) {
      const cx = k.x + k.w / 2, cy = k.y + k.h / 2;
      g.translate(cx, cy);
      g.scale(sk, sk);
      g.translate(-cx, -cy);
    }
    const r = rrP(k.x, k.y, k.w, k.h, 34);
    fuell(g, rrP(k.x + 6, k.y + 9, k.w, k.h, 34), C(0, 0, 0, 120));
    const fokus = Z.fokus === i ? 1 : 0;
    if (h > 0.02 || fokus) {
      glowRand(g, r, heller(s.farbe, 0.2), Math.max(h, fokus * 0.8), 18);
    }
    g.fillStyle = gp(g, k.x, k.y, mix(C(64, 18, 6, 246), s.farbe, 0.08), k.x, k.y + k.h, C(18, 4, 0, 246));
    g.fill(r);
    goldRahmenBox(g, r, k.x, k.y, k.h, 3.5);
    // Vorschau
    const pv = t.pv;
    const pr = rrP(pv.x, pv.y, pv.w, pv.h, 26);
    g.save();
    g.clip(pr);
    if (i === 0) {
      vorschauTurm(g, pv, zeit);
    } else if (i === 1) {
      vorschauRoulette(g, pv, zeit);
    } else if (i === 2) {
      vorschauBlackjack(g, pv, zeit);
    } else {
      SzeneBuch.vorschau(g, pv, zeit);
    }
    // Glanz oben
    g.fillStyle = gp(g, 0, pv.y, C(255, 255, 255, 40), 0, pv.y + pv.h * 0.35, C(255, 255, 255, 0));
    g.fillRect(pv.x, pv.y, pv.w, pv.h * 0.35);
    g.restore();
    goldRahmenBox(g, pr, pv.x, pv.y, pv.h, 2.4);
    // Texte
    let gr = 31;
    while (gr > 22 && breite(g, s.titel, titel(gr)) > t.tw) {
      gr -= 1;
    }
    let y = t.ty;
    glanzText(g, s.titel, titel(gr), t.tx, y, -1, WEISS, heller(s.farbe, 0.55), s.farbe, 3.2, -1);
    y += 23;
    comicText(g, s.unter, titel(12), heller(s.farbe, 0.45), t.tx + 2, y, -1, 1.5);
    y += 26;
    // Merkmale (über dem Knopf, bis zu zwei Reihen)
    const tags = s.tags.concat(Z.quoten[i] ? [Z.quoten[i]] : []);
    const tf = titel(11);
    const th = 22;
    const reihen = [];
    let reihe = [], rw = 0;
    for (let j = 0; j < tags.length; j++) {
      const bw = breite(g, tags[j], tf) + 16;
      if (reihe.length && rw + bw > t.tw + 2) {
        reihen.push(reihe);
        reihe = [];
        rw = 0;
      }
      reihe.push({ t: tags[j], w: bw, q: j === s.tags.length });
      rw += bw + 7;
    }
    reihen.push(reihe);
    const tagY = t.knopf.y - 12 - reihen.length * (th + 6);
    const f = sans(14);
    const zl = umbrechen(g, s.text, f, t.tw);
    const maxZ = Math.max(1, Math.floor((tagY - y - 4) / 20) + 1);
    const zeilen = Math.min(zl.length, maxZ);
    for (let j = 0; j < zeilen; j++) {
      text(g, zl[j], f, C(255, 236, 205), t.tx, y + j * 20, -1);
    }
    const textEnde = y + (zeilen - 1) * 20;
    y = tagY;
    for (let rr = 0; rr < reihen.length; rr++) {
      let tx = t.tx;
      for (let j = 0; j < reihen[rr].length; j++) {
        const tg = reihen[rr][j];
        const pill = rrP(tx, y, tg.w, th, th);
        fuell(g, pill, tg.q ? C(20, 8, 2, 200) : alpha(dunkler(s.farbe, 0.35), 200));
        rand(g, pill, tg.q ? C(255, 210, 110, 200) : alpha(heller(s.farbe, 0.4), 220), 1.4);
        text(g, tg.t, tf, tg.q ? GELB_HELL : WEISS, tx + tg.w / 2, y + th / 2 + 4.2, 0);
        tx += tg.w + 7;
      }
      y += th + 6;
    }
    // Kurzanleitung, wenn Platz ist
    if (s.punkte && zeilen === zl.length) {
      let py = textEnde + 34;
      const pf = sans(13);
      for (let j = 0; j < s.punkte.length; j++) {
        if (py > tagY - 10) {
          break;
        }
        const stern = stern5P(t.tx + 7, py - 5, 7, 3.2);
        fuell(g, stern, heller(s.farbe, 0.3));
        rand(g, stern, KONTUR, 1.2);
        text(g, s.punkte[j], pf, C(255, 226, 190), t.tx + 21, py, -1);
        py += 24;
      }
    }
    g.restore();
  }

  function zeichne(g, cw, ch) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1;

    g.fillStyle = 'rgb(20,3,0)';

      g.fillStyle = 'rgba(20,5,0,0.72)';

      g.restore();
      zeichneOverlay(g);
      ovKnoepfe.zeichne(g, Z.zeit);

  // ---------------------------------------------------------------- Ablauf
  function update(dt) {
    Z.zeit += dt;
    meld.update(dt);
    glut.update(dt);
    if (!Stil.sparmodus && Math.random() < dt * 10) {
      glut.glut(Math.random() * LL.W, LL.H + 10);
    }
    const diff = Konto.kredit - Z.kreditAnzeige;
    if (Math.abs(diff) < 1) {
      Z.kreditAnzeige = Konto.kredit;
    } else {
      Z.kreditAnzeige += diff * Math.min(1, dt * 7);
    }
    const aktiv = Z.ov === 'KEINS';
    for (let i = 0; i < N; i++) {
      const ueber = aktiv && Z.mx >= 0 && kartenTreffer(Z.mx, Z.my) === i;
      Z.hover[i] += ((ueber ? 1 : 0) - Z.hover[i]) * Math.min(1, dt * 12);
      Z.druck[i] += ((Z.gedrueckt === i ? 1 : 0) - Z.druck[i]) * Math.min(1, dt * 24);
    }
    btnGeld.puls = Konto.kredit < 100;
    if (btnInstall) {
      btnInstall.puls = Z.ersterBesuch && !Stil.sparmodus;
    }
    knoepfe.update(dt, Z.mx, Z.my, aktiv);
    ovKnoepfe.update(dt, Z.mx, Z.my, true);
    if (Z.optionen) {
      Z.optionen.update(dt, Z.mx, Z.my);
    }
  }

  function kartenTreffer(x, y) {
    for (let i = 0; i < N; i++) {
      const k = LL.karten[i];
      if (x >= k.x && x <= k.x + k.w && y >= k.y && y <= k.y + k.h) {
        return i;
      }
    }
    return -1;
  }

  function quotenBerechnen() {
    try {
      Z.quoten[0] = 'QUOTE ' + prozent(mathe().optimal.rtp, 1);
    } catch (e) {
      Z.quoten[0] = '';
    }
    try {
      Z.quoten[2] = SzeneBlackjack.quote ? 'QUOTE ' + prozent(SzeneBlackjack.quote(), 1) : '';
    } catch (e) {
      Z.quoten[2] = '';
    }
  }

  const szene = {
    name: 'lobby',
    betreten: function () {
      Z.kreditAnzeige = Konto.kredit;
      Z.ov = 'KEINS';
      Z.gedrueckt = -1;
      Z.hover = [0, 0, 0, 0];
      Z.druck = [0, 0, 0, 0];
      ovKnoepfe.leeren();
      quotenBerechnen();
      if (btnTon) {
        btnTon.icon = klang.an ? 'TON_AN' : 'TON_AUS';
      }
    },
    verlassen: function () {
      Z.ersterBesuch = false;
      schliessen();
      Konto.speichern();
    },
    layout: function (gw, gh) {
      const hoch = gh > gw * 1.1;
      const zielH = hoch ? clampI(Math.round(720 * gh / gw), 1180, 1600) : 800;
      if (!LL || LL.hoch !== hoch || (hoch && LL.H !== zielH)) {
        LL = hoch ? layoutHoch(zielH) : layoutQuer();
        glut.hoehe = LL.H;
        baueKnoepfe();
        if (Z.ov !== 'KEINS') {
          oeffne(Z.ov);
        }
      }
      return { W: LL.W, H: LL.H };
    },
    update: update,
    zeichne: zeichne,
    ruhig: function () {
      if (!Stil.sparmodus || !meld.leer() || Math.abs(Konto.kredit - Z.kreditAnzeige) >= 1) {
        return false;
      }
      for (let i = 0; i < N; i++) {
        if (Math.abs(Z.hover[i] - Math.round(Z.hover[i])) > 0.01 || Z.druck[i] > 0.01) {
          return false;
        }
      }
      return true;
    },
    dirty: function () {
      return false;
    },
    speichern: function () {
      Konto.speichern();
    },
    touchGeaendert: function () {
      baueKnoepfe();
    },
    meldung: function (t, u, f) {
      meld.neu(t, u, f, 2.2);
    },
    runter: function (x, y) {
      Z.mx = x;
      Z.my = y;
      if (Z.ov !== 'KEINS') {
        if (ovKnoepfe.runter(x, y)) {
          return;
        }
        const O = ovRahmen;
        if (O && (x < O.x || x > O.x + O.w || y < O.y || y > O.y + O.h)) {
          schliessen();
        }
        return;
      }
      if (knoepfe.runter(x, y)) {
        return;
      }
      Z.gedrueckt = kartenTreffer(x, y);
    },
    bewegt: function (x, y, gedrueckt, maus) {
      if (maus || gedrueckt) {
        Z.mx = x;
        Z.my = y;
      }
      if (maus && Z.fokus >= 0 && kartenTreffer(x, y) >= 0) {
        Z.fokus = -1;
      }
    },
    hoch: function (x, y, maus) {
      if (Z.ov !== 'KEINS') {
        ovKnoepfe.hoch(x, y, klang);
      } else if (knoepfe.gedrueckt) {
        const b = knoepfe.gedrueckt;
        const spiel = spielKnoepfe.indexOf(b) >= 0;
        knoepfe.hoch(x, y, spiel ? null : klang);
      } else if (Z.gedrueckt >= 0) {
        const i = Z.gedrueckt;
        Z.gedrueckt = -1;
        if (kartenTreffer(x, y) === i) {
          starteSpiel(SPIELE[i].id);
        }
      }
      Z.gedrueckt = -1;
      if (!maus) {
        Z.mx = Z.my = -1;
      }
    },
    abbruch: function () {
      knoepfe.abbruch();
      ovKnoepfe.abbruch();
      Z.gedrueckt = -1;
      Z.mx = Z.my = -1;
    },
    maus_weg: function () {
      Z.mx = Z.my = -1;
    },
    taste: function (e) {
      const code = e.code;
      if (e.repeat) {
        return;
      }
      if (Z.ov !== 'KEINS') {
        if (code === 'Escape' || (Z.ov !== 'GUTHABEN' && (code === 'Enter' || code === 'Space'))) {
          schliessen();
        }
        return;
      }
      const vor = LL.hoch ? 'ArrowDown' : 'ArrowRight';
      const zurueckT = LL.hoch ? 'ArrowUp' : 'ArrowLeft';
      if (code === 'Digit1' || code === 'Numpad1' || code === 'KeyT') {
        starteSpiel('turmspitze');
      } else if (code === 'Digit2' || code === 'Numpad2' || code === 'KeyR') {
        starteSpiel('roulette');
      } else if (code === 'Digit3' || code === 'Numpad3' || code === 'KeyB') {
        starteSpiel('blackjack');
      } else if (code === 'Digit4' || code === 'Numpad4') {
        starteSpiel('sonnenbuch');
      } else if (code === vor || code === 'Tab') {
        Z.fokus = (Z.fokus + 1) % N;
        klang.spiele('KNOPF', { gain: 0.6 });
        e.preventDefault();
      } else if (code === zurueckT) {
        Z.fokus = (Z.fokus + N - 1) % N;
        klang.spiele('KNOPF', { gain: 0.6 });
      } else if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') {
        starteSpiel(SPIELE[Math.max(0, Z.fokus)].id);
      } else if (code === 'KeyG') {
        klang.spiele('KNOPF');
        oeffne('GUTHABEN');
      } else if (code === 'KeyE') {
        klang.spiele('KNOPF');
        oeffne('EINSTELLUNGEN');
      } else if (code === 'KeyM') {
        btnTon.ausloesen();
      }
    }
  };
  szene.test = {
    Z: Z, oeffne: oeffne, LL: function () {
      return LL;
    }, karten: function () {
      return LL.karten;
    }, spielKnoepfe: function () {
      return spielKnoepfe;
    }, knoepfe: function () {
      return { geld: btnGeld, ton: btnTon, einst: btnEinst, install: btnInstall };
    }
  };
  return szene;
})();

// ---- main.js
// ====================================================================================
// main.js – Spielhalle: Szenenwechsel (Spielauswahl, Turmspitze, Roulette, Black Jack, Sonnenbuch),
// Bildschirmgroesse, Spielschleife, Eingabe, Speichern und Installation als App (PWA).
// ====================================================================================

// ------------------------------------------------------------------ Installation als App
const Pwa = {
  aktiv: PWA_BUILD,
  deferred: null,
  standalone: function () {
    try {
      return window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches
        || navigator.standalone === true;
    } catch (e) {
      return false;
    }
  },
  ios: function () {
    const ua = navigator.userAgent || '';
    return /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  },
  android: function () {
    return /android/i.test(navigator.userAgent || '');
  },
  installSichtbar: function () {
    return this.aktiv && !this.standalone();
  },
  promptVerfuegbar: function () {
    return !!this.deferred;
  },
  installieren: function () {
    const d = this.deferred;
    if (!d) {
      return;
    }
    const self = this;
    try {
      d.prompt();
      d.userChoice.then(function () {
        self.deferred = null;
      }, function () {
        self.deferred = null;
      });
    } catch (e) {
      this.deferred = null;
    }
  },
  anleitung: function () {
    if (this.ios()) {
      return [
        { text: 'In Safari auf „Teilen“ tippen (iPhone: unten, iPad: oben rechts).', icon: 'TEILEN' },
        { text: '„Zum Home-Bildschirm“ wählen – eventuell etwas nach unten scrollen.', icon: 'HOME' },
        { text: 'Oben rechts auf „Hinzufügen“ tippen. Fertig!' }
      ];
    }
    if (this.deferred) {
      return [
        { text: 'Unten auf „JETZT INSTALLIEREN“ tippen.' },
        { text: 'Im Fenster des Browsers mit „Installieren“ bestätigen.' },
        { text: 'Die Spielhalle liegt danach als App auf dem Startbildschirm.' }
      ];
    }
    if (this.android()) {
      return [
        { text: 'In Chrome oben rechts das Menü ⋮ öffnen.' },
        { text: '„App installieren“ oder „Zum Startbildschirm hinzufügen“ wählen.' },
        { text: 'Mit „Installieren“ bestätigen. Fertig!' }
      ];
    }
    return [
      { text: 'In Chrome oder Edge rechts in der Adressleiste auf das Installieren-Symbol klicken.' },
      { text: 'Oder im Browsermenü „App installieren“ bzw. „Spielhalle installieren“ wählen.' },
      { text: 'Die App startet danach in einem eigenen Fenster.' }
    ];
  },
  hinweis: function () {
    let h = 'Danach startet die Spielhalle im Vollbild wie eine richtige App und läuft auch ohne Internet. Dein Spielgeld bleibt auf dem Gerät gespeichert.';
    if (this.ios()) {
      h += ' Kein Ton? Den Lautlos-Schalter am iPhone prüfen.';
    }
    return h;
  },
  registrieren: function () {
    if (!this.aktiv) {
      return;
    }
    const self = this;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      self.deferred = e;
    });
    window.addEventListener('appinstalled', function () {
      self.deferred = null;
      hinweisMelden('INSTALLIERT', 'Die Spielhalle ist jetzt eine App', GRUEN);
    });
    try {
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'
        || location.hostname === '127.0.0.1')) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {
            // offline-Funktion optional
          });
        });
      }
    } catch (e) {
      // ohne Service Worker weiterspielen
    }
  }
};

// ------------------------------------------------------------------ Szenen (Spielauswahl + drei Spiele)
const SZENEN = {};
let szene = null;
let uhr = 0, aktivBis = 0;
let uebergang = 0;

function hinweisMelden(t, u, f) {
  if (szene && szene.meldung) {
    szene.meldung(t, u, f);
  }
}

function tonUmschalten() {
  klang.an = !klang.an;
  Global.ton = klang.an;
  Global.speichern();
  if (!klang.an) {
    Stimme.still();
  }
}

function wechsleSzene(name) {
  const neu = SZENEN[name];
  if (!neu || neu === szene) {
    return;
  }
  if (szene && szene.verlassen) {
    szene.verlassen();
  }
  Stimme.still();
  szene = neu;
  aktiverZeiger = null;
  szene.betreten();
  groesseAnpassen(true);
  uebergang = 1;
  letzte = 0;
  try {
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', '#' + name);
    }
  } catch (e) {
    // Adresse ist optional
  }
}

function alleSpeichern() {
  // erst das Konto, dann die Szene: Szenen mit offenem Gewinn schreiben ihn beim Speichern mit ins Konto
  Konto.speichern();
  Global.speichern();
  if (szene && szene.speichern) {
    szene.speichern();
  }
}

// ------------------------------------------------------------------ Bildschirm
let canvas = null, ctx = null;
let probe = null;

function sichereRaender() {
  if (!probe) {
    return { t: 0, r: 0, b: 0, l: 0 };
  }
  const s = window.getComputedStyle(probe);
  return {
    t: parseFloat(s.paddingTop) || 0, r: parseFloat(s.paddingRight) || 0,
    b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0
  };
}

function groesseAnpassen(erzwingen) {
  if (!canvas || !szene) {
    return;
  }
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
  const ins = sichereRaender();
  const dMax = Stil.sparmodus ? 1.5 : 2;
  const d = Math.min(window.devicePixelRatio || 1, dMax);
  const gw = Math.max(1, w - ins.l - ins.r), gh = Math.max(1, h - ins.t - ins.b);
  const bw = Math.round(w * d), bh = Math.round(h * d);
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw;
    canvas.height = bh;
  }
  const lay = szene.layout(gw, gh, erzwingen);
  const s = Math.min(gw / lay.W, gh / lay.H);
  skala = s * d;
  ox = (ins.l + (gw - lay.W * s) / 2) * d;
  oy = (ins.t + (gh - lay.H * s) / 2) * d;
  aufloesung = Math.max(0.5, Math.round(skala * 4) / 4);
}

// ------------------------------------------------------------------ Spielschleife
let letzte = 0, ruheZeit = 0, letztesSpeichern = 0;

function schleife(jetzt) {
  window.requestAnimationFrame(schleife);
  if (!letzte) {
    letzte = jetzt;
  }
  let dt = (jetzt - letzte) / 1000;
  if (Stil.sparmodus && dt < 1 / 30 - 0.004) {
    return; // Sparmodus: 30 Bilder pro Sekunde
  }
  letzte = jetzt;
  dt = Math.min(0.05, Math.max(0, dt));
  uhr += dt;
  szene.update(dt);
  if (szene.dirty && szene.dirty() && uhr - letztesSpeichern > 1.0) {
    letztesSpeichern = uhr;
    szene.speichern();
  }
  if (uebergang > 0) {
    uebergang = Math.max(0, uebergang - dt * 3.2);
  }
  if (Stil.sparmodus && uebergang <= 0 && szene.ruhig && szene.ruhig() && uhr > aktivBis) {
    ruheZeit += dt;
    if (ruheZeit < 0.2) {
      return;
    }
  }
  ruheZeit = 0;
  zeichneBild();
}

function zeichneBild() {
  szene.zeichne(ctx, canvas.width, canvas.height);
  if (uebergang > 0) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(10,2,0,' + (uebergang * uebergang).toFixed(3) + ')';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }
}

// ------------------------------------------------------------------ Eingabe
function basisKoord(e) {
  const r = canvas.getBoundingClientRect();
  const d = canvas.width / Math.max(1, r.width);
  return [((e.clientX - r.left) * d - ox) / skala, ((e.clientY - r.top) * d - oy) / skala];
}

let aktiverZeiger = null;

function zeigerRunter(e) {
  if (aktiverZeiger !== null && aktiverZeiger !== e.pointerId) {
    return;
  }
  aktiverZeiger = e.pointerId;
  e.preventDefault();
  klang.entsperren();
  const touch = e.pointerType === 'touch' || e.pointerType === 'pen';
  if (touch !== Knopf.touch) {
    Knopf.touch = touch;
    if (szene.touchGeaendert) {
      szene.touchGeaendert();
    }
  }
  try {
    canvas.setPointerCapture(e.pointerId);
  } catch (err) {
    // egal
  }
  aktivBis = uhr + 0.6;
  const p = basisKoord(e);
  szene.runter(p[0], p[1], e);
}

function zeigerBewegt(e) {
  if (aktiverZeiger !== null && aktiverZeiger !== e.pointerId) {
    return;
  }
  aktivBis = uhr + 0.6;
  const p = basisKoord(e);
  szene.bewegt(p[0], p[1], aktiverZeiger !== null, e.pointerType === 'mouse');
}

function zeigerHoch(e) {
  if (aktiverZeiger !== null && aktiverZeiger !== e.pointerId) {
    return;
  }
  aktiverZeiger = null;
  klang.entsperren(); // iOS gibt Audio teils erst beim Loslassen frei
  const p = basisKoord(e);
  szene.hoch(p[0], p[1], e.pointerType === 'mouse');
}

function zeigerAbbruch() {
  aktiverZeiger = null;
  szene.abbruch();
}

function tasteGedrueckt(e) {
  const code = e.code;
  aktivBis = uhr + 0.6;
  klang.entsperren();
  if (Knopf.touch && e.isTrusted) {
    Knopf.touch = false;
    if (szene.touchGeaendert) {
      szene.touchGeaendert();
    }
  }
  if (code === 'Space' || code.indexOf('Arrow') === 0 || code === 'F11') {
    e.preventDefault();
  }
  if (code === 'F11') {
    vollbild();
    return;
  }
  szene.taste(e);
}

function vollbild() {
  try {
    const d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) {
      (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    } else {
      const el = d.documentElement;
      const f = el.requestFullscreen || el.webkitRequestFullscreen;
      if (f) {
        const r = f.call(el);
        if (r && r.catch) {
          r.catch(function () {
            // nicht erlaubt
          });
        }
      }
    }
  } catch (e) {
    // Vollbild ist optional
  }
}

// ------------------------------------------------------------------ Start
function schriftenLaden() {
  const fertig = new Promise(function (ok) {
    try {
      if (!document.fonts || !document.fonts.load) {
        ok();
        return;
      }
      Promise.all([
        document.fonts.load('20px "Lilita One"'),
        document.fonts.load('800 20px Nunito'),
        document.fonts.load('900 20px Nunito')
      ]).then(function () {
        ok();
      }, function () {
        ok();
      });
    } catch (e) {
      ok();
    }
  });
  const zeitlimit = new Promise(function (ok) {
    setTimeout(ok, 2500);
  });
  return Promise.race([fertig, zeitlimit]);
}

function szeneAusAdresse() {
  try {
    const h = (window.location.hash || '').replace('#', '');
    return SZENEN[h] ? h : null;
  } catch (e) {
    return null;
  }
}

function starte() {
  canvas = document.getElementById('spiel');
  ctx = canvas.getContext('2d', { alpha: false });
  probe = document.getElementById('rand-probe');
  Knopf.touch = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);
  Global.laden();
  Stil.sparmodus = Global.sparmodus;
  klang.an = Global.ton;
  klang.setzeLautstaerke(Global.lautstaerke);
  const turmDaten = Speicher.lesen();
  if (!Konto.laden()) {
    Konto.kredit = turmDaten && typeof turmDaten.kredit === 'number' && isFinite(turmDaten.kredit)
      ? Math.max(0, Math.round(turmDaten.kredit)) : START_KREDIT;
    Konto.speichern();
  }
  SzeneTurm.init(turmDaten);
  SZENEN.lobby = SzeneLobby;
  SZENEN.turmspitze = SzeneTurm;
  SZENEN.roulette = SzeneRoulette;
  SZENEN.blackjack = SzeneBlackjack;
  SZENEN.sonnenbuch = SzeneBuch;
  wechsleSzene(szeneAusAdresse() || 'lobby');
  uebergang = 0;

  window.addEventListener('resize', function () {
    groesseAnpassen(false);
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () {
      groesseAnpassen(false);
    }, 120);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () {
      groesseAnpassen(false);
    });
  }
  canvas.addEventListener('pointerdown', zeigerRunter);
  canvas.addEventListener('pointermove', zeigerBewegt);
  canvas.addEventListener('pointerup', zeigerHoch);
  canvas.addEventListener('pointercancel', zeigerAbbruch);
  canvas.addEventListener('pointerleave', function (e) {
    if (e.pointerType === 'mouse' && szene.maus_weg) {
      szene.maus_weg();
    }
  });
  canvas.addEventListener('contextmenu', function (e) {
    e.preventDefault();
  });
  window.addEventListener('keydown', tasteGedrueckt);
  document.addEventListener('gesturestart', function (e) {
    e.preventDefault();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      alleSpeichern();
      Stimme.still();
    } else {
      letzte = 0;
      if (szene === SzeneTurm && G.auto) {
        wachHalten(true);
      }
    }
  });
  window.addEventListener('pagehide', alleSpeichern);
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) {
    try {
      hot.snapshot(function () {
        alleSpeichern();
        return { gespeichert: true };
      });
    } catch (e) {
      // nur im Claude-Viewer vorhanden
    }
  }
  const lade = document.getElementById('laden');
  if (lade) {
    lade.hidden = true;
  }
  window.requestAnimationFrame(schleife);
  // Testzugang fuer automatisierte Pruefungen
  window.__spielhalle = {
    wechsle: wechsleSzene, szene: function () {
      return szene;
    }, Konto: Konto, zeichne: zeichneBild, bildschirm: function (bx, by) {
      const r = canvas.getBoundingClientRect();
      const d = canvas.width / Math.max(1, r.width);
      return [r.left + (bx * skala + ox) / d, r.top + (by * skala + oy) / d];
    }
  };
  window.__turmspitze = {
    G: G, L: function () {
      return L;
    }, aktualisiere: aktualisiere, mathe: mathe, startDruck: startDruck, annahme: annahme, leiterRisiko: leiterRisiko,
    leiterStoppen: leiterStoppen, karte: karte, teilen: teilen, gewinnNehmen: gewinnNehmen, oeffne: oeffne,
    oeffneEinstellungen: oeffneEinstellungen, zustandDaten: zustandDaten, offenerBetrag: offenerBetrag, zeichne: zeichneBild,
    RisikoLeiter: RisikoLeiter, Mathematik: Mathematik, Konfiguration: Konfiguration, M: M,
    knopf: function (name) {
      return { start: btnStart, annahme: btnAnnahme, risiko: btnRisiko, rot: btnRot, nehmen: btnNehmen, einst: btnEinst,
        plus: btnPlus, auto: btnAuto, lobby: btnLobby }[name];
    },
    bildschirm: function (bx, by) {
      return window.__spielhalle.bildschirm(bx, by);
    }
  };
}

Pwa.registrieren();
schriftenLaden().then(function () {
  spritesLeeren();
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) {
    hot.ready(function () {
      starte();
    });
  } else {
    starte();
  }
});

})();
