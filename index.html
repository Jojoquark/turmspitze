// ------------------------------------------------------------------ Installation als App
const Pwa = {
  aktiv: PWA_BUILD,
  deferred: null,
  standalone: function () {
    try {
      return window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches
        || navigator.standalone === true;
    } catch (e) {
      return false;
    }
  },
  ios: function () {
    const ua = navigator.userAgent || '';
    return /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  },
  android: function () {
    return /android/i.test(navigator.userAgent || '');
  },
  installSichtbar: function () {
    return this.aktiv && !this.standalone();
  },
  promptVerfuegbar: function () {
    return !!this.deferred;
  },
  installieren: function () {
    const d = this.deferred;
    if (!d) {
      return;
    }
    const self = this;
    try {
      d.prompt();
      d.userChoice.then(function () {
        self.deferred = null;
      }, function () {
        self.deferred = null;
      });
    } catch (e) {
      this.deferred = null;
    }
  },
  anleitung: function () {
    if (this.ios()) {
      return [
        { text: 'In Safari auf „Teilen“ tippen (iPhone: unten, iPad: oben rechts).', icon: 'TEILEN' },
        { text: '„Zum Home-Bildschirm“ wählen – eventuell etwas nach unten scrollen.', icon: 'HOME' },
        { text: 'Oben rechts auf „Hinzufügen“ tippen. Fertig!' }
      ];
    }
    if (this.deferred) {
      return [
        { text: 'Unten auf „JETZT INSTALLIEREN“ tippen.' },
        { text: 'Im Fenster des Browsers mit „Installieren“ bestätigen.' },
        { text: 'Turmspitze liegt danach als App auf dem Startbildschirm.' }
      ];
    }
    if (this.android()) {
      return [
        { text: 'In Chrome oben rechts das Menü ⋮ öffnen.' },
        { text: '„App installieren“ oder „Zum Startbildschirm hinzufügen“ wählen.' },
        { text: 'Mit „Installieren“ bestätigen. Fertig!' }
      ];
    }
    return [
      { text: 'In Chrome oder Edge rechts in der Adressleiste auf das Installieren-Symbol klicken.' },
      { text: 'Oder im Browsermenü „App installieren“ bzw. „Turmspitze installieren“ wählen.' },
      { text: 'Die App startet danach in einem eigenen Fenster.' }
    ];
  },
  hinweis: function () {
    let h = 'Danach startet Turmspitze im Vollbild wie eine richtige App und läuft auch ohne Internet. Dein Spielgeld bleibt auf dem Gerät gespeichert.';
    if (this.ios()) {
      h += ' Kein Ton? Den Lautlos-Schalter am iPhone prüfen.';
    }
    return h;
  },
  registrieren: function () {
    if (!this.aktiv) {
      return;
    }
    const self = this;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      self.deferred = e;
    });
    window.addEventListener('appinstalled', function () {
      self.deferred = null;
      melde('INSTALLIERT', 'Turmspitze ist jetzt eine App', GRUEN, 2.2);
    });
    try {
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'
        || location.hostname === '127.0.0.1')) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {
            // offline-Funktion optional
          });
        });
      }
    } catch (e) {
      // ohne Service Worker weiterspielen
    }
  }
};

// ------------------------------------------------------------------ Bildschirm
let canvas = null, ctx = null;
let probe = null;

function sichereRaender() {
  if (!probe) {
    return { t: 0, r: 0, b: 0, l: 0 };
  }
  const s = window.getComputedStyle(probe);
  return {
    t: parseFloat(s.paddingTop) || 0, r: parseFloat(s.paddingRight) || 0,
    b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0
  };
}

function groesseAnpassen(erzwingen) {
  if (!canvas || !G.konf) {
    return;
  }
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
  const ins = sichereRaender();
  const dMax = G.konf.sparmodus ? 1.5 : 2;
  const d = Math.min(window.devicePixelRatio || 1, dMax);
  const gw = Math.max(1, w - ins.l - ins.r), gh = Math.max(1, h - ins.t - ins.b);
  const hoch = gh > gw * 1.1;
  const zielH = hoch ? clampI(Math.round(720 * gh / gw), 1310, 1600) : 800;
  const bw = Math.round(w * d), bh = Math.round(h * d);
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw;
    canvas.height = bh;
  }
  if (erzwingen || !L || L.hoch !== hoch || (hoch && L.H !== zielH)) {
    setzeLayout(hoch ? layoutHoch(zielH) : layoutQuer());
  }
  const s = Math.min(gw / L.W, gh / L.H);
  skala = s * d;
  ox = (ins.l + (gw - L.W * s) / 2) * d;
  oy = (ins.t + (gh - L.H * s) / 2) * d;
  aufloesung = Math.max(0.5, Math.round(skala * 4) / 4);
}

// ------------------------------------------------------------------ Spielschleife
let letzte = 0, ruheZeit = 0, letztesSpeichern = 0;

function schleife(jetzt) {
  window.requestAnimationFrame(schleife);
  if (!letzte) {
    letzte = jetzt;
  }
  let dt = (jetzt - letzte) / 1000;
  if (G.konf.sparmodus && dt < 1 / 30 - 0.004) {
    return; // Sparmodus: 30 Bilder pro Sekunde
  }
  letzte = jetzt;
  dt = Math.min(0.05, Math.max(0, dt));
  G.zeit += dt;
  aktualisiere(dt);
  if (G.dirty && G.zeit - letztesSpeichern > 1.0) {
    letztesSpeichern = G.zeit;
    speichern();
  }
  if (G.konf.sparmodus && ruhig() && G.zeit > G.aktivBis) {
    // im Ruhezustand nur ca. 5 Bilder pro Sekunde zeichnen
    ruheZeit += dt;
    if (ruheZeit < 0.2) {
      return;
    }
  }
  ruheZeit = 0;
  zeichneAlles(ctx, canvas.width, canvas.height);
}

// ------------------------------------------------------------------ Eingabe
function basisKoord(e) {
  const r = canvas.getBoundingClientRect();
  const d = canvas.width / Math.max(1, r.width);
  return [((e.clientX - r.left) * d - ox) / skala, ((e.clientY - r.top) * d - oy) / skala];
}

function overlayRahmen() {
  if (G.ov === 'STATISTIK') {
    return { x: (L.W - 520) / 2, y: L.hoch ? Math.max(90, (L.H - 530) / 2) : 140, w: 520, h: 530 };
  }
  if (G.ov === 'HILFE') {
    return hilfePanel();
  }
  if (G.ov === 'INSTALL') {
    return installPanel();
  }
  return null;
}

function aufWalze(x, y) {
  const lx = x - M.x, ly = y - M.y;
  return lx >= FX - 10 && lx <= FX + FW + 10 && ly >= FY - 10 && ly <= FY + FH + 10;
}

function aufLeiter(x, y) {
  const R = risikoGeometrie();
  return x >= R.lx - 16 && x <= R.lx + R.lw + 8 && y >= R.top - 8 && y <= R.unten + 8;
}

let aktiverZeiger = null;

function zeigerRunter(e) {
  if (aktiverZeiger !== null && aktiverZeiger !== e.pointerId) {
    return;
  }
  aktiverZeiger = e.pointerId;
  e.preventDefault();
  G.klang.entsperren();
  const touch = e.pointerType === 'touch' || e.pointerType === 'pen';
  if (touch !== Knopf.touch) {
    Knopf.touch = touch;
    platziereKnoepfe();
    kachelnLeeren();
  }
  try {
    canvas.setPointerCapture(e.pointerId);
  } catch (err) {
    // egal
  }
  G.aktivBis = G.zeit + 0.6;
  const p = basisKoord(e);
  G.mx = p[0];
  G.my = p[1];
  if (G.ov === 'EINSTELLUNGEN' && G.menue) {
    if (!G.menue.druecken(p[0], p[1]) && !G.menue.innerhalb(p[0], p[1])) {
      G.menue.abbrechen();
    }
    return;
  }
  const liste = G.ov === 'KEINS' ? knoepfe : overlayKnoepfe;
  for (let i = 0; i < liste.length; i++) {
    const b = liste[i];
    if (b.aktiv && b.sichtbar && b.trifft(p[0], p[1])) {
      b.gedrueckt = true;
      G.gedrueckt = b;
      return;
    }
  }
  if (G.ov !== 'KEINS') {
    const r = overlayRahmen();
    if (r && (p[0] < r.x || p[0] > r.x + r.w || p[1] < r.y || p[1] > r.y + r.h)) {
      schliesseOverlay();
    }
    return;
  }
  if (aufWalze(p[0], p[1])) {
    startDruck();
  } else if ((G.z === 'LEITER' || G.z === 'AUSSPIELUNG') && aufLeiter(p[0], p[1])) {
    leiterStoppen();
  }
}

function zeigerBewegt(e) {
  if (aktiverZeiger !== null && aktiverZeiger !== e.pointerId) {
    return;
  }
  G.aktivBis = G.zeit + 0.6;
  const p = basisKoord(e);
  if (e.pointerType === 'mouse' || aktiverZeiger !== null) {
    G.mx = p[0];
    G.my = p[1];
  }
  if (G.ov === 'EINSTELLUNGEN' && G.menue) {
    G.menue.maus(p[0], p[1]);
  }
}

function zeigerHoch(e) {
  if (aktiverZeiger !== null && aktiverZeiger !== e.pointerId) {
    return;
  }
  aktiverZeiger = null;
  G.klang.entsperren(); // iOS gibt Audio teils erst beim Loslassen frei
  const p = basisKoord(e);
  if (G.ov === 'EINSTELLUNGEN' && G.menue) {
    if (G.menue.loslassen(p[0], p[1])) {
      spiele('KNOPF');
    }
  } else if (G.gedrueckt) {
    const b = G.gedrueckt;
    b.gedrueckt = false;
    G.gedrueckt = null;
    if (b.trifft(p[0], p[1])) {
      if (b !== btnStart && b !== btnAnnahme) {
        spiele('KNOPF');
      }
      b.ausloesen();
    }
  }
  if (e.pointerType !== 'mouse') {
    G.mx = -1;
    G.my = -1;
    if (G.menue) {
      G.menue.mx = G.menue.my = -1;
    }
  }
}

function zeigerAbbruch(e) {
  aktiverZeiger = null;
  if (G.gedrueckt) {
    G.gedrueckt.gedrueckt = false;
    G.gedrueckt = null;
  }
  if (G.menue) {
    G.menue.loslassen(-9999, -9999);
  }
  G.mx = -1;
  G.my = -1;
}

function tasteGedrueckt(e) {
  const code = e.code, key = e.key;
  G.aktivBis = G.zeit + 0.6;
  G.klang.entsperren();
  if (Knopf.touch && e.isTrusted) {
    Knopf.touch = false;
    platziereKnoepfe();
    kachelnLeeren();
  }
  if (code === 'Space' || code.indexOf('Arrow') === 0 || code === 'F11') {
    e.preventDefault();
  }
  if (code === 'F11') {
    vollbild();
    return;
  }
  if (e.repeat && code !== 'Space') {
    return;
  }
  if (G.ov === 'EINSTELLUNGEN' && G.menue) {
    G.menue.taste(code);
    return;
  }
  if (G.ov !== 'KEINS') {
    if (code === 'Escape' || code === 'Space' || code === 'Enter' || code === 'KeyI' || code === 'KeyS') {
      schliesseOverlay();
    }
    return;
  }
  const wahl = G.z === 'WAHL';
  switch (code) {
    case 'Space':
    case 'Enter':
    case 'NumpadEnter':
      if (!e.repeat) {
        startDruck();
      }
      return;
    case 'ArrowDown':
    case 'KeyA':
      if (wahl) {
        gewinnNehmen(false);
      } else {
        annahme();
      }
      return;
    case 'KeyN':
      gewinnNehmen(false);
      return;
    case 'ArrowUp':
    case 'KeyR':
      if (G.z === 'LEITER' || G.z === 'AUSSPIELUNG') {
        leiterStoppen();
      } else {
        leiterRisiko();
      }
      return;
    case 'ArrowLeft':
      if (wahl) {
        karte(true);
      }
      return;
    case 'ArrowRight':
      if (wahl) {
        karte(false);
      }
      return;
    case 'KeyH':
      teilen();
      return;
    case 'KeyU':
      G.auto = !G.auto;
      spiele('KNOPF');
      wachHalten(G.auto);
      return;
    case 'KeyT':
      G.turbo = !G.turbo;
      spiele('KNOPF');
      G.dirty = true;
      return;
    case 'KeyK':
      G.tipps = !G.tipps;
      G.dirty = true;
      return;
    case 'KeyE':
      oeffneEinstellungen(false);
      return;
    case 'KeyI':
      oeffne('HILFE');
      return;
    case 'KeyS':
      oeffne('STATISTIK');
      return;
    case 'KeyM':
      G.klang.an = !G.klang.an;
      G.dirty = true;
      return;
    case 'KeyP':
      sparmodusUmschalten();
      return;
    default:
      break;
  }
  if (key === '-' || code === 'NumpadSubtract' || code === 'Minus') {
    einsatzAendern(-1);
  } else if (key === '+' || code === 'NumpadAdd' || code === 'BracketRight' || code === 'Equal') {
    einsatzAendern(1);
  }
}

function vollbild() {
  try {
    const d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) {
      (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    } else {
      const el = d.documentElement;
      const f = el.requestFullscreen || el.webkitRequestFullscreen;
      if (f) {
        const r = f.call(el);
        if (r && r.catch) {
          r.catch(function () {
            // nicht erlaubt
          });
        }
      }
    }
  } catch (e) {
    // Vollbild ist optional
  }
}

function schriftenLaden() {
  const fertig = new Promise(function (ok) {
    try {
      if (!document.fonts || !document.fonts.load) {

      Promise.all([
        document.fonts.load('20px "Lilita One"'),
        document.fonts.load('800 20px Nunito'),
        document.fonts.load('900 20px Nunito')
      ]).then(function () {
        ok();
      }, function () {
        ok();
      });
    } catch (e) {
      ok();
    }
  });
  const zeitlimit = new Promise(function (ok) {
    setTimeout(ok, 2500);
  });
  return Promise.race([fertig, zeitlimit]);
}

function starte(daten) {
  canvas = document.getElementById('spiel');

  Knopf.touch = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);

  laden(d);
  Stil.sparmodus = G.konf.sparmodus;
  G.kreditAnzeige = G.kredit;
  G.jackpotAnzeige = 0;
  G.walze = new Walze(G.konf);
  G.walze.zeige(SONNE);
  baueKnoepfe();
  groesseAnpassen(true);
  G.jackpotAnzeige = summe();
  melde('TURMSPITZE', 'Viel Glück!', GELB, 2.4);

  window.addEventListener('resize', function () {
    groesseAnpassen(false);
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () {
      groesseAnpassen(false);
    }, 120);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () {
      groesseAnpassen(false);

  }
  canvas.addEventListener('pointerdown', zeigerRunter);
  canvas.addEventListener('pointermove', zeigerBewegt);
  canvas.addEventListener('pointerup', zeigerHoch);
  canvas.addEventListener('pointercancel', zeigerAbbruch);
