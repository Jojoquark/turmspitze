/* Turmspitze – eine feste Spielhallen-Optik (bewusst nur ein dunkles Farbschema) */
[hidden] {
  display: none !important;
}
:root {
  --grund: #140300;
  --glut: #ff9200;
  --gold: #ffd21f;
  --creme: #fff8e1;
  color-scheme: dark;
}
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--grund);
  color: var(--creme);
  overflow: hidden;
  overscroll-behavior: none;
}
body {
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  font-family: Nunito, "Segoe UI", Roboto, Arial, sans-serif;
}
#spiel {
  position: fixed;
  left: 0;
  top: 0;
  width: 100vw;
  height: 100vh;
  width: 100dvw;
  height: 100dvh;
  display: block;
  touch-action: none;
  outline: none;
  background: var(--grund);
}
#rand-probe {
  position: fixed;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  visibility: hidden;
  pointer-events: none;
}
#laden {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: radial-gradient(circle at 50% 65%, #781400 0%, #3c0800 45%, #0e0200 100%);
  color: var(--gold);
  font-family: "Lilita One", "Arial Black", sans-serif;
  font-size: 40px;
  letter-spacing: 0.04em;
  text-shadow: 0 3px 0 #2b1606;
}
#laden small {
  font-family: Nunito, Arial, sans-serif;
  font-weight: 800;
  font-size: 14px;
  letter-spacing: 0.06em;
  color: #ffdca0;
  text-shadow: none;
}
@media (prefers-reduced-motion: no-preference) {
  #laden small {
    animation: puls 1.2s ease-in-out infinite;
  }
}
@keyframes puls {
  50% { opacity: 0.45; }
}

<script>
(function () {
'use strict';
const PWA_BUILD = true;

// ---- basis.js
// ====================================================================================
// basis.js – Farben, Schriften, Formatierung und Zeichen-Effekte (Comic-Kontur, Glanz,
// Leuchten, Strahlen). Alles in Basis-Koordinaten; skaliert wird ueber die Canvas-Matrix.
// ====================================================================================

// ------------------------------------------------------------------ Farben
function C(r, g, b, a) {
  return { r: r, g: g, b: b, a: a === undefined ? 255 : a, s: null };
}
function css(c) {
  if (typeof c === 'string') {
    return c;
  }
  if (c.s === null) {
    c.s = 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + (c.a / 255).toFixed(4) + ')';
  }
  return c.s;
}
function clamp01(t) {
  return t < 0 ? 0 : (t > 1 ? 1 : t);
}
function clampI(v, lo, hi) {
  return v < lo ? lo : (v > hi ? hi : v);
}
function alpha(c, a) {
  return C(c.r, c.g, c.b, clampI(Math.round(a), 0, 255));
}
function alphaF(c, f) {
  return alpha(c, c.a * clamp01(f));
}
function mix(a, b, t) {
  t = clamp01(t);
  return C(Math.round(a.r + (b.r - a.r) * t), Math.round(a.g + (b.g - a.g) * t),
    Math.round(a.b + (b.b - a.b) * t), Math.round(a.a + (b.a - a.a) * t));
}
function heller(c, t) {
  return mix(c, C(255, 255, 255, c.a), t);
}
function dunkler(c, t) {
  return mix(c, C(0, 0, 0, c.a), t);
}

// Spielhallen-Palette (wie in der BlueJ-Version)
const WEISS = C(255, 255, 255);
const SCHWARZ = C(0, 0, 0);
const GELB = C(255, 210, 31);
const GELB_HELL = C(255, 242, 168);
const ORANGE = C(255, 146, 0);
const ROT = C(227, 38, 43);
const ROT_DUNKEL = C(142, 15, 20);
const GRUEN = C(45, 184, 75);
const GRUEN_HELL = C(120, 235, 120);
const GOLD = C(255, 194, 30);
const CREME = C(255, 248, 225);
const KONTUR = C(43, 22, 6);
const VIOLETT = C(150, 80, 255);
const SONNENGOLD = C(255, 176, 20);
const LED = C(255, 214, 40);
const TURM_F = [C(232, 40, 40), C(255, 190, 20), C(46, 190, 76)];
const TURM_DUNKEL = [C(140, 12, 16), C(190, 120, 0), C(18, 110, 40)];
const TURM_HELL = [C(255, 170, 160), C(255, 240, 150), C(170, 255, 160)];
const KONTUR_200 = alpha(KONTUR, 200);
const KONTUR_220 = alpha(KONTUR, 220);

const Stil = { sparmodus: false };

// ------------------------------------------------------------------ Easing
function easeOutCubic(t) {
  t = clamp01(t);
  const u = 1 - t;
  return 1 - u * u * u;
}
function easeOutBack(t) {
  t = clamp01(t);
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function easeOutElastic(t) {
  t = clamp01(t);
  if (t === 0 || t === 1) {
    return t;
  }
  return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1;
}

// ------------------------------------------------------------------ Formatierung
function tausender(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function euro(cent) {
  cent = Math.round(cent);
  const neg = cent < 0;
  const c = Math.abs(cent);
  const e = Math.floor(c / 100), ct = c % 100;
  return (neg ? '-' : '') + tausender(e) + ',' + (ct < 10 ? '0' : '') + ct + ' €';
}
function euroOhne(cent) {
  return euro(cent).replace(' €', '');
}
function zahl(v, stellen) {
  return v.toFixed(stellen).replace('.', ',');
}
function prozent(v, stellen) {
  return zahl(v * 100, stellen) + ' %';

function quote(p) {
  if (!(p > 0)) {
    return '–';
  }
  const x = 1 / p;
  if (x < 10) {
    return '1 : ' + zahl(x, 1);

  return '1 : ' + tausender(Math.round(x));

const FAM_TITEL = '"Lilita One", "Arial Black", "Segoe UI Black", Impact, sans-serif';

  const k = 'T' + px;
  let f = fonts.get(k);

  }
  return f;
}
/** Runde, fette Textschrift. */
function sans(px, w) {
  w = w || 800;

}
function ausrichtung(a) {
  return a === 0 ? 'center' : (a > 0 ? 'right' : 'left');
}

const breitenCache = new Map();
function breite(g, t, f) {
  const k = f.key + '|' + t;
  let w = breitenCache.get(k);
  if (w === undefined) {
    g.save();
    g.font = f.f;
    w = g.measureText(t).width;
    g.restore();
    if (breitenCache.size > 5000) {
      breitenCache.clear();
    }
    breitenCache.set(k, w);
  }
  return w;
}

function text(g, t, f, c, x, y, ausr) {
  g.font = f.f;
  g.fillStyle = css(c);
  g.textAlign = ausrichtung(ausr);
  g.textBaseline = 'alphabetic';
  g.fillText(t, x, y);
}

// ------------------------------------------------------------------ Pfade
function rrP(x, y, w, h, r) {
  // r wie in Java (Bogen-Durchmesser) -> Eckradius r/2
  const p = new Path2D();
  let q = Math.min(r / 2, w / 2, h / 2);
  if (!(q > 0)) {
    p.rect(x, y, w, h);
    return p;
  }
  p.moveTo(x + q, y);
  p.lineTo(x + w - q, y);
  p.arcTo(x + w, y, x + w, y + q, q);
  p.lineTo(x + w, y + h - q);
  p.arcTo(x + w, y + h, x + w - q, y + h, q);
  p.lineTo(x + q, y + h);
  p.arcTo(x, y + h, x, y + h - q, q);
  p.lineTo(x, y + q);
  p.arcTo(x, y, x + q, y, q);
  p.closePath();
  return p;
}
function ellP(x, y, w, h) {
  const p = new Path2D();
  p.ellipse(x + w / 2, y + h / 2, Math.max(0.0001, w / 2), Math.max(0.0001, h / 2), 0, 0, Math.PI * 2);
  return p;
}
function kreisP(cx, cy, r) {
  const p = new Path2D();
  p.arc(cx, cy, Math.max(0.0001, r), 0, Math.PI * 2);
  return p;
}
function rectP(x, y, w, h) {
  const p = new Path2D();
  p.rect(x, y, w, h);
  return p;
}
function linieP(x1, y1, x2, y2) {
  const p = new Path2D();
  p.moveTo(x1, y1);
  p.lineTo(x2, y2);
  return p;
}
/** Vierzackiger Funkelstern. */
function sternP(cx, cy, r, innen) {
  const p = new Path2D();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 - Math.PI / 2;
    const rr = (i % 2 === 0) ? r : innen;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    if (i === 0) {
      p.moveTo(x, y);
    } else {
      p.lineTo(x, y);
    }
  }
  p.closePath();
  return p;
}
/** Fuenfzackiger Stern. */
function stern5P(cx, cy, r, innen) {
  const p = new Path2D();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 - Math.PI / 2;
    const rr = (i % 2 === 0) ? r : innen;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    if (i === 0) {
      p.moveTo(x, y);
    } else {
      p.lineTo(x, y);
    }
  }
  p.closePath();
  return p;
}
/** Transformierte Kopie eines Pfads (Verschiebung + Drehung in Grad). */
function pfadTransformiert(p, tx, ty, grad) {
  const q = new Path2D();
  const m = new DOMMatrix();
  m.translateSelf(tx, ty);
  if (grad) {
    m.rotateSelf(grad);
  }
  q.addPath(p, m);
  return q;
}

// ------------------------------------------------------------------ Farbverlaeufe
function lin(g, x1, y1, x2, y2, stops) {
  if (x1 === x2 && y1 === y2) {
    y2 += 0.001;
  }
  const gr = g.createLinearGradient(x1, y1, x2, y2);
  for (let i = 0; i < stops.length; i++) {
    gr.addColorStop(stops[i][0], css(stops[i][1]));
  }
  return gr;
}
function gp(g, x1, y1, c1, x2, y2, c2) {
  return lin(g, x1, y1, x2, y2, [[0, c1], [1, c2]]);
}
function radial(g, cx, cy, r, stops) {
  const gr = g.createRadialGradient(cx, cy, 0, cx, cy, Math.max(0.0001, r));
  for (let i = 0; i < stops.length; i++) {
    gr.addColorStop(stops[i][0], css(stops[i][1]));
  }
  return gr;
}
function strich(g, w, eckig) {
  g.lineWidth = w;
  g.lineCap = eckig ? 'butt' : 'round';
  g.lineJoin = eckig ? 'miter' : 'round';
}
function fuell(g, p, c) {
  g.fillStyle = css(c);
  g.fill(p);
}
function rand(g, p, c, w) {
  strich(g, w);
  g.strokeStyle = css(c);
  g.stroke(p);
}

// ------------------------------------------------------------------ Zwischenspeicher fuer Text-Effekte
function neuesCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w);
  c.height = Math.max(1, h);
  return c;
}
const SPRITE_MAX = 700;
const sprites = new Map();
function spritesLeeren() {
  sprites.clear();
  breitenCache.clear();
}
function matrix(g) {
  return g.getTransform ? g.getTransform() : null;
}
/**
 * Aufwendige Texteffekte (dicke Konturen, Leuchten) werden einmal pro Groesse als Bild
 * gerendert und danach nur noch kopiert. false = nicht cachebar (z. B. gedreht).
 */
function ausCache(g, schluessel, x, y, t, f, ausr, randPx, zeichner) {
  const m = matrix(g);
  if (!m || Math.abs(m.b) > 1e-9 || Math.abs(m.c) > 1e-9 || m.a <= 0 || Math.abs(m.a - m.d) > 1e-6) {
    return false;
  }
  const sk = Math.round(m.a * 100) / 100;
  if (sk <= 0) {
    return false;
  }
  const k = schluessel + '|' + sk;
  let sp = sprites.get(k);
  if (sp) {
    sprites.delete(k);
    sprites.set(k, sp);
  } else {
    const w = breite(g, t, f);
    const asc = f.px * 1.08, desc = f.px * 0.34;
    const bx = (ausr === 0 ? -w / 2 : (ausr > 0 ? -w : 0)) - randPx - f.px * 0.08;
    const by = -asc - randPx;
    const bw = w + 2 * randPx + f.px * 0.16, bh = asc + desc + 2 * randPx;
    const pw = Math.ceil(bw * sk), ph = Math.ceil(bh * sk);
    const cv = neuesCanvas(pw, ph);
    const ig = cv.getContext('2d');
    ig.setTransform(sk, 0, 0, sk, -bx * sk, -by * sk);
    zeichner(ig);
    sp = { cv: cv, bx: bx, by: by, w: pw / sk, h: ph / sk };
    sprites.set(k, sp);
    if (sprites.size > SPRITE_MAX) {
      sprites.delete(sprites.keys().next().value);
    }
  }
  g.drawImage(sp.cv, x + sp.bx, y + sp.by, sp.w, sp.h);
  return true;
}

/** Comic-Text: dicke dunkle Kontur, harter Schatten, Fuellung. */
function comicText(g, t, f, fuellung, x, y, ausr, kontur) {
  if (!t) {
    return;
  }
  const k = 'c|' + t + '|' + f.key + '|' + css(fuellung) + '|' + ausr + '|' + kontur;
  if (!ausCache(g, k, x, y, t, f, ausr, kontur * 2.5 + 2, function (ig) {
    comicTextDirekt(ig, t, f, fuellung, 0, 0, ausr, kontur);
  })) {
    comicTextDirekt(g, t, f, fuellung, x, y, ausr, kontur);
  }
}
function comicTextDirekt(g, t, f, fuellung, x, y, ausr, kontur) {
  g.save();
  g.font = f.f;
  g.textAlign = ausrichtung(ausr);
  g.textBaseline = 'alphabetic';
  strich(g, kontur * 2);
  g.strokeStyle = g.fillStyle = css(KONTUR_200);
  g.strokeText(t, x + kontur * 0.5, y + kontur * 0.9);
  g.fillText(t, x + kontur * 0.5, y + kontur * 0.9);
  g.strokeStyle = css(KONTUR);
  g.strokeText(t, x, y);
  g.fillStyle = css(fuellung);
  g.fillText(t, x, y);
  g.restore();
}

function leuchtText(g, t, f, kern, glow, x, y, ausr, radius) {
  if (!t) {
    return;
  }
  const k = 'l|' + t + '|' + f.key + '|' + css(kern) + '|' + css(glow) + '|' + ausr + '|' + radius + '|' + Stil.sparmodus;
  if (!ausCache(g, k, x, y, t, f, ausr, radius + 2, function (ig) {
    leuchtTextDirekt(ig, t, f, kern, glow, 0, 0, ausr, radius);
  })) {
    leuchtTextDirekt(g, t, f, kern, glow, x, y, ausr, radius);
  }
}
function leuchtTextDirekt(g, t, f, kern, glow, x, y, ausr, radius) {
  g.save();
  g.font = f.f;
  g.textAlign = ausrichtung(ausr);
  g.textBaseline = 'alphabetic';
  const schritte = Stil.sparmodus ? 1 : 4;
  g.strokeStyle = css(alpha(glow, glow.a * 0.2));
  for (let i = schritte; i >= 1; i--) {
    strich(g, radius * 2 * i / schritte);
    g.strokeText(t, x, y);
  }
  g.fillStyle = css(kern);
  g.fillText(t, x, y);
  g.restore();
}

/** Glanzstreifen, der nur innerhalb der Buchstaben sichtbar ist. */
function textGlanz(g, t, f, x, y, ausr, glanz, staerke) {
  const m = matrix(g);
  const sk = m ? Math.max(0.2, Math.hypot(m.a, m.b)) : 1;
  const w = breite(g, t, f);
  const x0 = x + (ausr === 0 ? -w / 2 : (ausr > 0 ? -w : 0));
  const top = y - f.px * 0.8, bot = y + f.px * 0.1;
  const hh = bot - top;
  const pw = Math.ceil((w + 4) * sk), ph = Math.ceil(hh * sk);
  if (pw < 2 || ph < 2) {
    return;
  }
  const cv = glanzPuffer(pw, ph);
  const ig = cv.getContext('2d');
  ig.setTransform(1, 0, 0, 1, 0, 0);
  ig.globalCompositeOperation = 'source-over';
  ig.clearRect(0, 0, cv.width, cv.height);
  ig.setTransform(sk, 0, 0, sk, -(x0 - 2) * sk, -top * sk);
  ig.font = f.f;
  ig.textAlign = ausrichtung(ausr);
  ig.textBaseline = 'alphabetic';
  ig.fillStyle = '#fff';
  ig.fillText(t, x, y);
  ig.globalCompositeOperation = 'source-in';
  const px = x0 - 80 + (w + 160) * glanz;
  ig.fillStyle = lin(ig, px - 40, bot, px + 40, top, [[0, C(255, 255, 255, 0)], [0.5, C(255, 255, 255, staerke || 210)],
    [1, C(255, 255, 255, 0)]]);
  ig.fillRect(x0 - 2, top, w + 4, hh);
  g.drawImage(cv, 0, 0, pw, ph, x0 - 2, top, pw / sk, ph / sk);
}
let glanzCv = null;
function glanzPuffer(w, h) {
  if (!glanzCv || glanzCv.width < w || glanzCv.height < h) {
    glanzCv = neuesCanvas(Math.max(w, glanzCv ? glanzCv.width : 0), Math.max(h, glanzCv ? glanzCv.height : 0));
  }
  return glanzCv;
}

/** Gold-/Farbverlaufs-Text mit Kontur und wanderndem Glanzstreifen (glanz 0..1, <0 = aus). */
function glanzText(g, t, f, x, y, ausr, oben, mitte, unten, kontur, glanz) {
  g.save();
  g.font = f.f;
  g.textAlign = ausrichtung(ausr);
  g.textBaseline = 'alphabetic';
  strich(g, kontur * 2);
  g.strokeStyle = g.fillStyle = css(KONTUR_220);
  g.strokeText(t, x + kontur * 0.4, y + kontur * 1.1);
  g.fillText(t, x + kontur * 0.4, y + kontur * 1.1);
  g.strokeStyle = css(KONTUR);
  g.strokeText(t, x, y);
  const top = y - f.px * 0.72, bot = y + f.px * 0.02;
  g.fillStyle = lin(g, 0, top, 0, bot, [[0, oben], [0.5, mitte], [0.52, dunkler(mitte, 0.08)], [1, unten]]);
  g.fillText(t, x, y);
  g.restore();
  if (glanz >= 0 && glanz <= 1) {
    textGlanz(g, t, f, x, y, ausr, glanz, 210);
  }
}

// ------------------------------------------------------------------ Flaechen
/** Comic-Panel: harter Versatzschatten, dicke Kontur, Verlauf, Glanzkante. */
function comicPanel(g, x, y, w, h, r, oben, unten, kontur, schatten) {
  const s = rrP(x, y, w, h, r);
  if (schatten > 0) {
    fuell(g, rrP(x + schatten, y + schatten, w, h, r), C(60, 20, 0, 90));
  }
  g.fillStyle = gp(g, x, y, oben, x, y + h, unten);
  g.fill(s);
  g.save();
  g.clip(s);
  const gh = Math.min(h, 60) * 0.6;
  g.fillStyle = gp(g, x, y, C(255, 255, 255, 90), x, y + gh, C(255, 255, 255, 0));
  g.fillRect(x, y, w, gh);
  g.restore();
  rand(g, s, KONTUR, kontur);
}

/** Dunkles LED-Anzeigefeld. */
function anzeigeFeld(g, x, y, w, h) {
  const s = rrP(x, y, w, h, 16);
  g.fillStyle = gp(g, x, y, C(18, 8, 2), x, y + h, C(46, 24, 8));
  g.fill(s);
  g.save();
  g.clip(s);
  strich(g, 6, true);
  g.strokeStyle = 'rgba(0,0,0,0.47)';
  g.stroke(rrP(x - 1, y - 1, w + 2, h + 2, 16));
  g.restore();
  rand(g, s, KONTUR, 3);
  strich(g, 1.2);
  g.strokeStyle = css(C(255, 220, 120, 60));
  g.stroke(rrP(x + 3, y + 3, w - 6, h - 6, 12));
}

function glow(g, cx, cy, r, c) {
  if (r <= 0) {
    return;
  }
  g.fillStyle = radial(g, cx, cy, r, [[0, c], [1, alpha(c, 0)]]);
  g.beginPath();
  g.arc(cx, cy, r, 0, Math.PI * 2);
  g.fill();
}

function glowRand(g, s, c, staerke, breiteRand) {
  if (!(staerke > 0)) {
    return;
  }
  const n = Stil.sparmodus ? 1 : 5;
  g.strokeStyle = css(alpha(c, c.a * 0.22 * clamp01(staerke)));
  g.lineCap = 'round';
  g.lineJoin = 'round';
  for (let i = n; i >= 1; i--) {
    g.lineWidth = breiteRand * i / n * 2;
    g.stroke(s);
  }
}

/** Rotierende Lichtstrahlen. */
function strahlen(g, cx, cy, r, n, winkel, c, breiteS) {
  if (r <= 0) {
    return;
  }
  const p = new Path2D();
  for (let i = 0; i < n; i++) {
    const a0 = winkel + i * 2 * Math.PI / n;
    const a1 = a0 + Math.PI / n * breiteS;
    p.moveTo(cx, cy);
    p.lineTo(cx + Math.cos(a0) * r, cy + Math.sin(a0) * r);
    p.lineTo(cx + Math.cos(a1) * r, cy + Math.sin(a1) * r);
    p.closePath();
  }
  g.fillStyle = radial(g, cx, cy, r, [[0, c], [1, alpha(c, 0)]]);
  g.fill(p);
}

// ---- symbole.js
// ====================================================================================
// symbole.js – die sechs Walzensymbole als Vektorgrafik im 2D-Comicstil
// (dicke Kontur, Cel-Shading, Glanzpunkte). Die Sonne ist der Joker.
// ====================================================================================

const KAEFER = 0, MUENZE = 1, KLEE = 2, SONNE = 3, TEUFEL = 4, LEER = 5;
const SYMBOLE = [
  { id: 0, name: 'KAEFER', titel: 'Marienkäfer', turm: 0 },
  { id: 1, name: 'MUENZE', titel: 'Münze', turm: 1 },
  { id: 2, name: 'KLEE', titel: 'Kleeblatt', turm: 2 },
  { id: 3, name: 'SONNE', titel: 'Sonne', turm: -1 },
  { id: 4, name: 'TEUFEL', titel: 'Teufel', turm: -1 },
  { id: 5, name: 'LEER', titel: 'Kein Symbol', turm: -1 }
];
const ANZAHL_SYMBOLE = 6;
const TURM_SYMBOL = [KAEFER, MUENZE, KLEE];

const SymbolGrafik = (function () {
  const K = 0.034; // Konturstaerke in Symbol-Einheiten
  const cache = new Map();

  function bild(s, px, teil) {
    px = Math.max(8, Math.round(px));
    const k = s + '_' + px + '_' + (teil || '');
    let b = cache.get(k);
    if (!b) {
      b = neuesCanvas(px, px);
      const g = b.getContext('2d');
      g.scale(px, px);
      if (teil === 'strahlen') {
        sonneStrahlen(g);
      } else if (teil === 'kern') {
        sonneKern(g);
      } else {
        zeichne(g, s);
      }
      cache.set(k, b);
    }
    return b;
  }

  /** Vertikal verwischte Variante fuer die drehende Walze. */
  function unscharf(s, px) {
    px = Math.max(8, Math.round(px));
    const k = s + '_blur_' + px;
    let b = cache.get(k);
    if (!b) {
      const src = bild(s, px);
      const r = Math.floor(px / 4);
      b = neuesCanvas(px, px + 2 * r);
      const g = b.getContext('2d');
      const n = 11;
      g.globalAlpha = 0.2;
      for (let i = 0; i < n; i++) {
        g.drawImage(src, 0, Math.round(2.0 * r * i / (n - 1)));
      }
      b.rand = r;
      cache.set(k, b);
    }
    return b;
  }

  function leeren() {
    cache.clear();
  }

  function zeichne(g, s) {
    switch (s) {
      case KLEE: klee(g); break;
      case MUENZE: muenze(g); break;
      case KAEFER: kaefer(g); break;
      case SONNE: sonne(g); break;
      case TEUFEL: teufel(g); break;
      case LEER: leer(g); break;
      default: break;
    }
  }

  // ---------------------------------------------------------------- Helfer
  function bodenSchatten(g, cx, cy, w, h) {
    g.save();
    g.translate(cx, cy);
    g.scale(1, h / w);
    g.fillStyle = radial(g, 0, 0, w / 2, [[0, C(60, 20, 0, 110)], [1, C(60, 20, 0, 0)]]);
    g.fillRect(-w / 2, -w / 2, w, w);
    g.restore();
  }

  /** Cel-Shading: Grundfarbe, dunkle Sichel unten rechts, Kontur. */
  function cel(g, p, basis, dunkel, versatz, kontur) {
    g.save();
    g.clip(p);
    g.fillStyle = css(dunkel);
    g.fill(p);
    g.translate(-versatz, -versatz);
    g.fillStyle = css(basis);
    g.fill(p);
    g.restore();
    if (kontur > 0) {
      strich(g, kontur);
      g.strokeStyle = css(KONTUR);
      g.stroke(p);
    }
  }

  function glanz(g, x, y, w, h, winkel, a) {
    g.save();
    g.translate(x, y);
    g.rotate(winkel);
    g.fillStyle = 'rgba(255,255,255,' + (a / 255) + ')';
    g.beginPath();
    g.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }

  function rad(grad) {
    return grad * Math.PI / 180;
  }

  // ---------------------------------------------------------------- Leerfeld
  function leer(g) {
    g.save();
    g.beginPath();
    g.rect(0, 0, 1, 0.5);
    g.clip();
    g.translate(0, -0.5);
    klee(g);
    g.restore();
    g.save();
    g.beginPath();
    g.rect(0, 0.5, 1, 0.5);
    g.clip();
    g.translate(0, 0.5);
    muenze(g);
    g.restore();
    g.fillStyle = 'rgba(30,10,0,0.47)';
    g.fillRect(0, 0, 1, 1);
    strich(g, 0.03, true);
    g.strokeStyle = 'rgba(255,220,150,0.78)';
    g.stroke(linieP(0.05, 0.5, 0.95, 0.5));
  }

  // ---------------------------------------------------------------- Kleeblatt
  let herz = null;
  function herzBlatt() {
    if (herz) {
      return herz;
    }
    const p = new Path2D();
    p.moveTo(0, 0);
    p.bezierCurveTo(-0.07, -0.05, -0.2, -0.11, -0.2, -0.24);
    p.bezierCurveTo(-0.2, -0.33, -0.12, -0.37, -0.07, -0.37);
    p.bezierCurveTo(-0.03, -0.37, 0, -0.34, 0, -0.3);
    p.bezierCurveTo(0, -0.34, 0.03, -0.37, 0.07, -0.37);
    p.bezierCurveTo(0.12, -0.37, 0.2, -0.33, 0.2, -0.24);
    p.bezierCurveTo(0.2, -0.11, 0.07, -0.05, 0, 0);
    p.closePath();
    herz = p;
    return p;
  }

  function klee(g) {
    bodenSchatten(g, 0.5, 0.93, 0.62, 0.09);
    const cx = 0.5, cy = 0.46;
    const stiel = new Path2D();
    stiel.moveTo(cx, cy);
    stiel.bezierCurveTo(0.52, 0.66, 0.6, 0.8, 0.7, 0.9);
    rand(g, stiel, KONTUR, 0.085);
    rand(g, stiel, C(40, 150, 60), 0.042);
    const basis = C(62, 196, 82), dunkel = C(24, 128, 50);
    for (let i = 0; i < 4; i++) {
      const grad = i * 90 + 8;
      const blatt = pfadTransformiert(herzBlatt(), cx, cy, grad);
      cel(g, blatt, basis, dunkel, 0.035, K);
      g.save();
      g.translate(cx, cy);
      g.rotate(rad(grad));
      strich(g, 0.016);
      g.strokeStyle = 'rgba(170,245,150,0.745)';
      g.beginPath();
      g.moveTo(0, -0.04);
      g.quadraticCurveTo(0.012, -0.16, 0, -0.27);
      g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.667)';
      g.fill(ellP(-0.15, -0.3, 0.07, 0.045));
      g.restore();
    }
    cel(g, kreisP(cx, cy, 0.045), C(90, 210, 100), dunkel, 0.01, 0.022);
    fuell(g, sternP(0.82, 0.14, 0.055, 0.012), C(255, 255, 255, 230));
  }

  // ---------------------------------------------------------------- Muenze
  function muenze(g) {
    bodenSchatten(g, 0.5, 0.93, 0.66, 0.09);
    const cx = 0.5, cy = 0.49;
    cel(g, kreisP(cx, cy + 0.035, 0.4), C(214, 140, 0), C(150, 90, 0), 0.02, K);
    cel(g, kreisP(cx, cy, 0.4), C(255, 200, 40), C(222, 150, 10), 0.04, K);
    strich(g, 0.012);
    g.strokeStyle = 'rgba(170,100,0,0.667)';
    g.beginPath();
    for (let i = 0; i < 36; i++) {
      const a = i * Math.PI * 2 / 36;
      g.moveTo(cx + Math.cos(a) * 0.345, cy + Math.sin(a) * 0.345);

    cel(g, kreisP(cx, cy, 0.3), C(255, 214, 72), C(236, 166, 20), -0.03, 0.02);

    glanz(g, 0.34, 0.27, 0.2, 0.08, rad(-38), 170);
    glanz(g, 0.27, 0.37, 0.05, 0.035, rad(-38), 150);
    fuell(g, sternP(0.8, 0.18, 0.07, 0.014), C(255, 255, 255, 240));
    fuell(g, sternP(0.2, 0.74, 0.04, 0.01), C(255, 255, 255, 240));
  }

  // ---------------------------------------------------------------- Marienkaefer
  function kaefer(g) {
    bodenSchatten(g, 0.5, 0.93, 0.66, 0.09);
    strich(g, 0.034);
    g.strokeStyle = css(KONTUR);
    const beine = [[0.22, 0.45, 0.1, 0.38], [0.2, 0.6, 0.07, 0.62], [0.24, 0.76, 0.12, 0.86],
      [0.78, 0.45, 0.9, 0.38], [0.8, 0.6, 0.93, 0.62], [0.76, 0.76, 0.88, 0.86]];
    g.beginPath();
    for (let i = 0; i < beine.length; i++) {
      g.moveTo(beine[i][0], beine[i][1]);
      g.lineTo(beine[i][2], beine[i][3]);
    }
    g.stroke();
    strich(g, 0.024);
    g.beginPath();
    g.moveTo(0.45, 0.14);
    g.quadraticCurveTo(0.38, 0.04, 0.3, 0.06);
    g.moveTo(0.55, 0.14);
    g.quadraticCurveTo(0.62, 0.04, 0.7, 0.06);
    g.stroke();
    g.fillStyle = css(KONTUR);
    g.fill(kreisP(0.3, 0.06, 0.028));
    g.fill(kreisP(0.7, 0.06, 0.028));
    const koerper = ellP(0.17, 0.24, 0.66, 0.68);

    g.clip(koerper);

    const punkte = [[0.34, 0.45, 0.065], [0.66, 0.45, 0.065], [0.29, 0.66, 0.058], [0.71, 0.66, 0.058],

    for (let i = 0; i < punkte.length; i++) {

    strich(g, 0.026, true);
    g.strokeStyle = css(KONTUR);

    cel(g, ellP(0.33, 0.1, 0.34, 0.24), C(40, 26, 20), C(10, 6, 4), 0.02, K);
    for (let i = 0; i < 2; i++) {

  // ---------------------------------------------------------------- Sonne (Joker)
  /** Leuchtender Hof und 16 geschwungene Strahlen (dreht sich, wenn die Sonne steht). */
  function sonneStrahlen(g) {
    const cx = 0.5, cy = 0.5;
    g.fillStyle = radial(g, cx, cy, 0.5, [[0, C(255, 214, 80, 150)], [0.55, C(255, 150, 20, 70)], [1, C(255, 120, 0, 0)]]);
    g.fillRect(0, 0, 1, 1);
    for (let durchgang = 0; durchgang < 2; durchgang++) {
      for (let i = 0; i < 16; i++) {
        const lang = i % 2 === 0;
        if ((durchgang === 0) !== lang) {
          continue; // erst die langen, dann die kurzen darueber
        }
        const a = i * Math.PI / 8 - Math.PI / 2;
        const r0 = 0.24, r1 = lang ? 0.49 : 0.405;
        const da = lang ? 0.2 : 0.16;
        const swirl = lang ? 0.2 : 0.16;
        const p = new Path2D();
        p.moveTo(cx + Math.cos(a - da) * r0, cy + Math.sin(a - da) * r0);
        const rm = (r0 + r1) * 0.55;
        p.quadraticCurveTo(cx + Math.cos(a - da * 0.1) * rm, cy + Math.sin(a - da * 0.1) * rm,
          cx + Math.cos(a + swirl) * r1, cy + Math.sin(a + swirl) * r1);
        p.quadraticCurveTo(cx + Math.cos(a + da * 1.25) * rm * 0.92, cy + Math.sin(a + da * 1.25) * rm * 0.92,
          cx + Math.cos(a + da) * r0, cy + Math.sin(a + da) * r0);
        p.closePath();
        if (lang) {
          cel(g, p, C(255, 164, 20), C(222, 96, 0), 0.022, 0.03);
        } else {
          cel(g, p, C(255, 214, 60), C(236, 150, 10), 0.018, 0.028);
        }
      }
    }
  }

  /** Glutkern der Sonne mit Glanz. */
  function sonneKern(g) {
    const cx = 0.5, cy = 0.5;
    g.fillStyle = radial(g, cx, cy, 0.36, [[0.6, C(255, 240, 150, 150)], [1, C(255, 200, 60, 0)]]);
    g.fillRect(0, 0, 1, 1);
    const kern = kreisP(cx, cy, 0.265);
    cel(g, kern, C(255, 212, 46), C(240, 140, 6), 0.045, K);
    g.save();
    g.clip(kern);
    g.fillStyle = radial(g, 0.43, 0.41, 0.26, [[0, C(255, 252, 214, 240)], [0.55, C(255, 232, 110, 120)], [1, C(255, 214, 60, 0)]]);
    g.fillRect(0, 0, 1, 1);
    // feine Glutwirbel
    strich(g, 0.014);
    g.strokeStyle = 'rgba(255,150,20,0.55)';
    for (let i = 0; i < 3; i++) {
      g.beginPath();
      g.arc(cx + 0.02, cy + 0.03, 0.12 + i * 0.05, rad(10 + i * 25), rad(95 + i * 25));
      g.stroke();
    }
    g.restore();
    strich(g, 0.018);
    g.strokeStyle = 'rgba(255,246,190,0.7)';
    g.beginPath();
    g.arc(cx, cy, 0.215, rad(200), rad(290));
    g.stroke();
    glanz(g, 0.41, 0.37, 0.15, 0.065, rad(-38), 200);
    glanz(g, 0.34, 0.45, 0.035, 0.024, rad(-38), 170);
    fuell(g, sternP(0.82, 0.18, 0.07, 0.014), C(255, 255, 255, 240));
    fuell(g, sternP(0.2, 0.8, 0.045, 0.01), C(255, 255, 255, 230));
  }

  function sonne(g) {
    sonneStrahlen(g);
    sonneKern(g);
  }

  // ---------------------------------------------------------------- Teufel
  function teufel(g) {
    g.fillStyle = radial(g, 0.5, 0.52, 0.5, [[0, C(90, 0, 0, 150)], [0.6, C(60, 0, 0, 70)], [1, C(40, 0, 0, 0)]]);
    g.fillRect(0, 0, 1, 1);
    bodenSchatten(g, 0.5, 0.96, 0.6, 0.08);
    const hornB = C(70, 20, 22), hornD = C(24, 4, 6);

      const h = new Path2D();
      if (i === 0) {
        h.moveTo(0.26, 0.34);
        h.bezierCurveTo(0.14, 0.26, 0.1, 0.12, 0.16, 0.03);
        h.bezierCurveTo(0.2, 0.14, 0.28, 0.2, 0.4, 0.25);
      } else {
        h.moveTo(0.74, 0.34);
        h.bezierCurveTo(0.86, 0.26, 0.9, 0.12, 0.84, 0.03);
        h.bezierCurveTo(0.8, 0.14, 0.72, 0.2, 0.6, 0.25);
      }
      h.closePath();
      cel(g, h, hornB, hornD, 0.02, K);
    }
    const rot = C(214, 24, 30), rotD = C(120, 6, 12);
    const ol = new Path2D();
    ol.moveTo(0.23, 0.46);
    ol.lineTo(0.08, 0.4);
    ol.lineTo(0.22, 0.6);
    ol.closePath();
    const orr = new Path2D();
    orr.moveTo(0.77, 0.46);
    orr.lineTo(0.92, 0.4);
    orr.lineTo(0.78, 0.6);
    orr.closePath();
    cel(g, ol, rot, rotD, 0.015, K);
    cel(g, orr, rot, rotD, 0.015, K);
    const kopf = new Path2D();
    kopf.moveTo(0.5, 0.2);
    kopf.bezierCurveTo(0.72, 0.2, 0.8, 0.36, 0.79, 0.52);
    kopf.bezierCurveTo(0.78, 0.7, 0.62, 0.84, 0.5, 0.86);
    kopf.bezierCurveTo(0.38, 0.84, 0.22, 0.7, 0.21, 0.52);
    kopf.bezierCurveTo(0.2, 0.36, 0.28, 0.2, 0.5, 0.2);
    kopf.closePath();
    cel(g, kopf, rot, rotD, 0.045, K);
    const bart = new Path2D();
    bart.moveTo(0.42, 0.8);
    bart.quadraticCurveTo(0.5, 0.86, 0.58, 0.8);
    bart.lineTo(0.5, 0.99);
    bart.closePath();
    cel(g, bart, C(40, 8, 10), C(10, 0, 0), 0.01, K);
    strich(g, 0.05);
    g.strokeStyle = css(KONTUR);
    g.beginPath();
    g.moveTo(0.3, 0.37);
    g.lineTo(0.46, 0.44);
    g.moveTo(0.7, 0.37);
    g.lineTo(0.54, 0.44);
    g.stroke();
    for (let i = 0; i < 2; i++) {
      const ax = i === 0 ? 0.38 : 0.62;
      const auge = new Path2D();
      auge.moveTo(ax - 0.07, 0.49);
      auge.quadraticCurveTo(ax, 0.45, ax + 0.07, 0.49);
      auge.quadraticCurveTo(ax, 0.55, ax - 0.07, 0.49);
      auge.closePath();
      fuell(g, auge, C(255, 220, 40));

    g.clip(mund);
    g.fillStyle = '#fff';
    for (let i = 0; i < 6; i++) {
      const x = 0.33 + i * 0.068;
      g.beginPath();
      g.moveTo(x, 0.6);
      g.lineTo(x + 0.068, 0.6);
      g.lineTo(x + 0.034, 0.69);

    g.restore();
    rand(g, mund, KONTUR, 0.026);
    glanz(g, 0.38, 0.28, 0.14, 0.05, rad(-20), 110);

  return { bild: bild, unscharf: unscharf, leeren: leeren };
})();

/**
 * Zeichnet ein Symbol zentriert. rot = Drehwinkel der Sonnenstrahlen (undefined = statisch).
 */
function zeichneSymbol(g, s, cx, cy, groesse, px, skX, skY, blur, alphaWert, rot) {
  const aW = alphaWert === undefined ? 1 : alphaWert;
  const altA = g.globalAlpha;
  if (blur < 1) {
    g.save();
    g.globalAlpha = altA * clamp01(aW * (1 - blur));
    g.translate(cx, cy);
    g.scale(skX, skY);
    if (s === SONNE && rot !== undefined && !Stil.sparmodus) {
      g.save();
      g.rotate(rot);
      g.drawImage(SymbolGrafik.bild(s, px, 'strahlen'), -groesse / 2, -groesse / 2, groesse, groesse);
      g.restore();
      g.drawImage(SymbolGrafik.bild(s, px, 'kern'), -groesse / 2, -groesse / 2, groesse, groesse);
    } else {
      g.drawImage(SymbolGrafik.bild(s, px), -groesse / 2, -groesse / 2, groesse, groesse);
    }
    g.restore();
  }
  if (blur > 0) {
    const b = SymbolGrafik.unscharf(s, px);
    const k = groesse / Math.max(8, Math.round(px));
    const h = b.height * k;
    g.save();
    g.globalAlpha = altA * clamp01(aW * blur);
    g.drawImage(b, cx - groesse / 2, cy - h / 2, groesse, h);
    g.restore();
  }
}

// ---- walze.js
// ====================================================================================
// walze.js – die 1x1-Walze: ein senkrechtes Symbolband, von dem genau ein Feld sichtbar ist.
// Das Ergebnis steht vorher fest; die Walze laeuft schnell und stoppt mit kurzem Nachfedern.
// ====================================================================================

function floorMod(a, n) {
  return ((a % n) + n) % n;
}

/** Deterministischer Zufall (nur fuer die Band-Reihenfolge). */
function seedZufall(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class Walze {
  constructor(konf) {
    this.band = [];
    this.pos = 0;
    this.tempo = 0;
    this.zustand = 'STEHT';
    this.t = 0;
    this.ziel = 0;
    this.stoppAngefordert = false;
    this.bremsStart = 0;
    this.bremsDist = 0;
    this.bremsDauer = 0;
    this.back = 0;
    this.vMax = 30;
    this.stoppZeit = 99;
    this.baueBand(konf);
    this.pos = Math.floor(Math.random() * this.band.length);
  }

  /** Optisches Band: Symbole gemaess ihrer Gewichte (nur Optik; LEER hat kein eigenes Bild). */
  baueBand(k) {
    const l = [];
    let summe = 0;
    for (let i = 0; i < ANZAHL_SYMBOLE; i++) {
      summe += k.gewicht[i];
    }
    summe = Math.max(1, summe);
    for (let s = 0; s < ANZAHL_SYMBOLE; s++) {
      if (s === LEER) {
        continue;
      }
      let n = Math.round(30 * k.gewicht[s] / summe);
      if (k.gewicht[s] > 0) {
        n = Math.max(2, n);
      }
      for (let i = 0; i < n; i++) {
        l.push(s);
      }
    }
    if (l.length === 0) {
      l.push(KLEE);
    }
    const r = seedZufall(7);
    for (let i = l.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const x = l[i];
      l[i] = l[j];
      l[j] = x;
    }
    for (let versuch = 0; versuch < 200; versuch++) {
      let ok = true;
      for (let i = 0; i < l.length; i++) {
        const j = (i + 1) % l.length;
        if (l[i] === l[j]) {
          const z = Math.floor(r() * l.length);
          const x = l[j];
          l[j] = l[z];
          l[z] = x;
          ok = false;
        }
      }
      if (ok) {
        break;
      }
    }
    this.band = l;
    if (this.zustand === 'STEHT') {
      this.pos = floorMod(Math.round(this.pos), l.length);
    }
  }

  steht() {
    return this.zustand === 'STEHT';
  }

  symbol() {
    const frac = this.pos - Math.floor(this.pos);
    if (this.zustand === 'STEHT' && frac > 0.25 && frac < 0.75) {
      return LEER;
    }
    return this.band[floorMod(Math.round(this.pos), this.band.length)];
  }

  zeige(s) {
    this.pos = this.indexVon(s);
  }

  indexVon(s) {
    const treffer = [];
    for (let i = 0; i < this.band.length; i++) {
      if (this.band[i] === s) {
        treffer.push(i);
      }
    }
    if (treffer.length === 0) {
      const i = Math.floor(Math.random() * this.band.length);
      this.band[i] = s;
      return i;
    }
    return treffer[Math.floor(Math.random() * treffer.length)];
  }

  starte() {
    this.zustand = 'ANLAUF';
    this.t = 0;
    this.stoppAngefordert = false;
  }

  /** LEER = die Walze bleibt genau zwischen zwei Symbolen stehen. */
  stoppe(s) {
    const len = this.band.length;
    if (s === LEER) {
      let i = Math.floor(Math.random() * len);
      for (let v = 0; v < 20 && this.band[i] === this.band[(i + 1) % len]; v++) {
        i = Math.floor(Math.random() * len);
      }
      this.ziel = i + 0.5;
    } else {
      this.ziel = this.indexVon(s);
    }
    this.stoppAngefordert = true;
    if (this.zustand === 'LAEUFT') {
      this.beginneBremsen();
    }
  }

  beginneBremsen() {
    const frac = (((this.pos - this.ziel) % 1) + 1) % 1;
    const d = 2 + frac;
    this.pos = this.ziel + d;
    this.bremsStart = this.pos;
    this.bremsDist = d;
    this.back = Walze.findeBack(d, 0.09);
    this.bremsDauer = (this.back + 3) * d / this.vMax;
    this.zustand = 'BREMST';
    this.t = 0;
  }

  static findeBack(d, ueber) {
    let lo = 0, hi = 4;
    for (let i = 0; i < 40; i++) {
      const s = (lo + hi) / 2;
      const o = 4 * s * s * s / (27 * (s + 1) * (s + 1)) * d;
      if (o > ueber) {
        hi = s;
      } else {
        lo = s;
      }
    }
    return lo;
  }

  static backEase(u, s) {
    const v = u - 1;
    return 1 + (s + 1) * v * v * v + s * v * v;
  }

  static backEaseAbl(u, s) {
    const v = u - 1;
    return 3 * (s + 1) * v * v + 2 * s * v;
  }

  /** true genau in dem Moment, in dem die Walze stehen bleibt. */
  update(dt) {
    const len = this.band.length;
    switch (this.zustand) {
      case 'STEHT':
        this.stoppZeit += dt;
        this.tempo = 0;
        return false;
      case 'ANLAUF': {
        this.t += dt;
        const zurueck = 0.07, beschl = 0.14;
        if (this.t < zurueck) {
          this.pos += 2.2 * dt;
          this.tempo = 2.2;
        } else {
          const u = Math.min(1, (this.t - zurueck) / beschl);
          const v = this.vMax * u * u;
          this.pos -= v * dt;
          this.tempo = v;
          if (u >= 1) {
            this.zustand = 'LAEUFT';
            if (this.stoppAngefordert) {
              this.beginneBremsen();
            }
          }
        }
        return false;
      }
      case 'LAEUFT':
        this.pos -= this.vMax * dt;
        this.tempo = this.vMax;
        if (this.pos < 0) {
          this.pos += len * Math.ceil(-this.pos / len + 1);
        }
        return false;
      case 'BREMST': {
        this.t += dt;
        const u = Math.min(1, this.t / this.bremsDauer);
        this.pos = this.bremsStart - this.bremsDist * Walze.backEase(u, this.back);
        this.tempo = Math.abs(this.bremsDist * Walze.backEaseAbl(u, this.back) / this.bremsDauer);
        if (u >= 1) {
          this.pos = this.ziel;
          this.zustand = 'STEHT';
          this.stoppZeit = 0;
          this.tempo = 0;
          return true;
        }
        return false;
      }
      default:
        return false;
    }
  }

  zeichne(g, x, y, w, h, symbolPx, aufl, hopY, skX, skY, sonnenRot) {
    g.save();
    g.beginPath();
    g.rect(x, y, w, h);
    g.clip();
    const len = this.band.length;
    const basis = Math.floor(this.pos);
    const frac = this.pos - basis;
    const blur = clamp01((this.tempo - 8) / 14);
    const px = Math.round(symbolPx * aufl);
    for (let r = -1; r <= 1; r++) {
      const idx = floorMod(basis + r, len);
      const cy = y + h / 2 + (r - frac) * h;
      const s = this.band[idx];
      const stehend = this.zustand === 'STEHT' && r === 0;
      zeichneSymbol(g, s, x + w / 2, cy + (stehend ? hopY : 0), symbolPx, px, stehend ? skX : 1, stehend ? skY : 1,
        blur, 1, stehend || blur < 0.05 ? sonnenRot : undefined);
    }
    g.restore();
  }
}

// ---- partikel.js
// ====================================================================================
// partikel.js – Muenzregen, Funken, Funkelsterne, Konfetti, Glut und zerfallende Turmbloecke.
// ====================================================================================

class Partikel {
  constructor() {
    this.liste = [];
    this.hoehe = 800;
  }

  anzahl() {
    return this.liste.length;
  }

  leeren() {
    this.liste.length = 0;
  }

  neu(typ, x, y) {
    return { typ: typ, x: x, y: y, vx: 0, vy: 0, leben: 0, max: 1, gr: 1, rot: 0, vrot: 0, schwerkraft: 0, breite: 0, farbe: GELB };
  }

  add(t) {
    if (this.liste.length < (Stil.sparmodus ? 150 : 1200)) {
      this.liste.push(t);
    }
  }

  muenzen(x, y, n, kraft) {
    for (let i = 0; i < n; i++) {
      const t = this.neu('M', x + (Math.random() - 0.5) * 40, y + (Math.random() - 0.5) * 20);
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.9;
      const v = (260 + Math.random() * 420) * kraft;
      t.vx = Math.cos(a) * v;
      t.vy = Math.sin(a) * v;
      t.schwerkraft = 1150;
      t.max = 1.6 + Math.random() * 0.9;
      t.gr = 15 + Math.random() * 12;
      t.rot = Math.random() * Math.PI;
      t.vrot = 6 + Math.random() * 10;
      this.add(t);
    }
  }

  funken(x, y, n, c, tempo) {
    for (let i = 0; i < n; i++) {
      const t = this.neu('F', x, y);
      const a = Math.random() * Math.PI * 2;
      const v = tempo * (0.3 + Math.random() * 0.7);
      t.vx = Math.cos(a) * v;
      t.vy = Math.sin(a) * v;
      t.schwerkraft = 120;
      t.max = 0.45 + Math.random() * 0.5;
      t.gr = 2.5 + Math.random() * 3.5;
      t.farbe = c;
      this.add(t);
    }
  }

  sterne(x, y, w, h, n, c) {
    for (let i = 0; i < n; i++) {
      const t = this.neu('S', x + Math.random() * w, y + Math.random() * h);
      t.vy = -20 - Math.random() * 30;
      t.max = 0.6 + Math.random() * 0.8;
      t.gr = 6 + Math.random() * 10;
      t.farbe = c;
      this.add(t);
    }
  }

  konfetti(x, y, breiteK, n) {
    const farben = [GELB, ROT, GRUEN, GOLD, VIOLETT, WEISS, C(60, 160, 255)];
    for (let i = 0; i < n; i++) {
      const t = this.neu('K', x + (Math.random() - 0.5) * breiteK, y - Math.random() * 60);
      t.vx = (Math.random() - 0.5) * 220;
      t.vy = 80 + Math.random() * 200;
      t.schwerkraft = 160;
      t.max = 2.5 + Math.random() * 1.5;
      t.gr = 7 + Math.random() * 7;
      t.rot = Math.random() * 6;
      t.vrot = (Math.random() - 0.5) * 14;
      t.farbe = farben[Math.floor(Math.random() * farben.length)];
      this.add(t);
    }
  }

  glut(x, y) {
    const t = this.neu('G', x, y);
    t.vx = (Math.random() - 0.5) * 40;
    t.vy = -70 - Math.random() * 110;
    t.schwerkraft = -8;
    t.max = 3 + Math.random() * 3;
    t.gr = 1.5 + Math.random() * 2;
    t.rot = Math.random() * 6;
    t.farbe = Math.random() < 0.5 ? C(255, 170, 40) : C(255, 90, 20);
    this.add(t);
  }

  block(x, y, w, h, c, verzoegerung) {
    const t = this.neu('B', x, y);
    t.breite = w;
    t.gr = h;
    t.vx = (Math.random() - 0.5) * 260;
    t.vy = -80 - Math.random() * 160;
    t.schwerkraft = 1500;
    t.max = 1.6;
    t.leben = -verzoegerung;
    t.vrot = (Math.random() - 0.5) * 9;
    t.farbe = c;
    this.add(t);
  }

  update(dt) {
    const l = this.liste;
    for (let i = l.length - 1; i >= 0; i--) {
      const t = l[i];
      t.leben += dt;
      if (t.leben < 0) {
        continue;
      }
      t.vy += t.schwerkraft * dt;
      if (t.typ === 'K') {
        t.vx *= Math.pow(0.4, dt);
        t.x += Math.sin(t.leben * 4 + t.rot) * 40 * dt;
      }
      t.x += t.vx * dt;
      t.y += t.vy * dt;
      t.rot += t.vrot * dt;
      if (t.leben > t.max || t.y > this.hoehe + 80) {
        l.splice(i, 1);
      }
    }
  }

  zeichne(g) {
    const l = this.liste;
    for (let i = 0; i < l.length; i++) {
      const t = l[i];
      if (t.leben < 0) {
        continue;
      }
      const rest = 1 - t.leben / t.max;
      const a = Math.min(1, rest * 4);
      switch (t.typ) {
        case 'M': {
          const w = Math.max(2, t.gr * Math.abs(Math.cos(t.rot)));
          const h = t.gr;
          g.globalAlpha = a;
          g.fillStyle = css(KONTUR);
          g.beginPath();
          g.ellipse(t.x, t.y, w / 2 + 1.5, h / 2 + 1.5, 0, 0, Math.PI * 2);
          g.fill();
          g.fillStyle = 'rgb(214,140,0)';
          g.beginPath();
          g.ellipse(t.x, t.y, w / 2, h / 2, 0, 0, Math.PI * 2);
          g.fill();
          g.fillStyle = 'rgb(255,214,60)';
          g.beginPath();
          g.ellipse(t.x, t.y, w * 0.36, h * 0.36, 0, 0, Math.PI * 2);
          g.fill();
          if (Math.cos(t.rot) > 0.3) {
            g.globalAlpha = a * 0.78;
            g.fillStyle = '#fff';
            g.beginPath();
            g.ellipse(t.x - w * 0.14, t.y - h * 0.21, w * 0.11, h * 0.09, 0, 0, Math.PI * 2);
            g.fill();
          }
          g.globalAlpha = 1;
          break;
        }
        case 'F': {
          const r = t.gr * (0.5 + rest * 0.5);
          g.fillStyle = css(alpha(t.farbe, 70 * a));
          g.beginPath();
          g.arc(t.x, t.y, r * 2.4, 0, Math.PI * 2);
          g.fill();
          g.fillStyle = css(alpha(heller(t.farbe, 0.6), 255 * a));
          g.beginPath();
          g.arc(t.x, t.y, r, 0, Math.PI * 2);
          g.fill();
          break;
        }
        case 'S': {
          const f = Math.sin(Math.PI * (t.leben / t.max));
          const r = t.gr * f;
          if (r > 0.2) {
            fuell(g, sternP(t.x, t.y, r, r * 0.22), alpha(t.farbe, 230 * f));
          }
          break;
        }
        case 'G': {
          const f = Math.min(1, rest * 2) * (0.6 + 0.4 * Math.sin(t.leben * 9 + t.rot));
          const r = t.gr;
          const wx = t.x + Math.sin(t.leben * 2 + t.rot) * 12;
          g.fillStyle = css(alpha(t.farbe, 60 * f));
          g.beginPath();
          g.arc(wx, t.y, r * 3, 0, Math.PI * 2);
          g.fill();
          g.fillStyle = css(alpha(heller(t.farbe, 0.5), 230 * f));
          g.beginPath();
          g.arc(wx, t.y, r, 0, Math.PI * 2);
          g.fill();
          break;
        }
        case 'K': {
          g.save();
          g.translate(t.x, t.y);
          g.rotate(t.rot);
          const sx = Math.abs(Math.cos(t.leben * 7 + t.rot));
          g.fillStyle = css(alpha(t.farbe, 255 * a));
          g.fillRect(-t.gr / 2 * sx, -t.gr * 0.3, t.gr * sx, t.gr * 0.6);
          g.restore();
          break;
        }
        case 'B': {
          g.save();
          g.translate(t.x, t.y);
          g.rotate(t.rot);
          const r = rrP(-t.breite / 2, -t.gr / 2, t.breite, t.gr, 10);
          g.globalAlpha = a;
          fuell(g, r, t.farbe);
          rand(g, r, KONTUR, 3);
          g.restore();
          break;
        }
        default:
          break;
      }
    }
  }
}

// ---- knopf.js
// ====================================================================================
// knopf.js – selbst gezeichnete Knoepfe (Comic-Spielhalle) mit Hover-, Druck- und Puls-
// Animation sowie der Schieberegler fuer die Einstellungen.
// ====================================================================================

const GRAU_AUS = C(150, 130, 110);

class Knopf {
  constructor(text, x, y, w, h, farbe, aktion) {
    this.text = text;
    this.unter = null;
    this.x = x;
    this.y = y;
    this.w = w;
    this.h = h;
    this.farbe = farbe;
    this.art = 'NORMAL';
    this.icon = null;
    this.aktiv = true;
    this.sichtbar = true;
    this.puls = false;
    this.gewaehlt = false;
    this.gedrueckt = false;
    this.hover = 0;
    this.druck = 0;
    this.aktion = aktion;
    this.schrift = 0;
    this.off = null; // Verschiebung der Gruppe (fuer die Trefferpruefung)
  }

  setArt(a) {
    this.art = a;
    return this;
  }

  setIcon(i) {
    this.icon = i;
    this.art = 'ICON';
    return this;
  }

  setUnter(u) {
    this.unter = u;
    return this;
  }

  setze(x, y, w, h) {
    this.x = x;
    this.y = y;
    if (w !== undefined) {
      this.w = w;
      this.h = h;
    }
    return this;
  }

  trifft(px, py) {
    if (!this.sichtbar) {
      return false;
    }
    if (this.off) {
      px -= this.off.x;
      py -= this.off.y;
    }
    // etwas groesserer Trefferbereich fuer Finger
    const extra = Knopf.touch ? 6 : 0;
    if (this.art === 'RUND' || this.art === 'ICON') {
      const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
      const r = this.w / 2 + 3 + extra;
      return (px - cx) * (px - cx) + (py - cy) * (py - cy) <= r * r;
    }
    return px >= this.x - extra && px <= this.x + this.w + extra && py >= this.y - extra && py <= this.y + this.h + extra;
  }

  update(dt, ueber) {
    const zh = (ueber && this.aktiv && this.sichtbar) ? 1 : 0;
    this.hover += (zh - this.hover) * Math.min(1, dt * 14);
    const zd = (this.gedrueckt && ueber && this.aktiv) ? 1 : 0;
    this.druck += (zd - this.druck) * Math.min(1, dt * 28);
  }

  ausloesen() {
    if (this.aktiv && this.sichtbar && this.aktion) {
      this.aktion();
    }
  }

  signatur() {
    return this.text + (this.aktiv ? 'a' : '-') + (this.gewaehlt ? 'g' : '-') + (this.puls ? 'p' : '-') + Math.round(this.hover * 8)
      + Math.round(this.druck * 8) + this.icon + css(this.farbe) + this.x + ',' + this.y + (this.unter || '') + ';';
  }

  zeichne(g, zeit) {
    if (!this.sichtbar) {
      return;
    }
    const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
    const sk = 1 - 0.05 * this.druck + 0.025 * this.hover;
    g.save();
    if (Math.abs(sk - 1) > 0.002) {
      g.translate(cx, cy);
      g.scale(sk, sk);
      g.translate(-cx, -cy);
    }
    switch (this.art) {
      case 'RUND': this.zeichneRund(g, zeit); break;
      case 'ICON': this.zeichneIcon(g); break;
      case 'CHIP': this.zeichneChip(g); break;
      default: this.zeichneNormal(g, zeit); break;
    }
    g.restore();
  }

  pulsWert(zeit) {
    if (!this.aktiv) {
      return 0;
    }
    const p = this.puls ? (Stil.sparmodus ? 0.6 : 0.45 + 0.4 * Math.sin(zeit * 5.5)) : 0;
    return Math.max(p, this.hover * 0.7);
  }

  zeichneNormal(g, zeit) {
    const x = this.x, y = this.y, w = this.w, h = this.h;
    const f = this.aktiv ? this.farbe : GRAU_AUS;
    const rr = Math.min(18, h * 0.45);
    const r = rrP(x, y, w, h, rr);
    glowRand(g, r, heller(f, 0.4), this.pulsWert(zeit), 12);
    const tiefe = 5 * (1 - this.druck);
    const unten = rrP(x, y + tiefe, w, h, rr);
    fuell(g, unten, dunkler(f, 0.55));
    rand(g, unten, KONTUR, 3.2);
    g.fillStyle = gp(g, x, y, heller(f, 0.28 + 0.12 * this.hover), x, y + h, dunkler(f, 0.12));
    g.fill(r);
    g.save();
    g.clip(r);
    fuell(g, rrP(x + 6, y + 4, w - 12, h * 0.42, h * 0.3), C(255, 255, 255, 70));
    g.restore();
    rand(g, r, KONTUR, 3.2);
    const tc = this.aktiv ? WEISS : C(245, 235, 220);
    const fs = this.schrift > 0 ? this.schrift : Math.min(22, h * 0.38);
    const ty = this.unter ? y + h * 0.54 : y + h / 2 + fs * 0.36;
    comicText(g, this.text, titel(fs), tc, x + w / 2, ty, 0, 2.2);
    if (this.unter) {
      text(g, this.unter, sans(10.5), alpha(WEISS, this.aktiv ? 210 : 150), x + w / 2, y + h * 0.82, 0);
    }
  }

  zeichneRund(g, zeit) {
    const x = this.x, y = this.y, w = this.w, h = this.h;
    const r = w / 2, mx = x + r, my = y + r;
    const f = this.aktiv ? this.farbe : GRAU_AUS;
    glowRand(g, ellP(x, y, w, h), heller(f, 0.4), this.pulsWert(zeit), 16);
    const tiefe = 7 * (1 - this.druck);
    fuell(g, ellP(x - 3, y - 3 + tiefe, w + 6, h + 6), KONTUR);
    g.fillStyle = gp(g, x, y, C(255, 236, 150), x, y + h, C(200, 120, 0));
    g.fill(ellP(x, y, w, h));
    rand(g, ellP(x, y, w, h), KONTUR, 3.4);
    const ri = r * 0.8;
    const innen = kreisP(mx, my, ri);
    const gr = g.createRadialGradient(mx - ri * 0.3, my - ri * 0.4, 0, mx - ri * 0.3, my - ri * 0.4, ri * 1.5);
    gr.addColorStop(0, css(heller(f, 0.45 + 0.15 * this.hover)));
    gr.addColorStop(0.55, css(f));
    gr.addColorStop(1, css(dunkler(f, 0.45)));
    g.fillStyle = gr;
    g.fill(innen);
    fuell(g, ellP(mx - ri * 0.62, my - ri * 0.86, ri * 1.24, ri * 0.7), C(255, 255, 255, 90));
    rand(g, innen, KONTUR, 3);
    const fs = this.schrift > 0 ? this.schrift : r * 0.36;
    comicText(g, this.text, titel(fs), WEISS, mx, my + fs * 0.3 - (this.unter ? 4 : 0), 0, 2.4);
    if (this.unter) {
      text(g, this.unter, sans(10), C(255, 255, 255, 220), mx, my + fs * 0.3 + 16, 0);
    }
  }

  zeichneChip(g) {
    const x = this.x, y = this.y, w = this.w, h = this.h;
    const r = rrP(x, y, w, h, h);
    const f = this.aktiv ? this.farbe : GRAU_AUS;
    if (this.gewaehlt) {
      glowRand(g, r, heller(f, 0.3), 0.7, 10);
    }
    fuell(g, rrP(x + 3, y + 3, w, h, h), C(60, 20, 0, 90));
    g.fillStyle = this.gewaehlt ? gp(g, x, y, heller(f, 0.3), x, y + h, dunkler(f, 0.1))
      : gp(g, x, y, mix(CREME, WEISS, this.hover * 0.5), x, y + h, C(240, 222, 180));
    g.fill(r);
    rand(g, r, KONTUR, 2.6);
    const fs = this.schrift > 0 ? this.schrift : Math.min(15, h * 0.42);
    text(g, this.text, titel(fs), this.gewaehlt ? WEISS : KONTUR, x + w / 2, y + h / 2 + fs * 0.36, 0);
  }

  zeichneIcon(g) {
    const x = this.x, y = this.y, w = this.w, h = this.h;
    const r = w / 2, mx = x + r, my = y + r;
    fuell(g, ellP(x + 3, y + 3, w, h), C(60, 20, 0, 90));
    const f = this.aktiv ? (this.farbe || CREME) : C(200, 185, 160);
    g.fillStyle = gp(g, x, y, heller(f, 0.3 + this.hover * 0.4), x, y + h, dunkler(f, 0.1));
    g.fill(ellP(x, y, w, h));
    rand(g, ellP(x, y, w, h), KONTUR, 2.6);
    Knopf.zeichneSymbol(g, this.icon, mx, my, r * 0.55, KONTUR);
  }

  static zeichneSymbol(g, icon, mx, my, s, c) {
    g.fillStyle = css(c);
    g.strokeStyle = css(c);
    strich(g, s * 0.2);
    switch (icon) {
      case 'ZAHNRAD': {
        const p = new Path2D();
        p.arc(mx, my, s * 0.68, 0, Math.PI * 2);
        for (let i = 0; i < 8; i++) {
          const a = i * Math.PI / 4;
          const m = new DOMMatrix().translateSelf(mx, my).rotateSelf(a * 180 / Math.PI);
          const z = new Path2D();
          z.rect(-s * 0.17, -s * 0.98, s * 0.34, s * 0.4);
          p.addPath(z, m);
        }
        p.moveTo(mx + s * 0.3, my);
        p.arc(mx, my, s * 0.3, 0, Math.PI * 2, true);
        g.fill(p);
        break;
      }
      case 'TON_AN':
      case 'TON_AUS': {
        const p = new Path2D();
        p.moveTo(mx - s * 0.85, my - s * 0.3);
        p.lineTo(mx - s * 0.45, my - s * 0.3);
        p.lineTo(mx, my - s * 0.75);
        p.lineTo(mx, my + s * 0.75);
        p.lineTo(mx - s * 0.45, my + s * 0.3);
        p.lineTo(mx - s * 0.85, my + s * 0.3);
        p.closePath();
        g.fill(p);
        g.beginPath();
        if (icon === 'TON_AN') {
          g.arc(mx + s * 0.1, my, s * 0.45, -50 * Math.PI / 180, 50 * Math.PI / 180);
          g.moveTo(mx + s * 0.2 + Math.cos(-50 * Math.PI / 180) * s * 0.8, my + Math.sin(-50 * Math.PI / 180) * s * 0.8);
          g.arc(mx + s * 0.2, my, s * 0.8, -50 * Math.PI / 180, 50 * Math.PI / 180);
        } else {
          g.moveTo(mx + s * 0.25, my - s * 0.35);
          g.lineTo(mx + s * 0.85, my + s * 0.35);
          g.moveTo(mx + s * 0.85, my - s * 0.35);
          g.lineTo(mx + s * 0.25, my + s * 0.35);
        }
        g.stroke();
        break;
      }
      case 'STATISTIK':
        g.fill(rrP(mx - s * 0.8, my + s * 0.05, s * 0.4, s * 0.7, 3));
        g.fill(rrP(mx - s * 0.2, my - s * 0.4, s * 0.4, s * 1.15, 3));
        g.fill(rrP(mx + s * 0.4, my - s * 0.8, s * 0.4, s * 1.55, 3));
        break;
      case 'INFO':
        text(g, '?', titel(s * 1.8), c, mx, my + s * 0.62, 0);
        break;
      case 'SCHLIESSEN':
        g.beginPath();
        g.moveTo(mx - s * 0.6, my - s * 0.6);
        g.lineTo(mx + s * 0.6, my + s * 0.6);
        g.moveTo(mx + s * 0.6, my - s * 0.6);
        g.lineTo(mx - s * 0.6, my + s * 0.6);
        g.stroke();
        break;
      case 'MINUS':
        strich(g, s * 0.3);
        g.beginPath();
        g.moveTo(mx - s * 0.6, my);
        g.lineTo(mx + s * 0.6, my);
        g.stroke();
        break;
      case 'PLUS':
        strich(g, s * 0.3);
        g.beginPath();
        g.moveTo(mx - s * 0.6, my);
        g.lineTo(mx + s * 0.6, my);
        g.moveTo(mx, my - s * 0.6);
        g.lineTo(mx, my + s * 0.6);
        g.stroke();
        break;
      case 'INSTALL': {
        // Pfeil nach unten in eine Schale (auf den Startbildschirm holen)
        strich(g, s * 0.24);
        g.beginPath();
        g.moveTo(mx, my - s * 0.85);
        g.lineTo(mx, my + s * 0.2);
        g.moveTo(mx - s * 0.42, my - s * 0.2);
        g.lineTo(mx, my + s * 0.22);
        g.lineTo(mx + s * 0.42, my - s * 0.2);
        g.moveTo(mx - s * 0.85, my + s * 0.25);
        g.lineTo(mx - s * 0.85, my + s * 0.8);
        g.lineTo(mx + s * 0.85, my + s * 0.8);
        g.lineTo(mx + s * 0.85, my + s * 0.25);
        g.stroke();
        break;
      }
      case 'TEILEN': {
        // iOS-Teilen-Symbol: Kasten mit Pfeil nach oben
        strich(g, s * 0.16);
        g.beginPath();
        g.moveTo(mx - s * 0.35, my - s * 0.25);
        g.lineTo(mx - s * 0.7, my - s * 0.25);
        g.lineTo(mx - s * 0.7, my + s * 0.9);
        g.lineTo(mx + s * 0.7, my + s * 0.9);
        g.lineTo(mx + s * 0.7, my - s * 0.25);
        g.lineTo(mx + s * 0.35, my - s * 0.25);
        g.moveTo(mx, my + s * 0.3);
        g.lineTo(mx, my - s * 1.0);
        g.moveTo(mx - s * 0.35, my - s * 0.65);
        g.lineTo(mx, my - s * 1.0);
        g.lineTo(mx + s * 0.35, my - s * 0.65);
        g.stroke();
        break;
      }
      case 'HOME': {
        // Plus im abgerundeten Quadrat ("Zum Home-Bildschirm")
        strich(g, s * 0.16);
        g.stroke(rrP(mx - s * 0.8, my - s * 0.8, s * 1.6, s * 1.6, s * 0.7));
        strich(g, s * 0.18);
        g.beginPath();
        g.moveTo(mx - s * 0.4, my);
        g.lineTo(mx + s * 0.4, my);
        g.moveTo(mx, my - s * 0.4);
        g.lineTo(mx, my + s * 0.4);
        g.stroke();
        break;
      }
      default:
        break;
    }
  }
}
Knopf.touch = false;

/** Schieberegler fuer das Einstellungsmenue. */
class Regler {
  constructor(name, x, y, w, min, max, wert, farbe) {
    this.name = name;
    this.x = x;
    this.y = y;
    this.w = w;
    this.min = min;
    this.max = max;
    this.wert = wert;
    this.farbe = farbe;
    this.ziehen = false;
    this.hover = 0;
  }

  trifft(px, py) {
    const e = Knopf.touch ? 10 : 0;
    return px >= this.x - 12 - e && px <= this.x + this.w + 12 + e && py >= this.y - 14 - e && py <= this.y + 14 + e;
  }

  setzeAus(px) {
    const u = clamp01((px - this.x) / this.w);
    const neu = Math.round(this.min + u * (this.max - this.min));
    if (neu !== this.wert) {
      this.wert = neu;
      return true;
    }
    return false;
  }

  update(dt, ueber) {
    const z = (ueber || this.ziehen) ? 1 : 0;
    this.hover += (z - this.hover) * Math.min(1, dt * 14);
  }

  zeichne(g) {
    const x = this.x, y = this.y, w = this.w;
    const u = this.max > this.min ? (this.wert - this.min) / (this.max - this.min) : 0;
    const spur = rrP(x, y - 5, w, 10, 10);
    fuell(g, spur, C(60, 30, 5, 70));
    if (u > 0) {
      g.fillStyle = gp(g, x, y, heller(this.farbe, 0.2), x + w, y, this.farbe);
      g.fill(rrP(x, y - 5, Math.max(10, w * u), 10, 10));
    }
    rand(g, spur, KONTUR, 2);
    const kx = x + w * u;
    const r = 10 + 2 * this.hover;
    if (this.hover > 0.01) {
      glow(g, kx, y, r * 2.2, alpha(this.farbe, 120 * this.hover));
    }
    fuell(g, kreisP(kx + 2, y + 2, r), C(60, 20, 0, 90));
    g.fillStyle = gp(g, kx, y - r, WEISS, kx, y + r, C(240, 220, 180));
    g.fill(kreisP(kx, y, r));
    rand(g, kreisP(kx, y, r), KONTUR, 2.6);
    fuell(g, kreisP(kx, y, 4), this.farbe);
  }
}

// ---- klang.js
// ====================================================================================
// klang.js – alle Sounds werden zur Laufzeit synthetisch erzeugt (keine Dateien noetig):
// Walzenlauf, Stopp-Klacken, Stufentoene, Sonnen-Fanfare, Teufelslachen, Herzklopfen,
// Muenzen und Jackpot. Identische Synthese wie in der BlueJ-Version (Web Audio API).
// ====================================================================================

const TOENE = ['KNOPF', 'DREH', 'STOPP', 'SONNE', 'TEUFEL', 'SPITZE', 'JACKPOT', 'CASHOUT', 'MUENZE', 'FEHLER', 'HERZ',
  'RISIKO_HOCH', 'RISIKO_TIEF', 'RISIKO_GEWONNEN', 'RISIKO_VERLOREN', 'KARTE',
  'STUFE1', 'STUFE2', 'STUFE3', 'STUFE4', 'STUFE5', 'STUFE6', 'STUFE7', 'STUFE8', 'STUFE9', 'STUFE10'];

class Klang {
  constructor() {
    this.an = true;
    this.ctx = null;
    this.master = null;
    this.puffer = {};
    this.aktiv = {};
    this.rate = 44100;
    this.bereit = false;
  }

  static stufe(n) {
    n = Math.max(1, Math.min(10, n));
    return 'STUFE' + n;
  }

  /** Muss aus einer Nutzeraktion heraus aufgerufen werden (Browser-Regel fuer Audio). */
  entsperren() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) {
          return;
        }
        this.ctx = new AC();
        this.rate = this.ctx.sampleRate || 44100;
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.9;
        this.master.connect(this.ctx.destination);
        // stiller Puffer: schaltet Audio auf iOS frei
        const b = this.ctx.createBuffer(1, 1, this.rate);
        const q = this.ctx.createBufferSource();
        q.buffer = b;
        q.connect(this.master);
        q.start(0);
        this.laden();
      }
      if (this.ctx.state === 'suspended' || this.ctx.state === 'interrupted') {
        this.ctx.resume();
      }
    } catch (e) {
      this.ctx = null;
    }
  }

  laden() {
    // zuerst die haeufigen Toene, der Rest in kleinen Portionen (kein Ruckeln)
    const reihenfolge = ['KNOPF', 'DREH', 'STOPP', 'MUENZE', 'RISIKO_HOCH', 'RISIKO_TIEF'];
    for (let i = 0; i < reihenfolge.length; i++) {
      this.erzeugePuffer(reihenfolge[i]);
    }
    const rest = TOENE.filter(function (t) {
      return reihenfolge.indexOf(t) < 0;
    });
    const self = this;
    let i = 0;
    function weiter() {
      const ende = Math.min(rest.length, i + 3);
      for (; i < ende; i++) {
        self.erzeugePuffer(rest[i]);
      }
      if (i < rest.length) {
        setTimeout(weiter, 16);
      } else {
        self.bereit = true;
      }
    }
    setTimeout(weiter, 30);
  }

  erzeugePuffer(ton) {
    if (this.puffer[ton] || !this.ctx) {
      return;
    }
    const daten = Klang.erzeuge(ton, this.rate);
    let max = 0;
    for (let i = 0; i < daten.length; i++) {
      const v = Math.abs(daten[i]);
      if (v > max) {
        max = v;
      }
    }
    const norm = max > 0.95 ? 0.95 / max : 1;
    const b = this.ctx.createBuffer(1, daten.length, this.rate);
    const kanal = b.getChannelData(0);
    for (let i = 0; i < daten.length; i++) {
      kanal[i] = daten[i] * norm;
    }
    this.puffer[ton] = b;
  }

  spiele(ton) {
    if (!this.an || !this.ctx) {
      return;
    }
    try {
      if (this.ctx.state !== 'running') {
        this.ctx.resume();
      }
      if (!this.puffer[ton]) {
        this.erzeugePuffer(ton);
      }
      const b = this.puffer[ton];
      if (!b) {
        return;
      }
      const pool = (ton === 'MUENZE' || ton === 'STOPP' || ton === 'KNOPF') ? 4 : 2;
      let liste = this.aktiv[ton];
      if (!liste) {
        liste = this.aktiv[ton] = [];
      }
      while (liste.length >= pool) {
        const alt = liste.shift();
        try {
          alt.stop();
        } catch (e) {
          // schon beendet
        }
      }
      const q = this.ctx.createBufferSource();
      q.buffer = b;
      q.connect(this.master);
      q.onended = function () {
        const i = liste.indexOf(q);
        if (i >= 0) {
          liste.splice(i, 1);
        }
      };
      liste.push(q);
      q.start(0);
    } catch (e) {
      // stumm weiterspielen
    }
  }

  // ---------------------------------------------------------------- Synthese
  static puffer(sek, rate) {
    return new Float32Array(Math.floor(sek * rate));
  }

  /** Ton mit Frequenz-Gleiten, Obertoenen und Huellkurve (Attack + exponentieller Abfall). */
  static ton(buf, rate, start, dauer, f0, f1, amp, ober, attack, abfall) {
    const s0 = Math.floor(start * rate);
    const n = Math.floor(dauer * rate);
    let phase = 0;
    const ausklang = rate * 0.004;
    for (let i = 0; i < n && s0 + i < buf.length; i++) {
      const t = i / rate;
      const u = i / n;
      const f = f0 + (f1 - f0) * u;
      phase += 2 * Math.PI * f / rate;
      let env = (t < attack ? t / attack : 1) * Math.exp(-abfall * t);
      env *= Math.min(1, (n - i) / ausklang);
      let v = 0;
      for (let k = 0; k < ober.length; k++) {
        if (ober[k] !== 0) {
          v += ober[k] * Math.sin(phase * (k + 1));
        }
      }
      buf[s0 + i] += v * amp * env;
    }
  }

  static rauschen(buf, rate, start, dauer, amp, abfall, seed) {
    const r = seedZufall(seed * 7919 + 13);
    const s0 = Math.floor(start * rate);
    const n = Math.floor(dauer * rate);
    let tief = 0;
    for (let i = 0; i < n && s0 + i < buf.length; i++) {
      const t = i / rate;
      tief = tief * 0.6 + (r() * 2 - 1) * 0.4;
      buf[s0 + i] += tief * amp * Math.exp(-abfall * t);
    }
  }

  /** "Ha"-Silbe mit Vokal-Formanten fuer das Teufelslachen. */
  static silbe(buf, rate, start, dauer, f0, amp) {
    const s0 = Math.floor(start * rate);
    const n = Math.floor(dauer * rate);
    let phase = 0;
    for (let i = 0; i < n && s0 + i < buf.length; i++) {
      const t = i / rate;
      const u = i / n;
      const f = f0 * (1 - 0.12 * u) * (1 + 0.02 * Math.sin(t * 2 * Math.PI * 6));
      phase += 2 * Math.PI * f / rate;
      const env = Math.min(1, t / 0.012) * Math.pow(1 - u, 1.6);
      let v = 0;
      for (let k = 1; k <= 24; k++) {
        const fk = f * k;
        const a1 = (fk - 720) / 180, a2 = (fk - 1150) / 200, a3 = (fk - 2500) / 350;
        const form = Math.exp(-a1 * a1) + 0.7 * Math.exp(-a2 * a2) + 0.25 * Math.exp(-a3 * a3) + 0.15 / k;
        v += form * Math.sin(phase * k);
      }
      buf[s0 + i] += v * amp * env * 0.35;
    }
  }

  static erzeuge(ton, rate) {
    const SINUS = [1];
    const WARM = [1, 0.35, 0.12];
    const HELL = [1, 0.5, 0.33, 0.2, 0.12];
    const GLOCKE = [1, 0, 0.45, 0, 0.25, 0, 0.1];
    const T = Klang.ton, R = Klang.rauschen;
    let b;
    switch (ton) {
      case 'KNOPF':
        b = Klang.puffer(0.06, rate);
        T(b, rate, 0, 0.05, 1500, 1200, 0.25, SINUS, 0.001, 60);
        return b;
      case 'DREH':
        b = Klang.puffer(0.55, rate);
        for (let i = 0; i < 14; i++) {
          T(b, rate, i * 0.036, 0.03, 900 + i * 25, 850 + i * 25, 0.16, WARM, 0.001, 90);
        }
        R(b, rate, 0, 0.5, 0.05, 3, 1);
        return b;
      case 'STOPP':
        b = Klang.puffer(0.2, rate);
        T(b, rate, 0, 0.14, 180, 70, 0.8, WARM, 0.001, 30);
        R(b, rate, 0, 0.03, 0.5, 120, 2);
        T(b, rate, 0, 0.05, 2400, 2000, 0.15, SINUS, 0.001, 80);
        return b;
      case 'SONNE': {
        // strahlende Fanfare: Dur-Arpeggio mit Glocken-Schimmer
        b = Klang.puffer(1.1, rate);
        const n = [523.25, 659.25, 783.99, 1046.5];
        for (let i = 0; i < n.length; i++) {
          T(b, rate, i * 0.09, 0.5, n[i], n[i], 0.28, HELL, 0.006, 5);
        }
        T(b, rate, 0.36, 0.7, 1046.5, 1046.5, 0.18, HELL, 0.01, 3);
        T(b, rate, 0.36, 0.7, 1318.5, 1318.5, 0.14, HELL, 0.01, 3);
        T(b, rate, 0.36, 0.7, 1568, 1568, 0.12, GLOCKE, 0.01, 3);
        T(b, rate, 0.5, 0.6, 2093, 2093, 0.07, GLOCKE, 0.005, 4);
        T(b, rate, 0.58, 0.5, 2637, 2637, 0.05, GLOCKE, 0.005, 5);
        return b;
      }
      case 'TEUFEL': {
        b = Klang.puffer(1.7, rate);
        T(b, rate, 0, 1.2, 70, 40, 0.8, WARM, 0.002, 2.4);
        T(b, rate, 0, 0.9, 110, 55, 0.35, HELL, 0.002, 3);
        R(b, rate, 0, 0.3, 0.3, 10, 3);
        const hoehe = [260, 245, 228, 210, 190, 170];
        for (let i = 0; i < hoehe.length; i++) {
          Klang.silbe(b, rate, 0.18 + i * 0.19, 0.16, hoehe[i], 1.0);
        }
        return b;
      }
      case 'SPITZE': {
        b = Klang.puffer(1.3, rate);
        const n = [783.99, 987.77, 1174.66, 1567.98, 1975.53];
        for (let i = 0; i < n.length; i++) {
          T(b, rate, i * 0.07, 0.6, n[i], n[i], 0.22, GLOCKE, 0.003, 4);
        }
        T(b, rate, 0.4, 0.9, 2349.3, 2349.3, 0.15, GLOCKE, 0.003, 3);
        return b;
      }
      case 'JACKPOT': {
        b = Klang.puffer(2.6, rate);
        const n = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98, 2093];
        for (let r = 0; r < 2; r++) {
          for (let i = 0; i < n.length; i++) {
            T(b, rate, r * 0.6 + i * 0.07, 0.5, n[i], n[i], 0.2, HELL, 0.004, 4);
          }
        }
        T(b, rate, 1.2, 1.3, 1046.5, 1046.5, 0.2, HELL, 0.02, 1.4);
        T(b, rate, 1.2, 1.3, 1318.5, 1318.5, 0.16, HELL, 0.02, 1.4);
        T(b, rate, 1.2, 1.3, 1567.98, 1567.98, 0.14, HELL, 0.02, 1.4);
        return b;
      }
      case 'CASHOUT':
        b = Klang.puffer(0.9, rate);
        T(b, rate, 0, 0.4, 1318.5, 1318.5, 0.25, GLOCKE, 0.002, 7);
        T(b, rate, 0.08, 0.6, 1975.5, 1975.5, 0.25, GLOCKE, 0.002, 5);
        T(b, rate, 0.16, 0.7, 2637, 2637, 0.2, GLOCKE, 0.002, 4);
        R(b, rate, 0, 0.12, 0.12, 30, 4);
        return b;
      case 'MUENZE':
        b = Klang.puffer(0.14, rate);
        T(b, rate, 0, 0.12, 2637, 2637, 0.14, GLOCKE, 0.001, 30);
        T(b, rate, 0.03, 0.1, 3520, 3520, 0.1, SINUS, 0.001, 35);
        return b;
      case 'FEHLER':
        b = Klang.puffer(0.25, rate);
        T(b, rate, 0, 0.22, 160, 140, 0.35, HELL, 0.002, 6);
        return b;
      case 'RISIKO_HOCH':
        b = Klang.puffer(0.09, rate);
        T(b, rate, 0, 0.08, 988, 988, 0.22, HELL, 0.001, 25);
        return b;
      case 'RISIKO_TIEF':
        b = Klang.puffer(0.09, rate);
        T(b, rate, 0, 0.08, 659, 659, 0.22, HELL, 0.001, 25);
        return b;
      case 'RISIKO_GEWONNEN': {
        b = Klang.puffer(0.7, rate);
        const n = [659.25, 880, 1108.7, 1318.5, 1760];
        for (let i = 0; i < n.length; i++) {
          T(b, rate, i * 0.06, 0.35, n[i], n[i], 0.22, HELL, 0.002, 7);
        }
        return b;
      }
      case 'RISIKO_VERLOREN':
        b = Klang.puffer(0.8, rate);
        T(b, rate, 0, 0.7, 420, 110, 0.35, HELL, 0.003, 3);
        T(b, rate, 0, 0.3, 90, 50, 0.5, WARM, 0.002, 8);
        return b;
      case 'KARTE':
        b = Klang.puffer(0.16, rate);
        R(b, rate, 0, 0.14, 0.35, 30, 9);
        T(b, rate, 0.02, 0.08, 1800, 1200, 0.08, SINUS, 0.001, 40);
        return b;
      case 'HERZ':
        b = Klang.puffer(0.7, rate);
        T(b, rate, 0, 0.16, 70, 45, 0.9, WARM, 0.003, 18);
        T(b, rate, 0.2, 0.16, 62, 40, 0.7, WARM, 0.003, 18);
        return b;
      default: {
        // STUFE1..STUFE10: mit der Stufe steigender, energischer Ton
        const n = parseInt(ton.substring(5), 10) || 1;
        const basis = 392 * Math.pow(2, (n - 1) * 2 / 12);
        b = Klang.puffer(0.5, rate);
        T(b, rate, 0, 0.12, basis, basis * 1.02, 0.24, HELL, 0.002, 12);
        T(b, rate, 0.06, 0.14, basis * 1.26, basis * 1.27, 0.22, HELL, 0.002, 12);
        T(b, rate, 0.12, 0.34, basis * 1.5, basis * 1.5, 0.22, HELL, 0.002, 7);
        T(b, rate, 0.12, 0.34, basis * 2, basis * 2, 0.08, GLOCKE, 0.002, 7);
        return b;
      }
    }
  }
